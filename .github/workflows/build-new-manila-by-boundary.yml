name: Build new Manila PBFs by boundary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Manila/scripts/build_new_manila_by_boundary.py"
      - ".github/workflows/build-new-manila-by-boundary.yml"

permissions:
  contents: write

concurrency:
  group: manila-pbf-enrichment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vector tile and geometry libraries
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile shapely
      - name: Build new PBF dataset without changing source tiles
        run: python -u Manila/scripts/build_new_manila_by_boundary.py
      - name: Commit generated New_Manila dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Manila/New_Manila
          git diff --cached --quiet || git commit -m "Generate new Manila PBF tiles partitioned by boundaries"
          git push origin HEAD:main
