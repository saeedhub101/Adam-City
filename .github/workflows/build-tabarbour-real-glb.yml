name: Build Tabarbour GLBs with source data and visual evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tabarbour-real-glb.yml"
      - "middle east/UnityGame/tools/crop_tabarbour_layers.py"
      - "middle east/UnityGame/tools/import_tabarbour_source_layers.py"
      - "middle east/UnityGame/tools/import_tabarbour_wikimedia_photos.py"
      - "middle east/UnityGame/tools/import_tabarbour_visual_evidence.py"
      - "middle east/UnityGame/tools/import_tabarbour_regional_sources.py"
      - "middle east/UnityGame/tools/build_tabarbour_dem_terrain.py"
      - "middle east/UnityGame/tools/build_amman_glb.py"
      - "middle east/Jordan/layers/**"
      - "middle east/Jordan/osm/jordan-latest.osm.pbf"

permissions:
  contents: write

concurrency:
  group: tabarbour-real-glb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout source layers, existing exporter and Tabarbour outputs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
          sparse-checkout: |
            /middle east/Jordan/layers/
            /middle east/Jordan/osm/jordan-latest.osm.pbf
            /middle east/UnityGame/tools/build_amman_glb.py
            /middle east/UnityGame/tools/crop_tabarbour_layers.py
            /middle east/UnityGame/tools/import_tabarbour_source_layers.py
            /middle east/UnityGame/tools/import_tabarbour_wikimedia_photos.py
            /middle east/UnityGame/tools/import_tabarbour_visual_evidence.py
            /middle east/UnityGame/tools/import_tabarbour_regional_sources.py
            /middle east/UnityGame/tools/build_tabarbour_dem_terrain.py
            /middle east/BuildGLB/tabarbour-real/
          sparse-checkout-cone-mode: false

      - name: Install free local processing tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender osmium-tool gzip awscli gdal-bin
          python3 -m pip install --user ijson
          blender --version
          osmium --version
          python3 -c 'import ijson; print("streaming JSON ready")'

      - name: Inventory local inputs and resume state
        shell: bash
        run: |
          set -euo pipefail
          echo "TABARBOUR_BOUNDS=35.90,31.96,35.99,32.04"
          for f in buildings building_details streets streetnames addresses landcover water places; do
            p="middle east/Jordan/layers/$f.geojson.gz"
            if [ -s "$p" ]; then printf 'SOURCE_PRESENT %s %s bytes\n' "$p" "$(stat -c %s "$p")"; else printf 'SOURCE_MISSING %s\n' "$p"; fi
          done
          if [ -s "middle east/Jordan/osm/jordan-latest.osm.pbf" ]; then
            echo "SOURCE_PRESENT Jordan OSM PBF $(stat -c %s "middle east/Jordan/osm/jordan-latest.osm.pbf") bytes"
          else
            echo "SOURCE_MISSING Jordan OSM PBF; mapped infrastructure extraction will be skipped"
          fi
          find "middle east/BuildGLB/tabarbour-real/glb" -maxdepth 1 -type f -name 'tabarbour_*.glb' -printf 'EXISTING_GLB %f %s bytes\n' 2>/dev/null || true

      - name: Download fresh source data directly from Geofabrik
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "https://download.geofabrik.de/asia/jordan-latest.osm.pbf" \
            -o "$RUNNER_TEMP/source/jordan-latest.osm.pbf"
          test -s "$RUNNER_TEMP/source/jordan-latest.osm.pbf"
          sha256sum "$RUNNER_TEMP/source/jordan-latest.osm.pbf"
          osmium extract -b 35.90,31.96,35.99,32.04 \
            "$RUNNER_TEMP/source/jordan-latest.osm.pbf" \
            -o "$RUNNER_TEMP/source/tabarbour.osm.pbf" --overwrite
          osmium export "$RUNNER_TEMP/source/tabarbour.osm.pbf" \
            --attributes=type,id -o "$RUNNER_TEMP/source/tabarbour-source.geojson" --overwrite
          python3 "middle east/UnityGame/tools/import_tabarbour_source_layers.py" \
            "$RUNNER_TEMP/source/tabarbour-source.geojson" "$RUNNER_TEMP/fresh-jordan-layers"

      - name: Prepare fresh source layers for GLB builder
        shell: bash
        run: |
          set -euo pipefail
          python3 "middle east/UnityGame/tools/crop_tabarbour_layers.py" \
            "$RUNNER_TEMP/fresh-jordan-layers" "$RUNNER_TEMP/tabarbour-layers"

      - name: Extract locally mapped transport, trees and infrastructure
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tabarbour-infrastructure.geojson"
          gz="$RUNNER_TEMP/tabarbour-infrastructure.geojson.gz"
          pbf="$RUNNER_TEMP/source/tabarbour.osm.pbf"
          if [ -s "$pbf" ]; then
            if osmium tags-filter "$pbf" -o "$RUNNER_TEMP/tabarbour-infra.osm.pbf" --overwrite \
              nwr/railway nwr/waterway nwr/power nwr/public_transport \
              nwr/highway=traffic_signals nwr/highway=bus_stop nwr/highway=stop \
              nwr/amenity=bus_station nwr/amenity=parking nwr/traffic_sign \
              nwr/natural=tree nwr/natural=water nwr/natural=wetland \
              nwr/landuse nwr/leisure nwr/aeroway nwr/man_made nwr/barrier \
              nwr/bridge nwr/tunnel nwr/water nwr/sewer nwr/utility nwr/route; then
              osmium export "$RUNNER_TEMP/tabarbour-infra.osm.pbf" --attributes=type,id -o "$out" --overwrite
              gzip -1 -c "$out" > "$gz"
              echo "INFRASTRUCTURE_EXTRACTED bytes=$(stat -c %s "$gz")"
            else
              echo "INFRASTRUCTURE_EXTRACTION_FAILED; continuing with locally saved thematic layers"
              printf '{"type":"FeatureCollection","features":[]}' > "$out"
              gzip -1 -c "$out" > "$gz"
            fi
          else
            echo "PBF_MISSING_OR_CLIP_FAILED; continuing with locally saved thematic layers"
            printf '{"type":"FeatureCollection","features":[]}' > "$out"
            gzip -1 -c "$out" > "$gz"
          fi

      - name: Import keyless OpenFreeMap vector tiles and satellite imagery
        shell: bash
        run: |
          set -euo pipefail
          python3 "middle east/UnityGame/tools/import_tabarbour_regional_sources.py"

      - name: Download Copernicus GLO-30 DEM and generate terrain GLB
        shell: bash
        run: |
          set -euo pipefail
          root="middle east/BuildGLB/tabarbour-real/source"
          mkdir -p "$root/dem"
          prefix="s3://copernicus-dem-30m/Copernicus_DSM_COG_10_N31_00_E035_00_DEM/"
          aws s3 cp "$prefix" "$root/dem/" --recursive --no-sign-request --region eu-central-1
          dem=$(find "$root/dem" -type f -iname '*.tif' -size +1M | head -n 1)
          test -n "$dem"
          gdalinfo "$dem" > "$root/dem/dem-gdalinfo.txt"
          gdal_translate -q -of XYZ -outsize 240 240 "$dem" "$RUNNER_TEMP/tabarbour-dem.xyz"
          blender --background --python-exit-code 1 \
            --python "middle east/UnityGame/tools/build_tabarbour_dem_terrain.py" -- \
            --input "$RUNNER_TEMP/tabarbour-dem.xyz" \
            --out "$root/dem/tabarbour-terrain-dem.glb" \
            --west 35.90 --east 35.99 --south 31.96 --north 32.04
          test -s "$root/dem/tabarbour-terrain-dem.glb"

      - name: Persist clipped OSM source and classified layers during the run
        shell: bash
        run: |
          set -euo pipefail
          root="middle east/BuildGLB/tabarbour-real/source"
          mkdir -p "$root/layers"
          cp "$RUNNER_TEMP/source/tabarbour.osm.pbf" "$root/tabarbour.osm.pbf"
          cp "$RUNNER_TEMP/fresh-jordan-layers/"*.geojson.gz "$root/layers/"
          cp "$RUNNER_TEMP/fresh-jordan-layers/source-import-report.json" "$root/layers/"
          cp "$RUNNER_TEMP/tabarbour-infrastructure.geojson.gz" "$root/"
          if [ -s "$root/openfreemap-tabarbour-z12-17.mbtiles" ]; then echo "OPENFREEMAP_MBtiles_PRESENT"; fi
          if [ -s "$root/nasa-gibs-sentinel2-tabarbour.mbtiles" ]; then echo "NASA_GIBS_SENTINEL2_MBtiles_PRESENT"; fi
          cat > "$root/source-manifest.json" <<'JSON'
          {
            "area": "Tabarbour, Amman, Jordan",
            "bounds": {"west": 35.90, "south": 31.96, "east": 35.99, "north": 32.04},
            "source": "Geofabrik Jordan OSM PBF, clipped locally with osmium",
            "layers": ["buildings", "building_details", "streets", "streetnames", "addresses", "water", "landcover", "places", "infrastructure"],
            "policy": "Keyless public download; source data checkpointed before GLB generation"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$root"
          if git diff --cached --quiet; then
            echo "Source checkpoint unchanged."
            exit 0
          fi
          git commit -m "Checkpoint Tabarbour source data before GLB generation"
          for attempt in 1 2 3 4 5; do
            git fetch origin main || { sleep "$attempt"; continue; }
            git rebase origin/main || { git rebase --abort; sleep "$attempt"; continue; }
            git push origin HEAD:main && exit 0
            sleep "$attempt"
          done
          echo "::error::Could not persist Tabarbour source checkpoint"
          exit 1

      - name: Discover and checkpoint freely licensed Wikimedia photo evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 "middle east/UnityGame/tools/import_tabarbour_wikimedia_photos.py"

      - name: Import keyless Wikipedia article evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 "middle east/UnityGame/tools/import_tabarbour_visual_evidence.py"

      - name: Build and checkpoint Tabarbour regional GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "middle east/BuildGLB/tabarbour-real/glb"
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python-exit-code 1 \
            --python "middle east/UnityGame/tools/build_amman_glb.py" -- \
            --data "$RUNNER_TEMP/tabarbour-layers" \
            --out "middle east/BuildGLB/tabarbour-real/glb" \
            --west 35.90 --east 35.99 --south 31.96 --north 32.04 \
            --tile 0.02 --city Tabarbour --prefix tabarbour \
            --repo_commit true --force false \
            --infra_path "$RUNNER_TEMP/tabarbour-infrastructure.geojson.gz"

      - name: Validate actual GLB payloads and write final source report
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, json, pathlib, sys
          root=pathlib.Path("middle east/BuildGLB/tabarbour-real")
          out=root/"glb"
          files=sorted(out.glob("tabarbour_*.glb"))
          report={"area":"Tabarbour, Amman, Jordan","bounds":{"west":35.90,"east":35.99,"south":31.96,"north":32.04},
                  "source_policy":"Fresh Geofabrik/OpenStreetMap download; Wikipedia/Wikimedia keyless public endpoints; license-checked Wikimedia image candidates; no API keys or tokens; generated assets are stored locally for offline runtime",
                  "glb_count":len(files),"glbs":[],"errors":[]}
          if not (out/"manifest.json").is_file():
              report["errors"].append("manifest.json missing")
          for p in files:
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              with p.open("rb") as f: header=f.read(12)
              item={"file":p.name,"bytes":p.stat().st_size,"sha256":digest,
                    "valid_glb_header":len(header)==12 and header[:4]==b"glTF"}
              if not item["valid_glb_header"]: report["errors"].append("invalid GLB header: "+p.name)
              if p.stat().st_size>95*1024*1024: report["errors"].append("GLB too large for safe repository storage: "+p.name)
              report["glbs"].append(item)
          if not files: report["errors"].append("No Tabarbour GLB payloads were generated")
          try:
              m=json.loads((out/"manifest.json").read_text(encoding="utf-8"))
              report["feature_counts"]=m.get("counts",{})
              report["origin"]=m.get("origin")
              listed={x.get("file") for x in m.get("tiles",[])}
              for p in files:
                  if p.name not in listed: report["errors"].append("GLB missing from manifest: "+p.name)
          except Exception as e:
              report["errors"].append("manifest parse/coverage error: "+repr(e))
          photos=root/"photos"/"wikimedia-photo-manifest.json"
          if photos.exists():
              try:
                  pm=json.loads(photos.read_text(encoding="utf-8"))
                  report["wikimedia_candidates"]={"records":len(pm.get("items",[])),
                      "downloaded":sum(1 for x in pm.get("items",[]) if x.get("downloaded")),
                      "note":"Candidate photos are not auto-applied without verified building identity and facade mapping"}
              except Exception as e: report["errors"].append("photo manifest parse error: "+repr(e))
          else: report["errors"].append("Wikimedia photo manifest missing")
          evidence=root/"photos"/"visual-evidence-import-report.json"
          if evidence.exists():
              try:
                  er=json.loads(evidence.read_text(encoding="utf-8"))
                  report["wikipedia_candidates"]=er.get("wikipedia",{})
                  report["building_matching"]=er.get("building_matching")
              except Exception as e: report["errors"].append("visual evidence report parse error: "+repr(e))
          else: report.setdefault("warnings",[]).append("Wikipedia evidence report missing")
          regional=root/"source"/"regional-source-import-report.json"
          if regional.exists():
              try: report["regional_sources"]=json.loads(regional.read_text(encoding="utf-8"))
              except Exception as e: report["errors"].append("regional source report parse error: "+repr(e))
          else: report.setdefault("warnings",[]).append("OpenFreeMap/NASA satellite source report missing")
          terrain=root/"source"/"dem"/"tabarbour-terrain-dem.glb"
          if terrain.exists():
              with terrain.open("rb") as f: th=f.read(12)
              report["dem_terrain_glb"]={"file":str(terrain.relative_to(root)),"bytes":terrain.stat().st_size,"valid_glb_header":len(th)==12 and th[:4]==b"glTF"}
              if not report["dem_terrain_glb"]["valid_glb_header"]: report["errors"].append("invalid DEM terrain GLB header")
          else:
              report.setdefault("warnings",[]).append("Copernicus DEM terrain GLB missing")
          root.mkdir(parents=True,exist_ok=True)
          (root/"validation-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report["errors"]: sys.exit(1)
          PY

      - name: Persist final report and any completed outputs
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "middle east/BuildGLB/tabarbour-real"
          if git diff --cached --quiet; then
            echo "No additional final-report changes to commit."
            exit 0
          fi
          git commit -m "Save Tabarbour GLB validation and source report"
          for attempt in 1 2 3 4 5; do
            git fetch origin main || { sleep "$attempt"; continue; }
            git rebase origin/main || { git rebase --abort; sleep "$attempt"; continue; }
            git push origin HEAD:main && exit 0
            sleep "$attempt"
          done
          echo "::error::Final report push failed; earlier tile checkpoints are preserved where their pushes succeeded."
          exit 1
