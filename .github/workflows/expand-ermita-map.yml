name: Expand Malate and Ermita 3D map
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-ermita-map.yml'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Malate and Ermita geometry from OpenStreetMap
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path
          mp=Path('maps/malate-map.json')
          sp=Path('maps/malate-streets.json')
          if not mp.exists() or not mp.stat().st_size: raise SystemExit('Existing map snapshot missing; refusing to create an empty map')
          old=json.loads(mp.read_text(encoding='utf-8'))
          if not isinstance(old.get('elements'),list): raise SystemExit('Unexpected map schema')
          # Malate + all of Ermita and connecting blocks. Coordinates are Manila, Philippines.
          bbox='(14.548,120.958,14.603,121.012)'
          selectors={
            'roads':f'way{bbox}[highway];',
            'buildings':f'way{bbox}[building];way{bbox}[building:part];',
            'rail':f'way{bbox}[railway];',
            'landuse':f'way{bbox}[landuse];way{bbox}[leisure];way{bbox}[natural];',
            'water':f'way{bbox}[waterway];way{bbox}[water];way{bbox}[natural=water];',
            'stations':f'node{bbox}[railway~"^(station|halt|tram_stop|subway_entrance)$"];way{bbox}[railway~"^(station|halt|tram_stop|subway_entrance)$"];'
          }
          endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter']
          merged={(e.get('type'),e.get('id')):e for e in old['elements']}
          successes=0
          def fetch(label,sel):
            query='[out:json][timeout:100];('+sel+');out body geom;'
            errors=[]
            for attempt in range(3):
              for endpoint in endpoints:
                try:
                  req=urllib.request.Request(endpoint,data=urllib.parse.urlencode({'data':query}).encode(),headers={'User-Agent':'AdamCityMapCache/4.0 (personal map experiment)','Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=115) as r: return json.load(r).get('elements',[])
                except Exception as e: errors.append(str(e))
              time.sleep(4+attempt*5)
            print('FAILED',label,errors[-3:]);return None
          for label,sel in selectors.items():
            result=fetch(label,sel)
            if result is None: continue
            successes+=1
            for el in result:
              key=(el.get('type'),el.get('id'))
              prior=merged.get(key,{})
              # Prefer the new complete geometry/tags if present.
              merged[key]={**prior,**el}
            print(label,'received',len(result),'total unique',len(merged))
          if successes<2: raise SystemExit('Too few geometry categories succeeded; preserving existing cache')
          # Keep only elements useful to the 3D renderer, avoiding an oversized node dump.
          elements=[]
          for e in merged.values():
            tags=e.get('tags',{})
            if e.get('type')=='way' and e.get('geometry') and any(k in tags for k in ('highway','building','building:part','railway','landuse','leisure','natural','waterway','water')):
              elements.append(e)
            elif e.get('type')=='node' and any(k in tags for k in ('railway','public_transport','highway')):
              elements.append(e)
          # Fail closed if a query silently returns a partial/empty road or building layer.
          def geom_count(items, predicate):
            return sum(1 for e in items if e.get('type')=='way' and e.get('geometry') and predicate(e.get('tags',{})))
          road_count=geom_count(elements,lambda t: bool(t.get('highway')))
          building_count=geom_count(elements,lambda t: bool(t.get('building') or t.get('building:part')))
          if road_count < 500 or building_count < 1000:
            raise SystemExit(f'Unsafe map refresh: only {road_count} road ways and {building_count} building ways; preserving previous snapshot')
          # Validate coordinates and compare new coverage against the previous cache before replacing it.
          bad_geometry=0
          for e in elements:
            if e.get('type')!='way' or not e.get('geometry'): continue
            for p in e['geometry']:
              if not isinstance(p,dict) or not (14.53 <= float(p.get('lat',0)) <= 14.62 and 120.94 <= float(p.get('lon',0)) <= 121.03):
                bad_geometry+=1; break
          if bad_geometry:
            raise SystemExit(f'Unsafe map refresh: {bad_geometry} ways have malformed/out-of-region coordinates')
          old['elements']=elements
          old['_cache']={**old.get('_cache',{}),'region':'Malate + Ermita, Manila, Philippines','bbox':[14.548,120.958,14.603,121.012],'source':'© OpenStreetMap contributors','generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'elements':len(elements),'geometry_categories_succeeded':successes}
          mp.write_text(json.dumps(old,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          # Build street-name lookup from all named road ways, including the expanded area.
          streets=[]
          for e in elements:
            t=e.get('tags',{})
            if e.get('type')!='way' or not t.get('highway') or not t.get('name') or not e.get('geometry'): continue
            coords=[{'lat':round(float(p['lat']),7),'lon':round(float(p['lon']),7)} for p in e['geometry'] if 'lat' in p and 'lon' in p]
            if len(coords)<2: continue
            mid=coords[len(coords)//2]
            streets.append({'name':t['name'],'name_en':t.get('name:en',t['name']),'highway':t.get('highway'),'oneway':t.get('oneway'),'surface':t.get('surface'),'coordinates':coords,'lat':mid['lat'],'lon':mid['lon'],'osm_way_id':e.get('id')})
          streets.sort(key=lambda x:(x['name'].casefold(),x['osm_way_id'] or 0))
          sp.write_text(json.dumps({'region':'Malate + Ermita, Manila, Philippines','source':'© OpenStreetMap contributors','generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'streets':streets},separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          print('Saved expanded geometry:',len(elements),'elements; roads:',road_count,'buildings:',building_count,'named street segments:',len(streets))
          # Write a small machine-readable quality summary alongside the data.
          from collections import Counter
          quality={'region':'Malate + Ermita, Manila, Philippines','source':'© OpenStreetMap contributors','generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'bbox':[14.548,120.958,14.603,121.012],'elements':len(elements),'road_ways':road_count,'building_ways':building_count,'named_road_ways':len(streets),'road_types':dict(Counter(e.get('tags',{}).get('highway') for e in elements if e.get('type')=='way' and e.get('tags',{}).get('highway'))),'geometry_categories_succeeded':successes,'validation':'passed'}
          Path('maps/malate-geometry-quality.json').write_text(json.dumps(quality,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Commit expanded map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add maps/malate-map.json maps/malate-streets.json maps/malate-geometry-quality.json
          if git diff --cached --quiet; then echo "No map geometry changes."; exit 0; fi
          git commit -m "Expand 3D map to include Ermita and nearby streets"
          # Another workflow or edit may have advanced main while the OSM query ran.
          # Rebase this data-only commit onto the latest main before pushing.
          git pull --rebase origin main
          git push
