name: Group Manila buildings into at most 10 regions
on:
  push:
    branches: [main]
    paths:
      - "Manila/scripts/group_manila_buildings_into_regions.py"
permissions:
  contents: write
concurrency:
  group: manila-large-region-grouping
  cancel-in-progress: false
jobs:
  group:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source data only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            Manila/GeoJSON_Source
            Manila/scripts/group_manila_buildings_into_regions.py
            .github/workflows/group-manila-buildings-into-regions.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Group buildings into 10 or fewer geographic regions
        run: python Manila/scripts/group_manila_buildings_into_regions.py
      - name: Remove one-time script and workflow
        run: |
          rm -f Manila/scripts/group_manila_buildings_into_regions.py
          rm -f .github/workflows/group-manila-buildings-into-regions.yml
      - name: Commit region files and clean up automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse Manila/New_Manila
          git add -u Manila/scripts .github/workflows
          git commit -m "Group Manila buildings into at most 10 geographic regions"
          git push origin main
