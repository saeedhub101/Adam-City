name: Audit game-world building readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'middle east/scripts/audit-game-world-building-readiness.py'
      - '.github/workflows/audit-game-world-building-readiness.yml'

permissions:
  contents: write

concurrency:
  group: game-world-building-readiness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install streaming JSON parser
        run: python -m pip install ijson
      - name: Run building attribute audit
        run: python 'middle east/scripts/audit-game-world-building-readiness.py'
      - name: Commit audit report to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'middle east/game-world-building-readiness.json'
          if git diff --cached --quiet; then
            echo 'Audit report unchanged; no commit needed.'
          else
            git commit -m 'Update game-world building readiness audit'
            git push origin HEAD:main
          fi
