name: Build facade crop review gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ermita/scripts/build_facade_review_gallery.py"
      - ".github/workflows/build-facade-review-gallery.yml"
      - "kartaview/facade-crops/manifest.csv"

permissions:
  contents: write

concurrency:
  group: facade-review-gallery
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build review gallery and priority queue
        run: python ermita/scripts/build_facade_review_gallery.py
      - name: Commit review tools to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kartaview/facade-crops/review-gallery.html kartaview/facade-crops/review-priority.csv
          if git diff --cached --quiet; then
            echo "Review gallery already current."
            exit 0
          fi
          git commit -m "Build facade crop review gallery"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying."
            git rebase --abort || true
            sleep 2
          done
          echo "Could not push review gallery after retries."
          exit 1
