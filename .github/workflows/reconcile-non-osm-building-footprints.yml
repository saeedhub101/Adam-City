name: Reconcile independent satellite building footprints (no OSM)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ermita/scripts/reconcile_non_osm_building_footprints.py"
      - "ermita/maps/sources/google-open-buildings/**"
      - "ermita/maps/sources/microsoft-satellite-buildings/**"
      - ".github/workflows/reconcile-non-osm-building-footprints.yml"

permissions:
  contents: write

concurrency:
  group: non-osm-building-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install spatial dependencies
        run: python -m pip install shapely pyproj
      - name: Match independent source footprints without modifying originals
        run: python ermita/scripts/reconcile_non_osm_building_footprints.py
      - name: Commit crosswalk and reconciliation report
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/maps/qa/non-osm-building-footprint-crosswalk.csv ermita/maps/qa/non-osm-building-footprint-reconciliation-report.json
          if git diff --cached --quiet; then echo "No new crosswalk changes."; exit 0; fi
          git commit -m "Reconcile Google and Microsoft satellite building footprints"
          git fetch origin main
          if ! git rebase origin/main; then git rebase --abort || true; echo "::error::Conflict detected; stopped without replacing source records."; exit 1; fi
          git push origin HEAD:main
