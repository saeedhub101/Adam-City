name: Build Amman 3D city preview for Unreal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-amman-city-preview.yml"
      - "Tools/Build-Amman-3DPreview.py"
      - "SaeedRoyaleGodot/assets/amman_core.geojson"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: amman-city-preview-main
  cancel-in-progress: true

jobs:
  generate-city:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender python3-numpy python3-pil libegl1 libgl1 libxrender1 libxkbcommon0 libsm6 libxext6 libxi6 libxxf86vm1
          blender --version
      - name: Validate real OSM source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("SaeedRoyaleGodot/assets/amman_core.geojson")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d.get("source")=="OpenStreetMap contributors"
          assert d.get("license")=="Open Database License (ODbL) 1.0"
          assert d.get("type")=="FeatureCollection"
          b=sum(f.get("properties",{}).get("kind")=="building" for f in d["features"])
          r=sum(f.get("properties",{}).get("kind")=="road" for f in d["features"])
          assert b>=100 and r>=50,(b,r)
          print(f"Source valid: {b} building footprints, {r} road ways")
          PY
      - name: Generate city mesh and CPU-safe review preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup --python Tools/Build-Amman-3DPreview.py -- \
            SaeedRoyaleGodot/assets/amman_core.geojson output/Amman-Central-District.glb \
            output/Amman-Central-District-3D.png 2>&1 | tee output/build.log
          test -s output/Amman-Central-District.glb
          test -s output/Amman-Central-District-3D.png
          test -s output/Amman-Central-District-3D-Closeup.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          from PIL import Image, ImageStat
          g=Path("output/Amman-Central-District.glb").read_bytes()
          assert g[:4]==b"glTF"
          version,length=struct.unpack_from("<II",g,4)
          assert version==2 and length==len(g),(version,length,len(g))
          p=Path("output/Amman-Central-District-3D.png").read_bytes()
          assert p[:8]==b"\x89PNG\r\n\x1a\n"
          w,h=struct.unpack_from(">II",p,16)
          assert w>=1280 and h>=720,(w,h)
          im=Image.open("output/Amman-Central-District-3D.png").convert("RGB")
          close=Image.open("output/Amman-Central-District-3D-Closeup.png").convert("RGB")
          overview_spread=max(ImageStat.Stat(im).stddev)
          close_spread=max(ImageStat.Stat(close).stddev)
          assert overview_spread>3.0, ("overview is effectively blank", ImageStat.Stat(im).stddev)
          assert close_spread>3.0, ("close-up is effectively blank", ImageStat.Stat(close).stddev)
          print(f"Validated GLB {len(g):,} bytes; overview {w}x{h}, RGB stddev {overview_spread:.2f}; close-up RGB stddev {close_spread:.2f}")
      - name: Publish compact Amman GLB into the playable game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          asset="SaeedRoyaleGodot/assets/amman/Amman-Central-District.glb"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$asset")"
            cp output/Amman-Central-District.glb "$asset"
            size="$(stat -c %s "$asset")"
            test "$size" -lt 95000000
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$asset"
            if git diff --cached --quiet; then
              echo "Amman runtime asset is already up to date."
              exit 0
            fi
            git commit -m "Add optimized Amman city asset to playable map"
            if git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying against latest main (attempt $attempt)."
          done
          echo "Unable to publish Amman GLB after 3 attempts."
          exit 1
      - name: Upload Unreal city asset and source review images
        uses: actions/upload-artifact@v4
        with:
          name: Adam-Royal-Amman-City-Source-Review
          path: |
            output/Amman-Central-District.glb
            output/Amman-Central-District-3D.png
            output/Amman-Central-District-3D-Closeup.png
            output/build.log
          if-no-files-found: error
          retention-days: 30
