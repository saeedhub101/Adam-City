name: Build Manila 3D city map for Adam Royal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-amman-city-preview.yml"
      - "Tools/Build-Amman-3DPreview.py"
      - "SaeedRoyaleGodot/assets/manila_core.geojson"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: manila-city-build-main-v2
  cancel-in-progress: true

jobs:
  generate-city:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install Blender
        run: |
          sudo timeout 300s apt-get update
          sudo timeout 300s apt-get install --yes blender python3-numpy python3-pil libegl1 libgl1 libxrender1 libxkbcommon0 libsm6 libxext6 libxi6 libxxf86vm1
          blender --version
      - name: Download free CC0 PBR textures for Manila streets and buildings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SaeedRoyaleGodot/assets/manila_materials
          for item in Asphalt012 Concrete034; do
            curl --fail --location --silent --show-error --retry 3 --max-time 120 \
              "https://ambientcg.com/get?file=${item}_1K-JPG.zip" -o "/tmp/${item}.zip"
            unzip -oq "/tmp/${item}.zip" -d SaeedRoyaleGodot/assets/manila_materials
          done
          echo "Downloaded CC0 texture maps:"
          find SaeedRoyaleGodot/assets/manila_materials -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -n "$(find SaeedRoyaleGodot/assets/manila_materials -type f -name 'Asphalt012*_Color.jpg' -print -quit)"
          test -n "$(find SaeedRoyaleGodot/assets/manila_materials -type f -name 'Concrete034*_Color.jpg' -print -quit)"

      - name: Download and validate real Manila OSM source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SaeedRoyaleGodot/assets
          # Keep the playable map focused on central Manila; a smaller extract is more reliable
          # than querying the whole 5.5 km district during public Overpass congestion.
          south=14.575
          west=120.975
          north=14.595
          east=120.995
          query="[out:json][timeout:90];(way[\"building\"]($south,$west,$north,$east);way[\"highway\"]($south,$west,$north,$east););out body;>;out skel qt;"
          downloaded=0
          for endpoint in \
            https://overpass-api.de/api/interpreter \
            https://overpass.kumi.systems/api/interpreter \
            https://overpass.private.coffee/api/interpreter; do
            echo "Trying OpenStreetMap Overpass endpoint: $endpoint"
            if curl --fail --silent --show-error --retry 1 --retry-delay 2 --max-time 120 \
              -A 'AdamRoyalGame/1.0 (OSM open-data map build)' \
              --data-urlencode "data=$query" "$endpoint" -o /tmp/manila-osm.json; then
              downloaded=1
              break
            fi
          done
          if [ "$downloaded" -ne 1 ]; then
            echo "Overpass unavailable; falling back to the official OpenStreetMap map API."
            curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --max-time 180 \
              -A 'AdamRoyalGame/1.0 (OSM open-data map build)' \
              "https://api.openstreetmap.org/api/0.6/map?bbox=$west,$south,$east,$north" \
              -o /tmp/manila-osm.xml
            echo "MANILA_OSM_FORMAT=xml" >> "$GITHUB_ENV"
          else
            echo "MANILA_OSM_FORMAT=json" >> "$GITHUB_ENV"
          fi
          python3 - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          fmt=os.environ.get('MANILA_OSM_FORMAT','json')
          nodes={}
          ways=[]
          if fmt == 'json':
              raw=json.loads(Path('/tmp/manila-osm.json').read_text())
              nodes={str(x['id']):(float(x['lon']),float(x['lat'])) for x in raw.get('elements',[]) if x.get('type')=='node'}
              ways=[(str(e['id']),[str(n) for n in e.get('nodes',[])],e.get('tags',{})) for e in raw.get('elements',[]) if e.get('type')=='way']
          else:
              root=ET.parse('/tmp/manila-osm.xml').getroot()
              nodes={n.get('id'):(float(n.get('lon')),float(n.get('lat'))) for n in root.findall('node')}
              for e in root.findall('way'):
                  tags={t.get('k'):t.get('v') for t in e.findall('tag')}
                  ways.append((e.get('id'),[n.get('ref') for n in e.findall('nd')],tags))
          features=[]
          for way_id, refs, tags in ways:
              coords=[nodes[n] for n in refs if n in nodes]
              if 'building' in tags and len(coords)>=4 and coords[0]==coords[-1]:
                  kind='building'; geom={'type':'Polygon','coordinates':[[list(c) for c in coords]]}
              elif 'highway' in tags and len(coords)>=2:
                  kind='road'; geom={'type':'LineString','coordinates':[list(c) for c in coords]}
              else:
                  continue
              props={'kind':kind,'osm_id':str(way_id),'name':tags.get('name',''),'highway':tags.get('highway',''),'building:levels':tags.get('building:levels',''),'height':tags.get('height','')}
              features.append({'type':'Feature','properties':props,'geometry':geom})
          b=sum(x['properties']['kind']=='building' for x in features)
          r=sum(x['properties']['kind']=='road' for x in features)
          if b<150 or r<80:
              raise SystemExit(f'Manila OSM extract incomplete: {b} buildings, {r} roads; refusing to generate an empty/poor map')
          out={'type':'FeatureCollection','city':'Central Manila, Philippines','source':'OpenStreetMap contributors','license':'Open Database License (ODbL) 1.0','origin':{'longitude':120.985,'latitude':14.585},'bbox':[14.575,120.975,14.595,120.995],'features':features}
          Path('SaeedRoyaleGodot/assets/manila_core.geojson').write_text(json.dumps(out,separators=(',',':')),encoding='utf-8')
          print(f'Validated central Manila OSM extract: {b} building footprints, {r} roads, {len(features)} total features')
          PY
      - name: Generate city mesh and CPU-safe review preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup --python Tools/Build-Amman-3DPreview.py -- \
            SaeedRoyaleGodot/assets/manila_core.geojson output/Manila-Central-District.glb \
            output/Manila-Central-District-3D.png 2>&1 | tee output/build.log
          test -s output/Manila-Central-District.glb
          test -s output/Manila-Central-District-3D.png
          test -s output/Manila-Central-District-3D-Closeup.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          from PIL import Image, ImageStat
          g=Path("output/Manila-Central-District.glb").read_bytes()
          assert g[:4]==b"glTF"
          version,length=struct.unpack_from("<II",g,4)
          assert version==2 and length==len(g),(version,length,len(g))
          p=Path("output/Manila-Central-District-3D.png").read_bytes()
          assert p[:8]==b"\x89PNG\r\n\x1a\n"
          w,h=struct.unpack_from(">II",p,16)
          assert w>=1280 and h>=720,(w,h)
          im=Image.open("output/Manila-Central-District-3D.png").convert("RGB")
          close=Image.open("output/Manila-Central-District-3D-Closeup.png").convert("RGB")
          overview_spread=max(ImageStat.Stat(im).stddev)
          close_spread=max(ImageStat.Stat(close).stddev)
          assert overview_spread>3.0, ("overview is effectively blank", ImageStat.Stat(im).stddev)
          assert close_spread>3.0, ("close-up is effectively blank", ImageStat.Stat(close).stddev)
          print(f"Validated GLB {len(g):,} bytes; overview {w}x{h}, RGB stddev {overview_spread:.2f}; close-up RGB stddev {close_spread:.2f}")
      - name: Publish compact Manila GLB into the playable game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          asset="SaeedRoyaleGodot/assets/manila/Manila-Central-District.glb"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$asset")"
            cp output/Manila-Central-District.glb "$asset"
            size="$(stat -c %s "$asset")"
            test "$size" -lt 95000000
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$asset"
            if git diff --cached --quiet; then
              echo "Manila runtime asset is already up to date."
              exit 0
            fi
            git commit -m "Add optimized Manila city asset to playable map"
            if git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying against latest main (attempt $attempt)."
          done
          echo "Unable to publish Manila GLB after 3 attempts."
          exit 1
      - name: Upload Manila city asset and source review images
        uses: actions/upload-artifact@v4
        with:
          name: Adam-Royal-Manila-City-Source-Review
          path: |
            output/Manila-Central-District.glb
            output/Manila-Central-District-3D.png
            output/Manila-Central-District-3D-Closeup.png
            output/build.log
          if-no-files-found: error
          retention-days: 30
