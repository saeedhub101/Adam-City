name: Apply existing Manila evidence directly to PBF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Manila/scripts/apply_building_evidence_to_pbf.py"
      - ".github/workflows/manila-apply-evidence-to-pbf.yml"

permissions:
  contents: write

concurrency:
  group: manila-evidence-apply
  cancel-in-progress: false

jobs:
  apply-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PBF encoder and decoder
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile
      - name: Validate application script
        run: python -m py_compile Manila/scripts/apply_building_evidence_to_pbf.py
      - name: Apply saved evidence to PBF buildings
        run: python -u Manila/scripts/apply_building_evidence_to_pbf.py
      - name: Commit modified PBF tiles and application report to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Manila/vector-tiles Manila/3d-rag/apply-report.json
          if git diff --cached --quiet; then
            echo "No PBF changes to commit."
            exit 1
          fi
          git commit -m "Apply saved Manila building evidence to PBF tiles"
          git push origin HEAD:main
