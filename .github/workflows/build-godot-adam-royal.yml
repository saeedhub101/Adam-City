name: Adam Royal — Godot City Build

on:
  push:
    branches: [main]
    paths:
      - "GodotAdamRoyal/**"
      - "StandaloneBattleRoyale/Tools/**"
      - "StandaloneBattleRoyale/Content/Maps/**"
      - "assets/**"
      - ".github/workflows/build-godot-adam-royal.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-royal-godot-${{ github.ref }}
  # New commits contain fixes for the same build; cancel stale queued/running builds.
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: GodotAdamRoyal
    steps:
      - name: Checkout
        id: check_checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Set up Python
        id: check_set_up_python
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reuse the committed Manila district; generate and cache only when missing
        id: check_reuse_the_committed_manila_district
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $mapDir = 'StandaloneBattleRoyale/Content/Maps'
          $reportPath = Join-Path $mapDir 'Manila-Central-District.json'
          $glbPath = Join-Path $mapDir 'Manila-Central-District.glb'
          $textures = @(Get-ChildItem $mapDir -Filter 'Manila-Facade-Texture-*.jpg' -File -ErrorAction SilentlyContinue)
          $roadTexture = Join-Path $mapDir 'Manila-Road-Asphalt.jpg'
          $cachedMeshCount = 999999
          if (Test-Path $reportPath) {
            try {
              $cachedReport = Get-Content $reportPath -Raw | ConvertFrom-Json
              $cachedMeshCount = [int]$cachedReport.mesh_objects
            } catch { $cachedMeshCount = 999999 }
          }
          $cacheHasStreetDetail = $false
          if (Test-Path $reportPath) { try { $cacheHasStreetDetail = ($cachedReport.sidewalk_meshes -gt 0) -and ($null -ne $cachedReport.mapped_trees) -and ($null -ne $cachedReport.street_lamps) } catch { $cacheHasStreetDetail = $false } }
          $cacheValid = (Test-Path $reportPath) -and (Test-Path $glbPath) -and (Test-Path $roadTexture) -and ((Get-Item $glbPath).Length -gt 100000) -and ($textures.Count -ge 4) -and ($cachedMeshCount -le 50) -and $cacheHasStreetDetail
          if ($cacheValid) {
            Write-Host "Using committed Manila map cache; skipping OpenStreetMap download and regeneration."
          } else {
            python -m pip install --disable-pip-version-check requests shapely trimesh mapbox-earcut scipy numpy pillow
            if ($LASTEXITCODE -ne 0) { throw "Map generator dependencies could not be installed" }
            if ((Test-Path $glbPath) -and (Test-Path $reportPath) -and (Test-Path $roadTexture) -and ($textures.Count -ge 4) -and $cacheHasStreetDetail) {
              Write-Host "Existing Manila geometry is present but needs offline mesh compaction; preserve mapped street-detail data."
              python StandaloneBattleRoyale/Tools/build_manila_district.py --optimize-existing
            } else {
              Write-Host "Manila cache is missing required real-world street details; rebuild once from georeferenced OpenStreetMap data."
              python StandaloneBattleRoyale/Tools/build_manila_district.py
            }
            if ($LASTEXITCODE -ne 0) { throw "Manila map optimization/generation failed" }
          }
          if (-not (Test-Path $reportPath) -or -not (Test-Path $glbPath)) { throw "Manila map GLB/report missing" }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          $textures = @(Get-ChildItem $mapDir -Filter 'Manila-Facade-Texture-*.jpg' -File -ErrorAction SilentlyContinue)
          if ($report.buildings -lt 100 -or $report.roads -lt 30) { throw "Map quality gate failed: buildings=$($report.buildings), roads=$($report.roads)" }
          if ($report.sidewalk_meshes -lt 20 -or $null -eq $report.mapped_trees -or $null -eq $report.street_lamps) { throw "Manila street-detail quality gate failed: sidewalks=$($report.sidewalk_meshes), trees=$($report.mapped_trees), lamps=$($report.street_lamps)" }
          if ($report.mesh_objects -gt 50) { throw "Map is not optimized: $($report.mesh_objects) mesh objects remain; expected 50 or fewer." }
          if ($textures.Count -lt 4) { throw "Expected four reusable facade texture files; found $($textures.Count)" }
          if (-not (Test-Path $roadTexture)) { throw 'Reusable asphalt texture is missing.' }
          if ((Get-Item $glbPath).Length -lt 100000) { throw "Manila GLB is unexpectedly small" }
          if (-not $cacheValid) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add $glbPath $reportPath
            git add -f "$mapDir/Manila-Facade-Texture-*.jpg"
            git add -f $roadTexture
            if (-not (git diff --cached --quiet)) {
              git commit -m 'Cache Manila district map and facade textures [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            }
          }
          Write-Host "Reusable Manila cache verified: $($report.buildings) buildings; $($report.roads) roads; $($textures.Count) texture atlases; $((Get-Item $glbPath).Length) GLB bytes."

      - name: Reuse cached Manila facade improvement; process only when missing or outdated
        id: check_reuse_cached_manila_facade_improvem
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $mapDir = 'StandaloneBattleRoyale/Content/Maps'
          $reportPath = Join-Path $mapDir 'Manila-Central-District.json'
          $glbPath = Join-Path $mapDir 'Manila-Central-District.glb'
          $cached = $false
          if ((Test-Path $reportPath) -and (Test-Path $glbPath)) {
            try {
              $existing = Get-Content $reportPath -Raw | ConvertFrom-Json
              $atlases = @(Get-ChildItem $mapDir -Filter 'Manila-Facade-Texture-*.jpg' -File -ErrorAction SilentlyContinue)
              $cached = ($existing.facade_pipeline_version -ge 1) -and ($existing.facade_materials_replaced -ge 1) -and ($atlases.Count -ge 4) -and ((Get-Item $glbPath).Length -gt 100000)
            } catch { $cached = $false }
          }
          if ($cached) {
            Write-Host 'Using committed Manila facade-improved GLB and atlases; skipping texture processing.'
          } else {
            python -m pip install --disable-pip-version-check pillow trimesh numpy mapbox-earcut scipy
            if ($LASTEXITCODE -ne 0) { throw "Could not install facade texture processing dependencies" }
            python StandaloneBattleRoyale/Tools/apply_manila_photo_facades.py
            if ($LASTEXITCODE -ne 0) { throw "Facade atlas integration failed; refusing to continue with an unverified map" }
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            if ($report.facade_materials_replaced -lt 1 -or $report.facade_pipeline_version -lt 1) { throw "Manila facade improvement did not produce a valid versioned cache" }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$mapDir/Manila-Central-District.glb" "$mapDir/Manila-Central-District.json"
            git add -f "$mapDir/Manila-Facade-Texture-*.jpg"
            if (-not (git diff --cached --quiet)) {
              git commit -m 'Cache improved Manila facade materials [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            }
          }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          Write-Host "MANILA_FACADE_CACHE_PASS version=$($report.facade_pipeline_version) materials=$($report.facade_materials_replaced) source=$($report.facade_texture_source)"

      - name: Fetch and validate real Manila elevation data
        id: check_fetch_and_validate_real_manila_elev
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check requests
          if ($LASTEXITCODE -ne 0) { throw "Could not install elevation data client" }
          python StandaloneBattleRoyale/Tools/build_manila_terrain.py
          if ($LASTEXITCODE -ne 0) { throw "Real SRTM elevation acquisition failed; refusing to substitute invented terrain" }
          $terrain = Get-Content 'GodotAdamRoyal/assets/manila_terrain.json' -Raw | ConvertFrom-Json
          if ($terrain.grid_size -lt 10 -or $terrain.heights_scaled_m.Count -ne $terrain.grid_size) { throw "SRTM terrain grid failed validation" }
          Write-Host "REAL_TERRAIN_DATA_PASS source=$($terrain.source) grid=$($terrain.grid_size)x$($terrain.grid_size) min=$($terrain.minimum_elevation_m) max=$($terrain.maximum_elevation_m)"

      - name: Reuse cached Manila street names; download only when missing or invalid
        id: check_reuse_cached_manila_street_names_do
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $streetPath = 'GodotAdamRoyal/assets/manila_street_names.json'
          $cacheValid = $false
          if (Test-Path $streetPath) {
            try {
              $cachedStreets = Get-Content $streetPath -Raw | ConvertFrom-Json
              $cacheValid = ($cachedStreets.city -eq 'Manila, Philippines') -and ($cachedStreets.named_road_segments -ge 20) -and ($cachedStreets.unique_street_names -ge 10) -and ($cachedStreets.streets.Count -ge 20)
            } catch { $cacheValid = $false }
          }
          if ($cacheValid) {
            Write-Host "Using committed Manila named-street cache; skipping Overpass network requests."
            $streets = $cachedStreets
          } else {
            Write-Host "Manila street cache is missing or invalid; attempting to rebuild from real OpenStreetMap data."
            python -m pip install --disable-pip-version-check requests
            if ($LASTEXITCODE -ne 0) { throw "Could not install OSM street-data client" }
            python GodotAdamRoyal/Tools/build_manila_street_names.py
            if ($LASTEXITCODE -ne 0) { throw "Real Manila street names download failed; refusing to create fake street names" }
            if (-not (Test-Path $streetPath)) { throw "Street-name builder did not produce $streetPath" }
            $streets = Get-Content $streetPath -Raw | ConvertFrom-Json
            if ($streets.named_road_segments -lt 20 -or $streets.unique_street_names -lt 10 -or $streets.streets.Count -lt 20) { throw "Manila named-street dataset failed validation" }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add $streetPath
            if (-not (git diff --cached --quiet)) {
              git commit -m 'Cache real Manila street names and geometry [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            }
          }
          Write-Host "MANILA_STREET_NAMES_READY names=$($streets.unique_street_names) segments=$($streets.named_road_segments) cache=$cacheValid"

      - name: Stage the real Manila district and player character
        id: check_stage_the_real_manila_district_and_
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path assets -Force | Out-Null
          $characterSource = Join-Path $env:GITHUB_WORKSPACE 'assets/saeed.glb'
          $mapSource = Join-Path $env:GITHUB_WORKSPACE 'StandaloneBattleRoyale/Content/Maps/Manila-Central-District.glb'
          $reportSource = Join-Path $env:GITHUB_WORKSPACE 'StandaloneBattleRoyale/Content/Maps/Manila-Central-District.json'
          if (-not (Test-Path $characterSource)) { throw "Source character GLB is missing: $characterSource" }
          if (-not (Test-Path $mapSource)) { throw "Freshly generated Manila district GLB is missing: $mapSource" }
          if (-not (Test-Path $reportSource)) { throw "Manila source-data report is missing: $reportSource" }
          Copy-Item $characterSource (Join-Path $PWD 'assets/adam_royal_character.glb') -Force
          Copy-Item $mapSource (Join-Path $PWD 'assets/manila_city.glb') -Force
          Copy-Item $reportSource (Join-Path $PWD 'assets/manila_city.json') -Force
          foreach ($asset in @('assets/adam_royal_character.glb', 'assets/manila_city.glb')) {
            $item = Get-Item $asset
            if ($item.Length -lt 100000) { throw "Staged asset is unexpectedly small: $asset ($($item.Length) bytes)" }
            "STAGED_ASSET=$asset SIZE=$($item.Length)"
          }

      - name: Reuse committed Amman map; generate and cache only when missing
        id: check_reuse_committed_amman_map_generate_
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $mapDir = 'GodotAdamRoyal/assets/cities/tabarbour'
          $obj = Join-Path $mapDir 'Tabarbour.obj'
          $mtl = Join-Path $mapDir 'Tabarbour.mtl'
          $reportPath = Join-Path $mapDir 'Tabarbour-report.json'
          $raw = Join-Path $mapDir 'tabarbour_osm.json'
          $cacheValid = $false
          if ((Test-Path $obj) -and (Test-Path $mtl) -and (Test-Path $reportPath) -and (Test-Path $raw)) {
            try {
              $report = Get-Content $reportPath -Raw | ConvertFrom-Json
              $cacheValid = ($report.buildings -ge 100) -and ($report.road_ways -ge 50) -and ($report.obj_bytes -ge 100000) -and ((Get-Item $obj).Length -ge 100000)
            } catch { $cacheValid = $false }
          }
          if ($cacheValid) {
            Write-Host "Using committed Amman (Tabarbour) map cache; skipping OpenStreetMap download."
          } else {
            python -m pip install --disable-pip-version-check requests
            if ($LASTEXITCODE -ne 0) { throw "Could not install OpenStreetMap download client" }
            python GodotAdamRoyal/Tools/build_tabarbour_map.py
            if ($LASTEXITCODE -ne 0) { throw "Amman real-world map build failed" }
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            if ($report.buildings -lt 100 -or $report.road_ways -lt 50 -or $report.obj_bytes -lt 100000) { throw "Amman map quality gate failed: buildings=$($report.buildings), roads=$($report.road_ways), bytes=$($report.obj_bytes)" }
            if (-not (Test-Path $mtl)) { throw "Amman materials file missing" }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$mapDir/Tabarbour.obj" "$mapDir/Tabarbour.mtl" "$mapDir/Tabarbour-report.json" "$mapDir/tabarbour_osm.json"
            if (-not (git diff --cached --quiet)) {
              git commit -m 'Cache Amman district map and OSM source data [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            }
          }
          Write-Host "AMMAN_MAP_CACHE_PASS buildings=$($report.buildings) roadWays=$($report.road_ways) bytes=$((Get-Item $obj).Length)"

      - name: Use the existing Chicago map from the repository (never download or regenerate)
        id: check_use_the_existing_chicago_map_from_t
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceObj = 'Chicago.obj'
          $cityDir = 'GodotAdamRoyal/assets/cities/chicago'
          $cityObj = Join-Path $cityDir 'Chicago.obj'
          if (-not (Test-Path $sourceObj) -or (Get-Item $sourceObj).Length -lt 100000) {
            throw 'The committed Chicago.obj source asset is missing or invalid. Workflow will not download or generate a replacement.'
          }
          New-Item -ItemType Directory -Path $cityDir -Force | Out-Null
          if (-not (Test-Path $cityObj) -or (Get-Item $cityObj).Length -lt 100000) {
            Copy-Item $sourceObj $cityObj -Force
          }
          $sourceMtl = 'Chicago.mtl'
          if (Test-Path $sourceMtl) { Copy-Item $sourceMtl $cityDir -Force }
          if ((Get-Item $cityObj).Length -lt 100000) { throw 'Cached Chicago map is invalid or too small.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$cityDir/Chicago.obj"
          if (Test-Path (Join-Path $cityDir 'Chicago.mtl')) { git add "$cityDir/Chicago.mtl" }
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Cache Chicago map from committed source [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          }
          Write-Host "CHICAGO_EXISTING_ASSET_PASS path=$cityObj bytes=$((Get-Item $cityObj).Length)"

      - name: Use the existing San Francisco map from the repository (no external download)
        id: check_use_the_existing_san_francisco_map_
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $sfDir = 'GodotAdamRoyal/assets/cities/san_francisco'
          New-Item -ItemType Directory -Path $sfDir -Force | Out-Null
          $sfObjPath = Join-Path $sfDir 'SanFrancisco_City.obj'
          if (-not (Test-Path $sfObjPath) -or (Get-Item $sfObjPath).Length -lt 100000) {
            $sfArchive = 'SanFrancisco_City.OBJ.zip'
            if (-not (Test-Path $sfArchive)) { throw "The committed San Francisco source archive is missing: $sfArchive" }
            $extractDir = Join-Path $env:RUNNER_TEMP 'san-francisco-obj'
            if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
            Expand-Archive -LiteralPath $sfArchive -DestinationPath $extractDir -Force
            $sfObj = Get-ChildItem $extractDir -Recurse -File -Filter '*.obj' | Select-Object -First 1
            if (-not $sfObj) { throw 'The committed San Francisco archive contains no OBJ geometry.' }
            Copy-Item $sfObj.FullName $sfObjPath -Force
            $sfMtl = Get-ChildItem $extractDir -Recurse -File -Filter '*.mtl' | Select-Object -First 1
            if ($sfMtl) { Copy-Item $sfMtl.FullName (Join-Path $sfDir 'SanFrancisco_City.mtl') -Force }
            Copy-Item $sfObj.DirectoryName (Join-Path $sfDir 'source') -Recurse -Force
          }
          $sfBytes = (Get-Item $sfObjPath).Length
          if ($sfBytes -lt 100000) { throw 'Existing San Francisco map is invalid or too small.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$sfDir/SanFrancisco_City.obj" "$sfDir/SanFrancisco_City.mtl"
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Cache San Francisco map extracted from committed source [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          }
          Write-Host "SAN_FRANCISCO_EXISTING_ASSET_PASS bytes=$sfBytes"

      - name: Reuse committed Chicago and San Francisco maps; cache source assets only when missing
        id: check_reuse_committed_chicago_and_san_fra
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $cityDir = Join-Path $env:GITHUB_WORKSPACE 'GodotAdamRoyal/assets/cities'
          $sfDir = Join-Path $cityDir 'san_francisco'
          New-Item -ItemType Directory -Path $sfDir -Force | Out-Null

          $chicagoObj = Join-Path $cityDir 'Chicago.obj'
          if (-not (Test-Path $chicagoObj) -or (Get-Item $chicagoObj).Length -lt 100000) {
            $chicagoSource = Join-Path $env:GITHUB_WORKSPACE 'Chicago.obj'
            if (-not (Test-Path $chicagoSource)) { throw "Chicago OBJ source missing from repository root: $chicagoSource" }
            if ((Get-Item $chicagoSource).Length -lt 100000) { throw 'Chicago OBJ source is unexpectedly small.' }
            Copy-Item $chicagoSource $chicagoObj -Force
            $chicagoMtl = Join-Path $env:GITHUB_WORKSPACE 'Chicago.mtl'
            if (Test-Path $chicagoMtl) { Copy-Item $chicagoMtl $cityDir -Force }
            Get-ChildItem $env:GITHUB_WORKSPACE -File | Where-Object { $_.Name -like 'Chicago*' -and $_.Extension -in @('.mtl','.jpg','.jpeg','.png','.tga') } | ForEach-Object { Copy-Item $_.FullName $cityDir -Force }
          }

          $sfObjPath = Join-Path $sfDir 'SanFrancisco_City.obj'
          if (-not (Test-Path $sfObjPath) -or (Get-Item $sfObjPath).Length -lt 100000) {
            $sfArchive = Join-Path $env:GITHUB_WORKSPACE 'SanFrancisco_City.OBJ.zip'
            if (-not (Test-Path $sfArchive)) { throw "San Francisco OBJ archive missing: $sfArchive" }
            $extractDir = Join-Path $env:RUNNER_TEMP 'san-francisco-obj'
            if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
            Expand-Archive -LiteralPath $sfArchive -DestinationPath $extractDir -Force
            $sfObj = Get-ChildItem $extractDir -Recurse -File -Filter '*.obj' | Select-Object -First 1
            if (-not $sfObj) { throw 'San Francisco archive contains no OBJ geometry.' }
            Copy-Item $sfObj.DirectoryName (Join-Path $sfDir 'source') -Recurse -Force
            Copy-Item $sfObj.FullName $sfObjPath -Force
            $sfMtl = Get-ChildItem $extractDir -Recurse -File -Filter '*.mtl' | Select-Object -First 1
            if ($sfMtl) { Copy-Item $sfMtl.FullName (Join-Path $sfDir 'SanFrancisco_City.mtl') -Force }
          }
          $chicagoBytes = (Get-Item (Join-Path $cityDir 'Chicago.obj')).Length
          $sfBytes = (Get-Item (Join-Path $sfDir 'SanFrancisco_City.obj')).Length
          if ($chicagoBytes -lt 100000 -or $sfBytes -lt 100000) { throw "Travel region geometry failed size validation: Chicago=$chicagoBytes SanFrancisco=$sfBytes" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$cityDir/Chicago.obj" "$sfDir/SanFrancisco_City.obj" "$sfDir/SanFrancisco_City.mtl" "$cityDir/Chicago.mtl"
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Cache Chicago and San Francisco travel maps [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          }
          Write-Host "TRAVEL_REGION_CACHE_PASS Chicago.obj=$chicagoBytes SanFrancisco.obj=$sfBytes"
          Write-Host "Travel maps are staged as additional regions; Manila source scene is not replaced."

      - name: Download Godot 4.4.1 and Windows export templates
        id: check_download_godot_4_4_1_and_windows_ex
        continue-on-error: true
        shell: pwsh
        run: |
          $version = "4.4.1"
          $base = "https://github.com/godotengine/godot/releases/download/$version-stable"
          $engineZip = Join-Path $env:RUNNER_TEMP "godot.zip"
          $templateZip = Join-Path $env:RUNNER_TEMP "templates.zip"
          Invoke-WebRequest "$base/Godot_v$version-stable_win64.exe.zip" -OutFile $engineZip
          Invoke-WebRequest "$base/Godot_v$version-stable_export_templates.tpz" -OutFile $templateZip
          $engineDir = Join-Path $env:RUNNER_TEMP "godot-engine"
          $templateDir = Join-Path $env:RUNNER_TEMP "godot-templates-raw"
          Expand-Archive $engineZip -DestinationPath $engineDir -Force
          $templateAsZip = Join-Path $env:RUNNER_TEMP "templates-archive.zip"
          Copy-Item $templateZip $templateAsZip
          Expand-Archive $templateAsZip -DestinationPath $templateDir -Force

          $godot = Get-ChildItem $engineDir -Filter "*win64.exe" | Select-Object -First 1
          if (-not $godot) { throw "Godot console executable not found after download" }
          "GODOT_EXE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $dest = Join-Path $env:APPDATA "Godot/export_templates/$version.stable"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $templateRoot = Join-Path $templateDir "templates"
          if (Test-Path $templateRoot) {
            Copy-Item (Join-Path $templateRoot "*") $dest -Recurse -Force
          } else {
            Copy-Item (Join-Path $templateDir "*") $dest -Recurse -Force
          }
          $releaseTemplate = Join-Path $dest "windows_release_x86_64.exe"
          $debugTemplate = Join-Path $dest "windows_debug_x86_64.exe"
          if (-not (Test-Path $releaseTemplate)) {
            $foundRelease = Get-ChildItem $templateDir -Recurse -File -Filter "windows_release_x86_64.exe" | Select-Object -First 1
            if ($foundRelease) { Copy-Item $foundRelease.FullName $releaseTemplate -Force }
          }
          if (-not (Test-Path $releaseTemplate)) {
            Get-ChildItem $templateDir -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Write-Host
            throw "Required Windows release export template was not installed at $releaseTemplate"
          }
          if ((Get-Item $releaseTemplate).Length -lt 1000000) { throw "Windows release export template is unexpectedly small" }
          Write-Host "Verified Windows release template: $releaseTemplate ($((Get-Item $releaseTemplate).Length) bytes)"
          if (Test-Path $debugTemplate) { Write-Host "Verified Windows debug template: $debugTemplate" }

      - name: Import and validate Godot project
        id: check_import_and_validate_godot_project
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $importLog = Join-Path $env:RUNNER_TEMP 'godot-import.log'
          & $env:GODOT_EXE --headless --path "$PWD" --editor --quit --verbose 2>&1 | Tee-Object -FilePath $importLog
          $importExitCode = $LASTEXITCODE
          if ($importExitCode -ne 0) {
            Write-Host '===== Godot import log ====='
            if (Test-Path $importLog) { Get-Content $importLog }
            throw "Godot project import or script parse failed with exit code $importExitCode"
          }
          if (Select-String -Path $importLog -Pattern 'SCRIPT ERROR:|ERROR: Failed to load script' -Quiet) {
            Get-Content $importLog
            throw 'Godot reported script parse/compile errors during import.'
          }

          $runtimeLog = Join-Path $env:RUNNER_TEMP 'godot-runtime.log'
          & $env:GODOT_EXE --headless --path "$PWD" --quit-after 30 --verbose 2>&1 | Tee-Object -FilePath $runtimeLog
          $runtimeExitCode = $LASTEXITCODE
          if ($runtimeExitCode -ne 0) {
            Write-Host '===== Godot runtime log ====='
            if (Test-Path $runtimeLog) { Get-Content $runtimeLog }
            throw "Godot headless startup/city loading test failed with exit code $runtimeExitCode"
          }
          if (Select-String -Path $runtimeLog -Pattern 'SCRIPT ERROR:|ERROR: Failed to load script' -Quiet) {
            Get-Content $runtimeLog
            throw 'Godot reported script parse/compile errors during runtime.'
          }
          if (-not (Select-String -Path $runtimeLog -Pattern 'CITY_RENDER_SOURCE=GLB' -Quiet)) {
            Get-Content $runtimeLog
            throw 'Runtime check failed: the real Manila GLB was not loaded.'
          }
          if (-not (Select-String -Path $runtimeLog -Pattern 'CHARACTER_MODEL_LOADED=true' -Quiet)) {
            Get-Content $runtimeLog
            throw 'Runtime check failed: the actual character GLB was not loaded.'
          }

          foreach ($regionPattern in @('TRAVEL_ASSET_IMPORT_PASS region=Amman', 'TRAVEL_ASSET_IMPORT_PASS region=San Francisco', 'TRAVEL_ASSET_IMPORT_PASS region=Chicago')) {
            if (-not (Select-String -Path $runtimeLog -Pattern $regionPattern -Quiet)) {
              Get-Content $runtimeLog
              throw "Travel region import validation failed: $regionPattern"
            }
          }
          if (-not (Select-String -Path $runtimeLog -Pattern 'CITY_COLLISION_MESHES=[1-9]' -Quiet)) {
            Get-Content $runtimeLog
            throw 'Runtime check failed: no building collision meshes were created.'
          }
          Write-Host 'Verified: real Manila GLB and player character loaded in the game scene.'

      - name: Run the game and capture aerial, four street views, and player
        id: check_run_the_game_and_capture_aerial_fou
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $shotDir = Join-Path $PWD 'qa_screenshots'
          if (Test-Path $shotDir) { Remove-Item $shotDir -Recurse -Force }
          New-Item -ItemType Directory -Path $shotDir -Force | Out-Null
          $visualLog = Join-Path $env:RUNNER_TEMP 'godot-visual-qa.log'
          & $env:GODOT_EXE --path "$PWD" -- --qa-capture 2>&1 | Tee-Object -FilePath $visualLog
          $visualExitCode = $LASTEXITCODE
          if ($visualExitCode -ne 0) {
            Write-Host '===== Godot visual QA log ====='
            if (Test-Path $visualLog) { Get-Content $visualLog }
            throw "Rendered visual QA session failed with exit code $visualExitCode"
          }
          if (-not (Select-String -Path $visualLog -Pattern 'VISUAL_QA_CAPTURE_COUNT=6' -Quiet)) {
            Get-Content $visualLog
            throw 'Visual QA did not confirm all six game screenshots.'
          }
          $screenshots = @(Get-ChildItem $shotDir -Filter '*.png' -File)
          if ($screenshots.Count -ne 6) {
            Get-ChildItem $shotDir -ErrorAction SilentlyContinue | Select-Object Name,Length
            throw "Expected 6 rendered screenshots (aerial, four streets, player); found $($screenshots.Count)."
          }
          foreach ($shot in $screenshots) {
            if ($shot.Length -lt 10000) { throw "Screenshot appears blank or incomplete: $($shot.Name) ($($shot.Length) bytes)" }
            Write-Host "VISUAL_QA_IMAGE=$($shot.Name) BYTES=$($shot.Length)"
          }
          $requiredShots = @('01-aerial-full-map.png','02-street-west.png','03-street-east.png','04-street-north.png','05-street-south.png','06-player-in-game.png')
          foreach ($required in $requiredShots) {
            if (-not (Test-Path (Join-Path $shotDir $required))) { throw "Required visual evidence missing: $required" }
          }
          Write-Host 'VISUAL_QA_PASS: aerial map, four distinct street views, and in-game character captured from the running game.'

      - name: Export Windows game
        id: check_export_windows_game
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build -Force | Out-Null
          $exportLog = Join-Path $env:RUNNER_TEMP 'godot-windows-export.log'
          $releaseTemplate = Join-Path $env:APPDATA 'Godot/export_templates/4.4.1.stable/windows_release_x86_64.exe'
          if (-not (Test-Path $releaseTemplate)) { throw "Required Windows release export template is missing: $releaseTemplate" }
          if ((Get-Item $releaseTemplate).Length -lt 1000000) { throw "Windows release export template is invalid or truncated" }
          & $env:GODOT_EXE --headless --path "$PWD" --verbose --export-release "Windows Desktop" "build/AdamRoyal.exe" 2>&1 | Tee-Object -FilePath $exportLog
          $exportExitCode = $LASTEXITCODE
          if ($exportExitCode -ne 0) {
            Write-Host '===== Godot Windows export log ====='
            if (Test-Path $exportLog) { Get-Content $exportLog }
            throw "Godot Windows export failed with exit code $exportExitCode"
          }
          if (-not (Test-Path "build/AdamRoyal.exe")) {
            if (Test-Path $exportLog) { Get-Content $exportLog }
            throw "Godot reported export success but build/AdamRoyal.exe was not produced"
          }
          if ((Get-Item "build/AdamRoyal.exe").Length -lt 1000000) { throw "Exported executable is unexpectedly small" }
          Write-Host "WINDOWS_EXPORT_PASS: $((Get-Item 'build/AdamRoyal.exe').Length) bytes"
          Get-ChildItem build | Select-Object Name,Length

      - name: Smoke-test the exported Windows executable
        id: check_smoke_test_the_exported_windows_exe
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exePath = (Resolve-Path 'build/AdamRoyal.exe').Path
          $runtimeLog = Join-Path $env:RUNNER_TEMP 'adam-royal-exported-runtime.log'
          & $exePath --headless --quit-after 30 --verbose 2>&1 | Tee-Object -FilePath $runtimeLog
          $runtimeExitCode = $LASTEXITCODE
          if ($runtimeExitCode -ne 0) {
            Write-Host '===== Exported EXE runtime log ====='
            Get-Content $runtimeLog
            throw "Exported AdamRoyal.exe failed its startup test with exit code $runtimeExitCode"
          }
          if (Select-String -Path $runtimeLog -Pattern 'SCRIPT ERROR:|ERROR: Failed to load script' -Quiet) {
            Get-Content $runtimeLog
            throw 'Exported AdamRoyal.exe reported script parse/compile errors.'
          }
          foreach ($pattern in @('CITY_RENDER_SOURCE=GLB', 'CHARACTER_MODEL_LOADED=true', 'CITY_COLLISION_MESHES=[1-9]', 'REAL_TERRAIN_LOADED source=')) {
            if (-not (Select-String -Path $runtimeLog -Pattern $pattern -Quiet)) {
              Get-Content $runtimeLog
              throw "Exported game is missing runtime evidence marker: $pattern"
            }
          }
          Write-Host 'EXPORTED_GAME_SMOKE_PASS: EXE loaded the Manila GLB, SRTM terrain, and player character.'

      - name: Preserve build evidence
        id: check_preserve_build_evidence
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdamRoyal-Godot-Windows-${{ github.run_number }}
          path: |
            GodotAdamRoyal/build/
            GodotAdamRoyal/qa_screenshots/*.png
            GodotAdamRoyal/assets/manila_city.json
            GodotAdamRoyal/assets/manila_terrain.json
            GodotAdamRoyal/assets/*.glb
            StandaloneBattleRoyale/Content/Maps/Manila-Central-District.glb
            StandaloneBattleRoyale/Content/Maps/Manila-Central-District.json
            StandaloneBattleRoyale/Content/Maps/Manila-Facade-Texture-*.jpg
            StandaloneBattleRoyale/Content/Maps/Manila-Road-Asphalt.jpg
            GodotAdamRoyal/.godot/imported/
          if-no-files-found: warn
          retention-days: 14

      - name: Report all failed steps and preserve failure status
        shell: pwsh
        env:
          check_checkout: ${{ steps.check_checkout.outcome }}
          check_set_up_python: ${{ steps.check_set_up_python.outcome }}
          check_reuse_the_committed_manila_district: ${{ steps.check_reuse_the_committed_manila_district.outcome }}
          check_reuse_cached_manila_facade_improvem: ${{ steps.check_reuse_cached_manila_facade_improvem.outcome }}
          check_fetch_and_validate_real_manila_elev: ${{ steps.check_fetch_and_validate_real_manila_elev.outcome }}
          check_reuse_cached_manila_street_names_do: ${{ steps.check_reuse_cached_manila_street_names_do.outcome }}
          check_stage_the_real_manila_district_and_: ${{ steps.check_stage_the_real_manila_district_and_.outcome }}
          check_reuse_committed_amman_map_generate_: ${{ steps.check_reuse_committed_amman_map_generate_.outcome }}
          check_use_the_existing_chicago_map_from_t: ${{ steps.check_use_the_existing_chicago_map_from_t.outcome }}
          check_use_the_existing_san_francisco_map_: ${{ steps.check_use_the_existing_san_francisco_map_.outcome }}
          check_reuse_committed_chicago_and_san_fra: ${{ steps.check_reuse_committed_chicago_and_san_fra.outcome }}
          check_download_godot_4_4_1_and_windows_ex: ${{ steps.check_download_godot_4_4_1_and_windows_ex.outcome }}
          check_import_and_validate_godot_project: ${{ steps.check_import_and_validate_godot_project.outcome }}
          check_run_the_game_and_capture_aerial_fou: ${{ steps.check_run_the_game_and_capture_aerial_fou.outcome }}
          check_export_windows_game: ${{ steps.check_export_windows_game.outcome }}
          check_smoke_test_the_exported_windows_exe: ${{ steps.check_smoke_test_the_exported_windows_exe.outcome }}
          check_preserve_build_evidence: ${{ steps.check_preserve_build_evidence.outcome }}
        run: |
          $failed = [System.Collections.Generic.List[string]]::new()
          if ($env:check_checkout -eq 'failure') { $failed.Add('Checkout') }
          if ($env:check_set_up_python -eq 'failure') { $failed.Add('Set up Python') }
          if ($env:check_reuse_the_committed_manila_district -eq 'failure') { $failed.Add('Reuse the committed Manila district; generate and cache only when missing') }
          if ($env:check_reuse_cached_manila_facade_improvem -eq 'failure') { $failed.Add('Reuse cached Manila facade improvement; process only when missing or outdated') }
          if ($env:check_fetch_and_validate_real_manila_elev -eq 'failure') { $failed.Add('Fetch and validate real Manila elevation data') }
          if ($env:check_reuse_cached_manila_street_names_do -eq 'failure') { $failed.Add('Reuse cached Manila street names; download only when missing or invalid') }
          if ($env:check_stage_the_real_manila_district_and_ -eq 'failure') { $failed.Add('Stage the real Manila district and player character') }
          if ($env:check_reuse_committed_amman_map_generate_ -eq 'failure') { $failed.Add('Reuse committed Amman map; generate and cache only when missing') }
          if ($env:check_use_the_existing_chicago_map_from_t -eq 'failure') { $failed.Add('Use the existing Chicago map from the repository (never download or regenerate)') }
          if ($env:check_use_the_existing_san_francisco_map_ -eq 'failure') { $failed.Add('Use the existing San Francisco map from the repository (no external download)') }
          if ($env:check_reuse_committed_chicago_and_san_fra -eq 'failure') { $failed.Add('Reuse committed Chicago and San Francisco maps; cache source assets only when missing') }
          if ($env:check_download_godot_4_4_1_and_windows_ex -eq 'failure') { $failed.Add('Download Godot 4.4.1 and Windows export templates') }
          if ($env:check_import_and_validate_godot_project -eq 'failure') { $failed.Add('Import and validate Godot project') }
          if ($env:check_run_the_game_and_capture_aerial_fou -eq 'failure') { $failed.Add('Run the game and capture aerial, four street views, and player') }
          if ($env:check_export_windows_game -eq 'failure') { $failed.Add('Export Windows game') }
          if ($env:check_smoke_test_the_exported_windows_exe -eq 'failure') { $failed.Add('Smoke-test the exported Windows executable') }
          if ($env:check_preserve_build_evidence -eq 'failure') { $failed.Add('Preserve build evidence') }
          if ($failed.Count -gt 0) {
            Write-Host '===== ALL BUILD FAILURES ====='
            foreach ($step in $failed) { Write-Host "FAILED_STEP=$step" }
            Write-Host "BUILD_FAILURE_COUNT=$($failed.Count)"
            throw "$($failed.Count) step(s) failed; all workflow checks and visual capture steps were attempted where possible."
          }
          Write-Host 'BUILD_ALL_STEPS_PASS'
