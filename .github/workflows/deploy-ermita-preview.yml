name: Deploy Adam City building and city pages to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "ermita.html"
      - "buildings.html"
      - "ermita/maps/generated/ermita-road-network.geojson"
      - "ermita/maps/generated/ermita-building-footprints.geojson"
      - ".github/workflows/deploy-ermita-preview.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ermita-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only the pages needed for deployment
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            ermita.html
            buildings.html
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          for source in ('index.html', 'ermita.html', 'buildings.html'):
              html = open(source, encoding='utf-8').read()
              scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
              scripts = [s for s in scripts if s.strip()]
              if not scripts:
                  raise SystemExit(f'No inline JavaScript found in {source}')
              target = '/tmp/' + source.replace('.html', '-inline.js')
              open(target, 'w', encoding='utf-8').write(scripts[-1])
              print(f'Extracted inline JavaScript: {source}')
          PY
          node --check /tmp/index-inline.js
          node --check /tmp/ermita-inline.js
          node --check /tmp/buildings-inline.js
      - name: Prepare static site
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/index.html
          cp ermita.html _site/ermita.html
          cp buildings.html _site/buildings.html
          cat > _site/README.txt <<'EOF'
          Adam City pages:
          - index.html: main site
          - ermita.html: Ermita 3D preview
          - buildings.html: independent OpenFreeMap and OSM building-source viewer
          Source repository: https://github.com/saeedhub101/Adam-City
          EOF
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
