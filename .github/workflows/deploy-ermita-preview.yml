name: Deploy Adam City single-page site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "ermita.html"
      - "ermita/maps/generated/ermita-road-network.geojson"
      - "ermita/maps/generated/ermita-building-footprints.geojson"
      - ".github/workflows/deploy-ermita-preview.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ermita-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only the single-page site (avoid downloading multi-GB source archives)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            ermita.html
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Validate page JavaScript syntax
        run: |
          python - <<'PY'
          import re
          for source, target in [('index.html', '/tmp/index-inline.js'), ('ermita.html', '/tmp/ermita-inline.js')]:
              html = open(source, encoding='utf-8').read()
              scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
              scripts = [s for s in scripts if s.strip()]
              if not scripts:
                  raise SystemExit(f'No inline JavaScript found in {source}')
              open(target, 'w', encoding='utf-8').write(scripts[-1])
          PY
          node --check /tmp/index-inline.js
          node --check /tmp/ermita-inline.js
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\\s\\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline application script found.")
          Path("/tmp/adam-city-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/adam-city-inline.js
      - name: Prepare static map site
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/index.html
          cp ermita.html _site/ermita.html
          cat > _site/README.txt <<'EOF'
          Adam City — single-page 3D city map for Ermita, Manila.
          Data source and project files: https://github.com/saeedhub101/Adam-City
          The map loads public GeoJSON from this repository's main branch.
          EOF
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
