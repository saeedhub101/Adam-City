name: Rebuild Housing Bank Complex GLB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "middle east/BuildGLB/amman/housing-bank/rebuild_housing_bank.py"
      - ".github/workflows/rebuild-housing-bank-complex.yml"
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preserve existing GLB tile as rebuild source
        run: |
          set -euo pipefail
          TILE="middle east/BuildGLB/amman/amman_3590_3197.glb"
          SOURCE="middle east/BuildGLB/amman/amman_3590_3197_source.glb"
          test -s "$TILE"
          cp "$TILE" "$SOURCE"
          cmp -s "$TILE" "$SOURCE"
          echo "Using the GLB already committed in this repository; no external tile download."
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Rebuild complex in Blender
        run: blender -b --python "middle east/BuildGLB/amman/housing-bank/rebuild_housing_bank.py"
      - name: Validate GLB and replacement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct,pathlib
          p=pathlib.Path("middle east/BuildGLB/amman/amman_3590_3197.glb")
          b=p.read_bytes()
          assert b[:4]==b"glTF" and struct.unpack_from("<I",b,8)[0]==len(b), "Invalid GLB"
          n=struct.unpack_from("<I",b,12)[0]
          j=json.loads(b[20:20+n].decode("utf-8").rstrip("\x00 "))
          names=[x.get("name","") for x in j.get("nodes",[])]
          assert "HousingBank_Podium" in names and "HousingBank_F21_ProjectingSlab" in names, "Rebuilt building nodes missing"
          report=pathlib.Path("middle east/BuildGLB/amman/housing-bank/REBUILD_REPORT.md").read_text()
          assert "Removed nearby source building meshes: NONE FOUND" not in report, "No original building mesh was identified for replacement; refusing to publish output"
          print("VALID GLB",len(b),"bytes; nodes",len(names))
          PY
      - name: Save rebuilt tile and report
        run: |
          set -euo pipefail
          rm -f "middle east/BuildGLB/amman/amman_3590_3197_source.glb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "middle east/BuildGLB/amman/amman_3590_3197.glb" "middle east/BuildGLB/amman/housing-bank/REBUILD_REPORT.md"
          git commit -m "Rebuild Housing Bank Complex in existing Amman GLB tile" || echo "No changes to commit"
          git push
