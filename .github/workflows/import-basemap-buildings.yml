name: RETIRED — Basemap building replacement paused

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current source policy
        run: |
          echo "The legacy Basemap importer overwrote the existing building footprint file and mixed in OSM attributes."
          echo "It is disabled to preserve all existing source records and comply with the current no-OSM import scope."
          echo "Independent Google satellite-derived footprints are imported as a separate source."
          echo "No download, replacement, or commit is performed."
