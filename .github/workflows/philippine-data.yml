name: Philippine data consolidation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/aggregate_philippine_data.py'
      - '.github/workflows/philippine-data.yml'

permissions:
  contents: write

concurrency:
  group: philippine-data-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Aggregate all repository data and checkpoint incrementally
        env:
          GITHUB_ACTIONS: 'true'
          PHILIPPINE_CHUNK_BYTES: '1800000'
          PHILIPPINE_CHECKPOINT_FILES: '1'
        run: python -u scripts/aggregate_philippine_data.py
      - name: Commit any remaining results
        if: always()
        run: |
          git add Philippine scripts/aggregate_philippine_data.py .github/workflows/philippine-data.yml
          if git diff --cached --quiet; then echo "No pending changes."; else git commit -m "Finalize Philippine data consolidation"; fi
          git push origin HEAD:main
