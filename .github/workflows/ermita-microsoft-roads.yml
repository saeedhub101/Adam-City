name: Import Microsoft road detections for Ermita

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ermita/scripts/import_microsoft_road_detections.py'
      - '.github/workflows/ermita-microsoft-roads.yml'

permissions:
  contents: write

concurrency:
  group: ermita-microsoft-roads-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry dependency
        run: pip install shapely
      - name: Download and clip Microsoft road detections
        run: python ermita/scripts/import_microsoft_road_detections.py
      - name: Commit clipped road data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/maps/external/ermita-microsoft-road-detections.geojson
          if git diff --cached --quiet; then
            echo "No Microsoft road data changes."
          else
            git commit -m "Import Microsoft road detections for Ermita"
            git push origin main
          fi
