name: Import Google Open Buildings for Ermita (non-OSM)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ermita/scripts/import_google_open_buildings.py"
      - ".github/workflows/import-google-open-buildings-ermita.yml"

permissions:
  contents: write

concurrency:
  group: ermita-google-open-buildings
  cancel-in-progress: false

jobs:
  import-google-buildings:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install spatial dependencies
        run: python -m pip install shapely s2geometry
      - name: Download only intersecting Google Open Buildings S2 cells and clip to Ermita
        run: python ermita/scripts/import_google_open_buildings.py
      - name: Commit building data and report without replacing existing sources
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/maps/sources/google-open-buildings
          if git diff --cached --quiet; then
            echo "No new Google Open Buildings data."
            exit 0
          fi
          git commit -m "Add Google Open Buildings footprint data for Ermita"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Remote main changed; stopped without overwriting source data."
            exit 1
          fi
          git push origin HEAD:main
