name: Build and save Malate map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/cache-malate-map.yml'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  cache-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the saved map already exists
        id: map-cache
        run: |
          mkdir -p maps buo_maps
          if [ -s maps/malate-map.json ] && python -c "import json; d=json.load(open('maps/malate-map.json')); e=d.get('elements',[]); t=[x.get('tags',{}) for x in e]; assert isinstance(e,list) and len(e)>0 and any(x.get('railway') in ('rail','light_rail') for x in t) and any(x.get('natural') in ('water','beach') or x.get('waterway')=='riverbank' for x in t)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A valid saved Malate map already exists in GitHub. Skipping OpenStreetMap download."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Saved Malate map is missing or invalid. It will be downloaded."
          fi
      - name: Download Malate streets and building footprints only when missing
        if: steps.map-cache.outputs.exists == 'false'
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request, os
          bbox=[14.55,120.97,14.585,121.005]
          s,w,n,e=bbox
          query=f'[out:json][timeout:180];(way({s},{w},{n},{e})[building];way({s},{w},{n},{e})[highway];way({s},{w},{n},{e})[railway~"^(rail|light_rail|subway|tram)$"];way({s},{w},{n},{e})[natural~"^(water|beach)$"];way({s},{w},{n},{e})[waterway=riverbank];);out body geom;'
          endpoints=[
            'https://overpass-api.de/api/interpreter',
            'https://overpass.kumi.systems/api/interpreter',
            'https://overpass.private.coffee/api/interpreter',
            'https://overpass.nchc.org.tw/api/interpreter',
          ]
          errors=[]
          for endpoint in endpoints:
            try:
              req=urllib.request.Request(endpoint,data=urllib.parse.urlencode({'data':query}).encode(),headers={'User-Agent':'AdamCityMapCache/1.0 (Malate game map; © OpenStreetMap contributors)','Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=180) as response: raw=json.load(response)
              elements=[]; buildings=roads=0
              keep_tags={'building','building:levels','height','name','name:en','amenity','shop','office','tourism','highway','surface','lanes','oneway','service','railway','bridge','layer','natural','water','waterway','width'}
              for el in raw.get('elements',[]):
                tags=el.get('tags',{})
                is_building='building' in tags; is_road='highway' in tags
                if not (is_building or is_road): continue
                geom=el.get('geometry',[])
                if len(geom)<2: continue
                item={'type':'way','id':el['id'],'tags':{k:v for k,v in tags.items() if k in keep_tags},'geometry':[{'lat':round(p['lat'],5),'lon':round(p['lon'],5)} for p in geom]}
                elements.append(item); buildings+=int(is_building); roads+=int(is_road)
              if buildings<100 or roads<50: raise RuntimeError(f'Map too small: {buildings} buildings, {roads} roads')
              data={'version':0.6,'generator':'Adam City Malate OSM map','elements':elements,'_cache':{'region':'Malate, Manila, Philippines','center':{'lat':14.5717,'lon':120.9854},'bbox':bbox,'fetched_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'source':'© OpenStreetMap contributors','buildings':buildings,'roads':roads,'features':len(elements)}}
              with open('maps/malate-map.json','w',encoding='utf-8') as out: json.dump(data,out,separators=(',',':'),ensure_ascii=False)
              size=os.path.getsize('maps/malate-map.json')
              print(f'Malate map: {buildings} buildings, {roads} roads, {size/1024/1024:.1f} MB')
              if size>90*1024*1024: raise RuntimeError(f'Malate map is too large ({size/1024/1024:.1f} MB)')
              break
            except Exception as exc:
              errors.append(f'{endpoint}: {exc}'); print(errors[-1])
          else: raise SystemExit('Could not fetch Malate map: '+'; '.join(errors))
          PY
      - name: Build street-name cache only when missing
        run: |
          mkdir -p maps
          if [ -s maps/malate-streets.json ] && python -c "import json; d=json.load(open('maps/malate-streets.json')); assert isinstance(d.get('streets'), list) and len(d['streets']) > 0"; then
            echo "A valid street-name cache already exists in GitHub. Skipping street-name import."
          else
            echo "Street-name cache is missing or invalid. Building it from the saved OSM map."
            python - <<'PY'
          import json, os, time
          src='maps/malate-map.json'
          if not os.path.isfile(src): raise SystemExit('Map cache is missing; run the map download workflow first.')
          data=json.load(open(src,encoding='utf-8'))
          streets={}
          for el in data.get('elements',[]):
            tags=el.get('tags',{})
            name=tags.get('name') or tags.get('name:en')
            if not name or not tags.get('highway'): continue
            geom=el.get('geometry',[])
            if len(geom)<2: continue
            key=(str(name).strip(),str(tags.get('highway','')),tuple((round(float(p['lat']),5),round(float(p['lon']),5)) for p in (geom[0],geom[-1])))
            if key in streets: continue
            mid=geom[len(geom)//2]
            streets[key]={'name':str(name).strip(),'name_en':tags.get('name:en',str(name).strip()),'highway':tags.get('highway',''),'oneway':tags.get('oneway','no'),'surface':tags.get('surface',''),'coordinates':[{'lat':round(float(p['lat']),5),'lon':round(float(p['lon']),5)} for p in geom],'lat':round(float(mid['lat']),5),'lon':round(float(mid['lon']),5),'osm_way_id':el.get('id')}
          result={'region':'Malate, Manila, Philippines','source':'© OpenStreetMap contributors','generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'streets':list(streets.values())}
          if not result['streets']: raise SystemExit('No named OSM streets found in the saved map; refusing to write an empty cache.')
          json.dump(result,open('maps/malate-streets.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          print(f"Saved {len(result['streets'])} named street segments.")
          PY
          fi
      - name: Save named map and backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          cp maps/malate-map.json buo_maps/malate-map.json
          printf '%s\n' '# Game maps' '' 'Playable map files are named by location, for example malate-map.json.' > maps/README.md
          printf '%s\n' '# Map backups' '' 'Backup files use the same location-based filenames as maps/.' > buo_maps/README.md
          git add -f maps/malate-map.json maps/malate-streets.json buo_maps/malate-map.json maps/README.md buo_maps/README.md
          if git diff --cached --quiet -- maps/malate-map.json maps/malate-streets.json buo_maps/malate-map.json maps/README.md buo_maps/README.md; then
            echo "Malate map and backup are unchanged."
            exit 0
          fi
          git commit -m "Save Malate map and backup"
          git push
