name: Update only missing Malate map data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-malate-map.yml'

permissions:
  contents: write

jobs:
  update-missing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check saved datasets and import only missing place categories
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          map_path = Path('maps/malate-map.json')
          streets_path = Path('maps/malate-streets.json')
          places_path = Path('maps/malate-places.json')
          for path in (map_path, streets_path, places_path):
              if path.exists() and path.stat().st_size:
                  print(f'KEEP existing dataset: {path} ({path.stat().st_size:,} bytes)')
              else:
                  print(f'MISSING dataset: {path}')

          # Never re-import street names or replace the detailed map if already saved.
          # Airport data is intentionally excluded until the playable map expands.
          required = {
              'hospital': 'hospital',
              'clinic': 'clinic',
              'doctors': 'doctors',
              'pharmacy': 'pharmacy',
              'hotel': 'hotel',
              'helicopter': 'helicopter landing site / helipad',
              'fire_station': 'fire station',
              'police': 'police station',
              'school': 'school',
              'university': 'university',
              'college': 'college',
              'bus_station': 'bus station',
              'ferry_terminal': 'ferry terminal',
              'transit': 'railway / public transport stop',
              'museum': 'museum',
              'attraction': 'tourist attraction',
              'information': 'visitor information',
          }
          existing = {'region':'Malate, Manila, Philippines','source':'© OpenStreetMap contributors','places':[]}
          if places_path.exists() and places_path.stat().st_size:
              try:
                  existing = json.loads(places_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  raise SystemExit(f'Existing place dataset is unreadable; refusing to overwrite it: {exc}')
          places = existing.get('places', [])
          present = {p.get('kind') for p in places}
          missing = [k for k in required if k not in present]
          print('Existing place markers:', len(places), 'categories:', sorted(k for k in present if k))
          if not missing:
              print('All requested Malate place categories already exist. No Overpass download needed.')
          else:
              print('Only missing categories will be queried:', missing)
              s,w,n,e = 14.55,120.97,14.585,121.005
              selectors = {
                'hospital': f'(node({s},{w},{n},{e})[amenity=hospital];way({s},{w},{n},{e})[amenity=hospital];node({s},{w},{n},{e})[healthcare=hospital];way({s},{w},{n},{e})[healthcare=hospital];)',
                'clinic': f'(node({s},{w},{n},{e})[amenity=clinic];way({s},{w},{n},{e})[amenity=clinic];node({s},{w},{n},{e})[healthcare=clinic];way({s},{w},{n},{e})[healthcare=clinic];)',
                'doctors': f'(node({s},{w},{n},{e})[amenity=doctors];way({s},{w},{n},{e})[amenity=doctors];)',
                'pharmacy': f'(node({s},{w},{n},{e})[amenity=pharmacy];way({s},{w},{n},{e})[amenity=pharmacy];)',
                'hotel': f'(node({s},{w},{n},{e})[tourism~"^(hotel|motel|hostel|guest_house)$"];way({s},{w},{n},{e})[tourism~"^(hotel|motel|hostel|guest_house)$"];way({s},{w},{n},{e})[building=hotel];)',
                'helicopter': f'(node({s},{w},{n},{e})[aeroway=helipad];way({s},{w},{n},{e})[aeroway=helipad];node({s},{w},{n},{e})[aeroway=heliport];way({s},{w},{n},{e})[aeroway=heliport];node({s},{w},{n},{e})[emergency=landing_site];way({s},{w},{n},{e})[emergency=landing_site];)',
                'fire_station': f'(node({s},{w},{n},{e})[amenity=fire_station];way({s},{w},{n},{e})[amenity=fire_station];)',
                'police': f'(node({s},{w},{n},{e})[amenity=police];way({s},{w},{n},{e})[amenity=police];)',
                'school': f'(node({s},{w},{n},{e})[amenity=school];way({s},{w},{n},{e})[amenity=school];)',
                'university': f'(node({s},{w},{n},{e})[amenity=university];way({s},{w},{n},{e})[amenity=university];)',
                'college': f'(node({s},{w},{n},{e})[amenity=college];way({s},{w},{n},{e})[amenity=college];)',
                'bus_station': f'(node({s},{w},{n},{e})[amenity=bus_station];way({s},{w},{n},{e})[amenity=bus_station];)',
                'ferry_terminal': f'(node({s},{w},{n},{e})[amenity=ferry_terminal];way({s},{w},{n},{e})[amenity=ferry_terminal];)',
                'transit': f'(node({s},{w},{n},{e})[railway~"^(station|halt|tram_stop|subway_entrance)$"];way({s},{w},{n},{e})[railway~"^(station|halt|tram_stop|subway_entrance)$"];node({s},{w},{n},{e})[public_transport~"^(station|platform|stop_position)$"];way({s},{w},{n},{e})[public_transport~"^(station|platform)$"];)',
                'museum': f'(node({s},{w},{n},{e})[tourism=museum];way({s},{w},{n},{e})[tourism=museum];)',
                'attraction': f'(node({s},{w},{n},{e})[tourism=attraction];way({s},{w},{n},{e})[tourism=attraction];)',
                'information': f'(node({s},{w},{n},{e})[tourism=information];way({s},{w},{n},{e})[tourism=information];)',
              }
              query='[out:json][timeout:120];(' + ''.join(selectors[k] for k in missing) + ');out body geom;'
              endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter']
              raw=None; errors=[]
              for endpoint in endpoints:
                  try:
                      req=urllib.request.Request(endpoint,data=urllib.parse.urlencode({'data':query}).encode(),headers={'User-Agent':'AdamCityMapCache/2.0 (Malate Manila; © OpenStreetMap contributors)','Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=140) as response: raw=json.load(response)
                      break
                  except Exception as exc:
                      errors.append(f'{endpoint}: {exc}')
                      print(errors[-1])
                      time.sleep(2)
              if raw is None:
                  raise SystemExit('Could not fetch only the missing place categories; saved datasets were preserved. '+'; '.join(errors))
              tag_keys={'name','name:en','amenity','healthcare','tourism','building','aeroway','emergency','railway','public_transport','operator','brand','addr:housenumber','addr:street','addr:city','addr:postcode','phone','website','opening_hours','wheelchair','helipad','iata','icao'}
              seen={(p.get('osm_type'),p.get('osm_id')) for p in places}
              added=0
              for el in raw.get('elements',[]):
                  tags=el.get('tags',{}); typ=el.get('type'); kind=None
                  if tags.get('amenity')=='hospital' or tags.get('healthcare')=='hospital': kind='hospital'
                  elif tags.get('amenity')=='clinic' or tags.get('healthcare')=='clinic': kind='clinic'
                  elif tags.get('amenity') in ('doctors','pharmacy','fire_station','police','school','university','college','bus_station','ferry_terminal'): kind=tags['amenity']
                  elif tags.get('tourism') in ('hotel','motel','hostel','guest_house') or tags.get('building')=='hotel': kind='hotel'
                  elif tags.get('aeroway') in ('helipad','heliport') or tags.get('emergency')=='landing_site': kind='helicopter'
                  elif tags.get('railway') in ('station','halt','tram_stop','subway_entrance') or tags.get('public_transport') in ('station','platform','stop_position'): kind='transit'
                  elif tags.get('tourism') in ('museum','attraction','information'): kind=tags['tourism']
                  if kind not in missing: continue
                  key=(typ,el.get('id'))
                  if key in seen: continue
                  geom=el.get('geometry') or ([{'lat':el['lat'],'lon':el['lon']}] if typ=='node' and 'lat' in el else [])
                  if not geom: continue
                  if typ=='node': pt=geom[0]
                  else: pt={'lat':sum(float(p['lat']) for p in geom)/len(geom),'lon':sum(float(p['lon']) for p in geom)/len(geom)}
                  places.append({'osm_type':typ,'osm_id':el.get('id'),'kind':kind,'name':tags.get('name') or tags.get('name:en') or kind.replace('_',' ').title(),'lat':round(float(pt['lat']),6),'lon':round(float(pt['lon']),6),'tags':{k:v for k,v in tags.items() if k in tag_keys}})
                  seen.add(key); added+=1
              existing['region']='Malate, Manila, Philippines'
              existing['source']='© OpenStreetMap contributors'
              existing['generated_utc']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
              existing['places']=places
              places_path.parent.mkdir(parents=True,exist_ok=True)
              places_path.write_text(json.dumps(existing,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
              print('Added',added,'new place markers; total',len(places))
          # Validate core files; missing map/street caches are reported, not overwritten by a blind full import.
          if not map_path.exists() or map_path.stat().st_size == 0:
              raise SystemExit('Missing maps/malate-map.json. This workflow intentionally does not re-import the full map; restore/create it in a separate map-geometry task.')
          if not streets_path.exists() or streets_path.stat().st_size == 0:
              raise SystemExit('Missing maps/malate-streets.json. This workflow intentionally does not regenerate existing street names.')
          places_path.parent.mkdir(parents=True,exist_ok=True)
          if not places_path.exists():
              places_path.write_text(json.dumps(existing,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          print('Final validation OK. Map and street data preserved; only missing place categories were eligible for import.')
          PY

      - name: Commit only changed place dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add maps/malate-places.json
          if git diff --cached --quiet; then
            echo "Nothing missing or changed; no commit needed."
            exit 0
          fi
          git commit -m "Import only missing Malate place markers"
          git push
