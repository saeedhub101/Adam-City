name: Enrich Malate map data safely

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-malate-map.yml'

permissions:
  contents: write

jobs:
  enrich-map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Import missing POIs in small resilient requests
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, re, time, urllib.parse, urllib.request
          from pathlib import Path
          map_path=Path('maps/malate-map.json')
          streets_path=Path('maps/malate-streets.json')
          places_path=Path('maps/malate-places.json')
          for p in (map_path,streets_path):
              if not p.exists() or not p.stat().st_size: raise SystemExit(f'Required saved map file missing: {p}; refusing destructive rebuild')
          data={'region':'Malate, Manila, Philippines','source':'© OpenStreetMap contributors','places':[]}
          if places_path.exists() and places_path.stat().st_size:
              data=json.loads(places_path.read_text(encoding='utf-8'))
          places=data.setdefault('places',[])
          seen={(p.get('osm_type'),p.get('osm_id')) for p in places}
          s,w,n,e=14.55,120.97,14.585,121.005
          box=f'({s},{w},{n},{e})'
          selectors={
            'hospital':f'nwr{box}[amenity=hospital];nwr{box}[healthcare=hospital];',
            'clinic':f'nwr{box}[amenity=clinic];nwr{box}[healthcare=clinic];',
            'doctors':f'nwr{box}[amenity=doctors];','pharmacy':f'nwr{box}[amenity=pharmacy];',
            'hotel':f'nwr{box}[tourism~"^(hotel|motel|hostel|guest_house)$"];nwr{box}[building=hotel];',
            'helicopter':f'nwr{box}[aeroway~"^(helipad|heliport)$"];nwr{box}[emergency=landing_site];',
            'fire_station':f'nwr{box}[amenity=fire_station];','police':f'nwr{box}[amenity=police];',
            'school':f'nwr{box}[amenity=school];','university':f'nwr{box}[amenity=university];','college':f'nwr{box}[amenity=college];',
            'bus_station':f'nwr{box}[amenity=bus_station];','ferry_terminal':f'nwr{box}[amenity=ferry_terminal];',
            'transit':f'nwr{box}[railway~"^(station|halt|tram_stop|subway_entrance|platform)$"];nwr{box}[public_transport~"^(station|platform|stop_position)$"];nwr{box}[highway=bus_stop];',
            'museum':f'nwr{box}[tourism=museum];','attraction':f'nwr{box}[tourism=attraction];','information':f'nwr{box}[tourism=information];',
            'mall':f'nwr{box}[shop=mall];nwr{box}[building=retail][name];',
            'seven_eleven':f'nwr{box}[brand~"(?i)7.?eleven"];nwr{box}[name~"(?i)7.?eleven"];nwr{box}[operator~"(?i)7.?eleven"];nwr{box}[brand="7-11"];nwr{box}[name="7-11"];',
            'supermarket':f'nwr{box}[shop=supermarket];','convenience':f'nwr{box}[shop=convenience];',
            'restaurant':f'nwr{box}[amenity=restaurant];','cafe':f'nwr{box}[amenity=cafe];','bank':f'nwr{box}[amenity=bank];','atm':f'nwr{box}[amenity=atm];',
            'place_of_worship':f'nwr{box}[amenity=place_of_worship];','library':f'nwr{box}[amenity=library];','parking':f'nwr{box}[amenity=parking];','toilets':f'nwr{box}[amenity=toilets];',
            'park':f'nwr{box}[leisure=park];','garden':f'nwr{box}[leisure=garden];',
            'tree':f'nwr{box}[natural=tree];','bench':f'nwr{box}[amenity=bench];','waste_basket':f'nwr{box}[amenity=waste_basket];',
            'bicycle_parking':f'nwr{box}[amenity=bicycle_parking];','drinking_water':f'nwr{box}[amenity=drinking_water];',
            'traffic_signals':f'nwr{box}[highway=traffic_signals];','crossing':f'nwr{box}[highway=crossing];',
            'street_lamp':f'nwr{box}[highway=street_lamp];','fire_hydrant':f'nwr{box}[emergency=fire_hydrant];',
            'bus_stop':f'nwr{box}[highway=bus_stop];','bicycle_rental':f'nwr{box}[amenity=bicycle_rental];',
            'charging_station':f'nwr{box}[amenity=charging_station];','fuel':f'nwr{box}[amenity=fuel];'
          }
          tag_keys={'name','name:en','amenity','healthcare','tourism','building','building:levels','building:part','height','min_height','roof:shape','roof:height','aeroway','emergency','railway','public_transport','operator','brand','addr:housenumber','addr:street','addr:city','addr:postcode','phone','website','opening_hours','wheelchair','shop','leisure','landuse','highway','natural','barrier','surface','lit','crossing','kerb','traffic_calming','maxspeed','oneway','lanes','width','route','ref','bench','shelter','covered','access'}
          endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter']
          def fetch(kind,selector):
              query='[out:json][timeout:35];('+selector+');out center tags;'
              errors=[]
              for attempt in range(2):
                for endpoint in endpoints:
                  try:
                    req=urllib.request.Request(endpoint,data=urllib.parse.urlencode({'data':query}).encode(),headers={'User-Agent':'AdamCityMapCache/3.0 (OpenStreetMap data consumer)','Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'})
                    with urllib.request.urlopen(req,timeout=45) as res: return json.load(res).get('elements',[])
                  except Exception as ex:
                    errors.append(f'{endpoint}: {ex}')
                time.sleep(3+attempt*4)
              print(f'WARNING skip {kind}; all endpoints failed: {" | ".join(errors[-3:])}')
              return None
          def classify(t):
              seven_eleven_text=' '.join(str(t.get(k,'')) for k in ('name','name:en','brand','brand:en','operator','official_name'))
              if re.search(r'7\s*[-‐‑–—]?\s*eleven|7eleven|7\s*[- ]?\s*11',seven_eleven_text,re.I): return 'convenience'
              a=t.get('amenity'); h=t.get('highway'); sh=t.get('shop'); le=t.get('leisure'); to=t.get('tourism')
              if a=='hospital' or t.get('healthcare')=='hospital': return 'hospital'
              if a=='clinic' or t.get('healthcare')=='clinic': return 'clinic'
              if a in ('doctors','pharmacy','fire_station','police','school','university','college','bus_station','ferry_terminal','restaurant','cafe','bank','atm','place_of_worship','library','parking','toilets','bench','waste_basket','bicycle_parking','drinking_water','bicycle_rental','charging_station','fuel'): return a
              if to in ('hotel','motel','hostel','guest_house') or t.get('building')=='hotel': return 'hotel'
              if t.get('aeroway') in ('helipad','heliport') or t.get('emergency')=='landing_site': return 'helicopter'
              if t.get('railway') in ('station','halt','tram_stop','subway_entrance','platform') or t.get('public_transport') in ('station','platform','stop_position') or h=='bus_stop': return 'transit' if h!='bus_stop' else 'bus_stop'
              if to in ('museum','attraction','information'): return to
              if sh=='mall' or (t.get('building')=='retail' and t.get('name')): return 'mall'
              if sh in ('supermarket','convenience'): return sh
              if le in ('park','garden'): return le
              if t.get('natural')=='tree': return 'tree'
              if h in ('traffic_signals','crossing','street_lamp'): return {'traffic_signals':'traffic_signals','crossing':'crossing','street_lamp':'street_lamp'}[h]
              if t.get('emergency')=='fire_hydrant': return 'fire_hydrant'
              return None
          missing_kinds=set()
          added=0
          for kind,selector in selectors.items():
              # A category is rechecked each run so the cache gradually receives newly mapped OSM features.
              els=fetch(kind,selector)
              if els is None:
                missing_kinds.add(kind); continue
              cat_added=0
              for el in els:
                tags=el.get('tags',{}); actual=classify(tags)
                if not actual: continue
                typ=el.get('type'); oid=el.get('id'); key=(typ,oid)
                if key in seen: continue
                if typ=='node' and 'lat' in el: lat,lon=el['lat'],el['lon']
                elif el.get('center'): lat,lon=el['center']['lat'],el['center']['lon']
                else: continue
                places.append({'osm_type':typ,'osm_id':oid,'kind':actual,'name':tags.get('name') or tags.get('name:en') or actual.replace('_',' ').title(),'lat':round(float(lat),6),'lon':round(float(lon),6),'tags':{k:v for k,v in tags.items() if k in tag_keys}})
                seen.add(key); cat_added+=1; added+=1
              print(f'{kind}: fetched {len(els)}, added {cat_added}')
          data['region']='Malate, Manila, Philippines'
          data['source']='© OpenStreetMap contributors'
          data['generated_utc']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          data['places']=places
          places_path.parent.mkdir(parents=True,exist_ok=True)
          places_path.write_text(json.dumps(data,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          print(f'Place cache total: {len(places)}; newly added: {added}; categories with temporary query failures: {sorted(missing_kinds)}')
          # Geometry files are preserved byte-for-byte by this task.
          print(f'Preserved {map_path} ({map_path.stat().st_size:,} bytes) and {streets_path} ({streets_path.stat().st_size:,} bytes)')
          PY
      - name: Commit changed place cache only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add maps/malate-places.json
          if git diff --cached --quiet; then echo "No new OSM places to commit."; exit 0; fi
          git commit -m "Expand Malate POIs and street details from OpenStreetMap"
          git push
