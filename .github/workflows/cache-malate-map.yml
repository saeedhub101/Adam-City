name: Cache Metro Manila OpenStreetMap data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/cache-malate-map.yml'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  cache-map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download Metro Manila streets and building footprints
        run: |
          mkdir -p data maps buo_maps
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          # Metro Manila-wide bounding box: south, west, north, east.
          bbox=[14.35,120.85,14.78,121.15]
          s,w,n,e=bbox
          query=f'[out:json][timeout:180];(way({s},{w},{n},{e})[building];way({s},{w},{n},{e})[highway];way({s},{w},{n},{e})[amenity];way({s},{w},{n},{e})[leisure];way({s},{w},{n},{e})[landuse];);out body geom;'
          endpoints=[
            'https://overpass-api.de/api/interpreter',
            'https://overpass.kumi.systems/api/interpreter',
            'https://overpass.private.coffee/api/interpreter',
            'https://overpass.nchc.org.tw/api/interpreter',
          ]
          errors=[]
          for endpoint in endpoints:
            try:
              req=urllib.request.Request(endpoint, data=urllib.parse.urlencode({'data':query}).encode(), headers={'User-Agent':'AdamCityMapCache/1.0 (Metro Manila game map; OSM attribution in game)','Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'})
              with urllib.request.urlopen(req, timeout=210) as response:
                data=json.load(response)
              elements=data.get('elements', [])
              buildings=sum(1 for e in elements if e.get('tags',{}).get('building'))
              roads=sum(1 for e in elements if e.get('tags',{}).get('highway'))
              if buildings < 100 or roads < 100:
                raise RuntimeError(f'Unexpectedly small Metro Manila map: {buildings} buildings, {roads} roads')
              data['_cache']={'region':'Metro Manila, Philippines','center':{'lat':14.5995,'lon':120.9842},'bbox':bbox,'fetched_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'source':'OpenStreetMap contributors; Geofabrik Philippines extract retained as workflow artifact','buildings':buildings,'roads':roads,'features':len(elements)}
              with open('data/manila-osm.json','w',encoding='utf-8') as f:
                json.dump(data,f,separators=(',',':'),ensure_ascii=False)
              print(f'Cached Metro Manila: {buildings} buildings, {roads} roads, {len(elements)} total map features')
              break
            except Exception as exc:
              errors.append(f'{endpoint}: {exc}')
              print(errors[-1])
          else:
            raise SystemExit('Could not download Metro Manila data from any Overpass mirror: '+'; '.join(errors))
          PY
      - name: Download Geofabrik Philippines extract for reference (optional)
        run: |
          mkdir -p reference
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 \
            https://download.geofabrik.de/asia/philippines-latest.osm.pbf \
            --output reference/philippines-latest.osm.pbf
          ls -lh reference/philippines-latest.osm.pbf
        continue-on-error: true
      - name: Keep source extract as a downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: geofabrik-philippines-osm-pbf
          path: reference/philippines-latest.osm.pbf
          retention-days: 14
      - name: Commit cached Metro Manila map to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          cp data/manila-osm.json maps/manila-map.json
          cp data/manila-osm.json buo_maps/manila-map.json
          git add -f data/manila-osm.json maps/manila-map.json buo_maps/manila-map.json
          if git diff --cached --quiet -- data/manila-osm.json maps/manila-map.json buo_maps/manila-map.json; then
            echo "Metro Manila map is unchanged."
            exit 0
          fi
          git commit -m "Cache Metro Manila OpenStreetMap game map"
          git push
