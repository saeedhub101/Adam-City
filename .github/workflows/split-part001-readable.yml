name: Split oversized part-001 GeoJSON

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/split-part001-readable.yml"
      - "scripts/split_oversized_geojson.py"
      - "complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.parts/part-001.geojson"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-part001:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: \${{ secrets.GITHUB_TOKEN }}
      - name: Split and validate source features
        run: python3 scripts/split_oversized_geojson.py
      - name: Commit readable parts and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.parts/part-001-readable-parts
          git add complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.parts/part-001-readable-parts-manifest.json
          if git diff --cached --quiet; then
            echo "Readable parts are already up to date."
            exit 0
          fi
          git commit -m "Split part-001 GeoJSON into readable chunks"
          git push origin HEAD:main
