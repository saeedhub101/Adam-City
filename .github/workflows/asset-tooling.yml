name: Asset tooling checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator unit tests
        run: python -m unittest discover -s Tests -v
      - name: Compile validator
        run: python -m py_compile Tools/validate_glb.py
      - name: Validate source GLB when present
        shell: bash
        run: |
          if [[ -f assets/saeed.glb ]]; then
            python Tools/validate_glb.py assets/saeed.glb --json
          else
            echo "::notice::assets/saeed.glb is missing; only validator tests were run."
          fi

  validate-windows-setup-script:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Parse PowerShell setup script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/Tools/Download-SaeedAsset.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }
          Write-Host "PowerShell syntax validation passed."
