name: Import realistic facade model and PBR textures

on:
  workflow_dispatch:
  push:
    paths:
      - "ermita/scripts/import_facade_assets.py"
      - ".github/workflows/import-facade-assets.yml"

permissions:
  contents: write

concurrency:
  group: ermita-facade-assets
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download compact facade model and high-resolution PBR texture maps
        run: python ermita/scripts/import_facade_assets.py
      - name: Commit downloaded assets into the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/assets/models ermita/assets/textures ermita/assets/asset-catalog.json
          if git diff --cached --quiet; then
            echo "No new asset files; existing repository data is unchanged."
          else
            git commit -m "Import realistic facade model and PBR textures"
            # GitHub Pages and other workflows may update main during this run.
            # Rebase the asset commit on the latest main before pushing, retrying
            # if another workflow wins the race.
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push race on attempt $attempt; retrying against latest main."
              git rebase --abort || true
              sleep 2
            done
            echo "Could not push imported assets after retries."
            exit 1
          fi
