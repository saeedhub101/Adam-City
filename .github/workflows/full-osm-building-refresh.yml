name: Full OSM building refresh for Ermita

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-osm-building-refresh.yml'

permissions:
  contents: write

concurrency:
  group: full-osm-building-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install import and geometry dependencies
        run: |
          python -m pip install --disable-pip-version-check requests osm2geojson trimesh pyproj shapely mapbox-vector-tile mapbox-earcut pillow

      - name: Force a complete OSM baseline for the Ermita boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s ermita/maps/generated/ermita-osm-raw.json
          # Removing only the sync checkpoint makes the existing importer run its full
          # area query instead of its normal incremental query. The cached data itself
          # remains in place until a successful full Overpass response is received.
          rm -f ermita/maps/generated/ermita-osm-sync-state.json
          python ermita/scripts/import_osm_and_build_3d.py
          test -s ermita/maps/generated/ermita-osm-raw.json
          test -s ermita/maps/generated/ermita-building-footprints.geojson
          test -s ermita/maps/generated/ermita-building-details.geojson
          test -s ermita/maps/generated/ermita-building-details.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("ermita/maps/generated/import-report.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("sync_mode") == "full_baseline", d.get("sync_mode")
          assert d.get("building_detail_feature_count", 0) > 0, d.get("building_detail_feature_count")
          print(json.dumps({k:d.get(k) for k in ("sync_mode","osm_element_count","geojson_feature_count","building_feature_count","building_detail_feature_count","building_detail_tag_presence_counts")}, ensure_ascii=False, indent=2))
          PY

      - name: Re-export complete OSM building and thematic detail layers
        run: |
          set -euo pipefail
          python ermita/scripts/export_osm_detail_layers.py
          python ermita/scripts/export_osm_additional_themes.py
          test -s complete_data/OSM/data/buildings/ermita-building-roof-details.geojson
          test -s complete_data/OSM/data/buildings/ermita-building-roof-details.csv
          test -s complete_data/OSM/quality/osm-detail-layer-export-report.json
          test -s complete_data/OSM/quality/osm-additional-theme-export-report.json

      - name: Refresh licensed building reference photos
        continue-on-error: true
        run: |
          python ermita/scripts/import_commons_building_photos.py

      - name: Commit refreshed building data and reports to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/maps/generated/ermita-osm-raw.json \
                  ermita/maps/generated/ermita-features.geojson \
                  ermita/maps/generated/ermita-building-footprints.geojson \
                  ermita/maps/generated/ermita-building-details.geojson \
                  ermita/maps/generated/ermita-building-details.csv \
                  ermita/maps/generated/ermita-all-feature-tags.csv \
                  ermita/maps/generated/ermita-places-businesses-infrastructure.csv \
                  ermita/maps/generated/ermita-osm-sync-state.json \
                  ermita/maps/generated/import-report.json \
                  ermita/maps/generated/ermita-street-signs-and-signals.geojson \
                  ermita/maps/generated/ermita-street-signs-and-signals.csv \
                  ermita/3d/generated/ermita-buildings-extruded.glb \
                  ermita/3d/generated/building-height-methods.csv \
                  ermita/buildings/reference_photos/ \
                  ermita/buildings/reference_photos_catalog.json \
                  complete_data/OSM/data/buildings/ \
                  complete_data/OSM/data/pedestrian/ \
                  complete_data/OSM/data/roads/ \
                  complete_data/OSM/data/addresses/ \
                  complete_data/OSM/data/administrative/ \
                  complete_data/OSM/data/places/ \
                  complete_data/OSM/data/nature/ \
                  complete_data/OSM/quality/ \
                  complete_data/OSM/manifest.json \
                  complete_data/OSM/README.md
          if git diff --cached --quiet; then
            echo "Full OSM building refresh completed; no tracked output changed."
            exit 0
          fi
          git commit -m "Refresh full OSM building attributes and references"
          git push origin HEAD:main
