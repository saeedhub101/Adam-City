name: Import open aerial sources for Ermita

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ermita/scripts/import_openaerialmap_ermita.py'
      - 'ermita/scripts/import_tm_open_buildings_ermita.py'
      - '.github/workflows/import-open-aerial-sources.yml'

permissions:
  contents: write

concurrency:
  group: import-open-aerial-sources
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Import OpenAerialMap and check TM Open Buildings coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 ermita/scripts/import_openaerialmap_ermita.py
          python3 ermita/scripts/import_tm_open_buildings_ermita.py
          test -s ermita/maps/external/openaerialmap/ermita-openaerialmap-import-report.json
          test -s ermita/maps/sources/tm-open-buildings/tm-open-buildings-ermita-import-report.json

      - name: Commit imported source assets and reports
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/maps/external/openaerialmap/ ermita/maps/sources/tm-open-buildings/
          if git diff --cached --quiet; then
            echo "No new aerial assets or source reports to commit."
            exit 0
          fi
          git commit -m "Import open aerial source assets for Ermita"
          git push origin HEAD:main
