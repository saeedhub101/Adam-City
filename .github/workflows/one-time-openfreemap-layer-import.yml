name: One-time OpenFreeMap missing-layer import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-openfreemap-layer-import.yml"

permissions:
  contents: write

concurrency:
  group: one-time-openfreemap-layer-import
  cancel-in-progress: false

jobs:
  import-missing-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compare and append only missing source layers
        run: python3 .github/scripts/one-time-openfreemap-layer-import.py

      - name: Remove the one-time importer and its workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/one-time-openfreemap-layer-import.py
          rm .github/workflows/one-time-openfreemap-layer-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Manila/vector-tiles Manila/openfreemap-layer-import-report.md .github/scripts/one-time-openfreemap-layer-import.py .github/workflows/one-time-openfreemap-layer-import.yml
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "Import only missing OpenFreeMap source layers into Manila tiles"
          git push origin HEAD:main
