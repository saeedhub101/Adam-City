name: Merge Building Masters

on:
  push:
    branches: [main]
    paths:
      - "complete_data/OSM/scripts/merge_repository_building_masters.py"
      - ".github/workflows/merge-building-masters.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-building-masters-main
  cancel-in-progress: false

jobs:
  merge-building-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install streaming GeoJSON parser
        run: python -m pip install --disable-pip-version-check ijson
      - name: Merge building-related data
        run: python complete_data/OSM/scripts/merge_repository_building_masters.py
      - name: Commit master datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.csv
          git add complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.geojson
          git add complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.parts
          git add complete_data/OSM/data/buildings/Ermita/ermita-buildings-master-manifest.json
          if git diff --cached --quiet; then
            echo "Building masters are already up to date."
            exit 0
          fi
          git commit -m "Merge repository building datasets into master indexes"
          git push origin HEAD:main
