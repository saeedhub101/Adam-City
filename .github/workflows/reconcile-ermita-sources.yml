name: Import non-OSM Ermita source data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconcile-ermita-sources.yml"
      - "ermita/scripts/import_dpwh_national_roads.py"
      - "ermita/scripts/import_microsoft_road_detections.py"
      - "scripts/import_openaerialmap_ermita.py"

permissions:
  contents: write

concurrency:
  group: ermita-non-osm-source-imports
  cancel-in-progress: false

jobs:
  collect-non-osm-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial dependencies
        run: python -m pip install requests shapely pyproj rasterio numpy scipy
      - name: Import official DPWH road, surface, lane and bridge data
        continue-on-error: true
        run: python ermita/scripts/import_dpwh_national_roads.py
      - name: Fetch Microsoft road detections
        continue-on-error: true
        run: python ermita/scripts/import_microsoft_road_detections.py
      - name: Discover licensed OpenAerialMap imagery
        continue-on-error: true
        run: python scripts/import_openaerialmap_ermita.py
      - name: Commit only non-OSM source outputs
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/maps/external scripts
          if git diff --cached --quiet; then echo "No new non-OSM outputs."; exit 0; fi
          git commit -m "Import non-OSM Ermita road and aerial sources"
          git fetch origin main
          if ! git rebase origin/main; then git rebase --abort || true; echo "Conflict: stopped without overwriting source data."; exit 1; fi
          git push origin HEAD:main
