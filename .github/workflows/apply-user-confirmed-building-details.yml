name: Apply user-confirmed building details
# Re-run enrichment after adding user-confirmed records 353 and 356.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-user-confirmed-building-details.yml"
      - "scripts/apply_user_confirmed_building_details.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update searchable master and queue records
        run: python scripts/apply_user_confirmed_building_details.py
      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.parts/part-001-readable-parts/part-001.geojson complete_data/OSM/data/buildings/Ermita/building-visual-research-queue.csv complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.csv complete_data/OSM/data/buildings/Ermita/ermita-buildings-master-manifest.json
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Record user-confirmed building names and street addresses"
            git push origin main
          fi
