name: Adam Royal — Unreal Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adam-royal-unreal-main
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Unreal project
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify Unreal project and ensure Godot is gone
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'StandaloneBattleRoyale/SaeedRoyale.uproject'
          if (!(Test-Path $project)) { throw "Unreal project missing: $project" }
          $descriptor = Get-Content $project -Raw | ConvertFrom-Json
          if ($descriptor.Modules[0].Name -ne 'SaeedRoyale') { throw 'Unexpected Unreal module.' }
          if (!(Test-Path 'assets/saeed.glb')) { throw 'Character asset assets/saeed.glb is missing.' }
          if (!(Test-Path 'StandaloneBattleRoyale/Source/SaeedRoyale/Private/SaeedRoyaleCharacter.cpp')) { throw 'Unreal character source missing.' }
          $forbidden = Get-ChildItem -Path . -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '[\\/]SaeedRoyaleGodot[\\/]|\.gd$|\.tscn$|project\.godot$' }
          if ($forbidden) { $forbidden | ForEach-Object { Write-Error $_.FullName }; throw 'Godot content remains.' }
          Write-Host 'Unreal project and character asset verified.'

      - name: Run Unreal source contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python StandaloneBattleRoyale/Tests/validate_prototype.py
          if ($LASTEXITCODE -ne 0) { throw 'Unreal source tests failed.' }

      - name: Report whether Unreal Engine can be compiled on this runner
        shell: pwsh
        run: |
          $candidates = @('C:\Program Files\Epic Games\UE_5.5','C:\Program Files\Epic Games\UE_5.6','C:\Program Files\Epic Games\UE_5.7') | Where-Object { Test-Path (Join-Path $_ 'Engine/Binaries/Win64/UnrealEditor-Cmd.exe') }
          if ($candidates.Count -eq 0) {
            Write-Host 'Unreal Engine is not installed on this hosted runner; this run validates source only, not a compiled game.'
          } else {
            Write-Host "Unreal Engine found at $($candidates[0]); source validation completed."
          }
