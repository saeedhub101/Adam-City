name: Adam Royal — Validate Cached Manila District

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_map_assets:
        description: "Regenerate the Manila map and procedural textures from current source"
        required: false
        type: boolean
        default: false
      refresh_reference_photos:
        description: "Fetch additional reference photos (normally reuse committed photos)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: adam-royal-manila-map
  cancel-in-progress: true

jobs:
  generate-manila:
    name: Use cached Manila district (generate only if missing)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install map generation dependencies
        shell: pwsh
        run: python -m pip install --upgrade requests shapely trimesh mapbox-earcut scipy numpy pillow

      - name: Stage the repository's existing Saeed player model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'assets/saeed.glb'
          $targetDir = 'StandaloneBattleRoyale/Content/Characters'
          $target = Join-Path $targetDir 'Saeed.glb'
          if (!(Test-Path $source)) { throw 'The existing player model assets/saeed.glb is missing.' }
          if ((Get-Item $source).Length -lt 1000000) { throw 'The Saeed GLB is unexpectedly small.' }
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item $source $target -Force
          if ((Get-Item $target).Length -ne (Get-Item $source).Length) { throw 'Staged Saeed GLB differs from the repository source.' }
          Write-Host "Staged existing Saeed character model: $target"

      - name: Generate district once, then commit the reusable map assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $map = 'StandaloneBattleRoyale/Content/Maps/Manila-Central-District.glb'
          $report = 'StandaloneBattleRoyale/Content/Maps/Manila-Central-District.json'
          $refresh = '${{ inputs.refresh_map_assets }}' -eq 'true'
          if (!$refresh -and (Test-Path $map) -and (Test-Path $report) -and (Get-Item $map).Length -gt 100000) {
            Write-Host 'Using committed Manila district; no network map download needed.'
          } else {
            python StandaloneBattleRoyale/Tools/build_manila_district.py
            if ($LASTEXITCODE -ne 0) { throw 'Initial Manila district generation failed.' }
          }
          if (!(Test-Path $map) -or !(Test-Path $report)) { throw 'Manila map asset or report missing.' }
      - name: Reuse committed facade photos unless refresh is requested
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $photos = Get-ChildItem 'StandaloneBattleRoyale/Content/Maps/Real-Facade-Photos' -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.jpg','.jpeg','.png','.webp' }
          $refresh = '${{ inputs.refresh_reference_photos }}' -eq 'true'
          if (!$refresh -and $photos.Count -gt 0) {
            Write-Host "Using $($photos.Count) committed facade photos; skipping network download."
          } else {
            python StandaloneBattleRoyale/Tools/fetch_manila_facade_photos.py
            if ($LASTEXITCODE -ne 0) { throw 'Facade photo download failed.' }
          }

      - name: Reuse committed street imagery unless refresh is requested
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $photos = Get-ChildItem 'StandaloneBattleRoyale/Content/Maps/Street-Imagery' -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.jpg','.jpeg','.png','.webp' }
          $refresh = '${{ inputs.refresh_reference_photos }}' -eq 'true'
          if (!$refresh -and $photos.Count -gt 0) {
            Write-Host "Using $($photos.Count) committed street photos; skipping network download."
          } else {
            python StandaloneBattleRoyale/Tools/fetch_manila_street_imagery.py
            if ($LASTEXITCODE -ne 0) { throw 'Street imagery harvesting failed.' }
          }

      - name: Commit only changed generated map, textures, and photo assets
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StandaloneBattleRoyale/Content/Maps/Manila-Central-District.glb StandaloneBattleRoyale/Content/Maps/Manila-Central-District.json
          git add -f StandaloneBattleRoyale/Content/Maps/Manila-Facade-Texture-*.jpg
          git add -f StandaloneBattleRoyale/Content/Maps/Real-Facade-Photos/
          git add -f StandaloneBattleRoyale/Content/Maps/Street-Imagery/
          if (git diff --cached --quiet) {
            Write-Host 'No generated asset changes; repository cache remains unchanged.'
          } else {
            git commit -m 'Cache updated Manila map and texture assets'
            git push
          }
      - name: Verify generated map is present in Unreal Content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $map = 'StandaloneBattleRoyale/Content/Maps/Manila-Central-District.glb'
          $report = 'StandaloneBattleRoyale/Content/Maps/Manila-Central-District.json'
          if (!(Test-Path $map)) { throw 'Generated GLB missing.' }
          if ((Get-Item $map).Length -lt 100000) { throw 'Generated GLB is unexpectedly small.' }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          if ($data.buildings -lt 30 -or $data.roads -lt 15) { throw 'Map quality gate failed.' }
          Write-Host "Verified: $($data.buildings) buildings, $($data.roads) roads, $($data.glb_bytes) bytes."

      - name: Upload generated Unreal map source and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Adam-Royal-Manila-Central-District
          path: |
            StandaloneBattleRoyale/Content/Characters/Saeed.glb
            StandaloneBattleRoyale/Content/Maps/Manila-Central-District.glb
            StandaloneBattleRoyale/Content/Maps/Manila-Central-District.json
            StandaloneBattleRoyale/Content/Maps/Manila-Facade-Texture-*.jpg
            StandaloneBattleRoyale/Content/Maps/Real-Facade-Photos/**
            StandaloneBattleRoyale/Content/Maps/Street-Imagery/**
          if-no-files-found: error
          retention-days: 30

      - name: Validate Unreal source contracts
        shell: pwsh
        run: |
          python StandaloneBattleRoyale/Tests/validate_prototype.py
          if ($LASTEXITCODE -ne 0) { throw 'Unreal source tests failed.' }
