name: Index existing Amman GLB buildings against saved OSM source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "middle east/UnityGame/tools/build_glb_building_index.py"
      - "middle east/Jordan/layers/buildings.geojson.gz"
      - "middle east/BuildGLB/amman/manifest.json"

permissions:
  contents: write

concurrency:
  group: amman-glb-building-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Match GLB tile IDs to repository OSM records
        run: python3 "middle east/UnityGame/tools/build_glb_building_index.py"
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "middle east/BuildGLB/amman/building-asset-index.json"
          if git diff --cached --quiet; then
            echo "Building index is already current."
          else
            git commit -m "Index Amman GLB buildings by original OSM identity"
            git push origin HEAD:main
          fi
