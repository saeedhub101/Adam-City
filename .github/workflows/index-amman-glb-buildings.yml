name: Index existing Amman GLB buildings against saved OSM source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amman-glb-building-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            middle east/BuildGLB/amman
            middle east/Jordan/osm
            middle east/Jordan/layers
            middle east/UnityGame
          sparse-checkout-cone-mode: true

      - name: Install Blender and OSM ID-preserving exporter
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool blender

      - name: Re-export saved OSM buildings with original IDs
        run: python3 "middle east/UnityGame/tools/export_jordan_building_source_with_ids.py"

      - name: Rebuild existing city tiles with stable OSM building IDs
        run: |
          blender -b --python-exit-code 1 --python "middle east/UnityGame/tools/build_amman_glb.py" -- \
            --data "middle east/Jordan/layers" \
            --out "middle east/BuildGLB/amman" \
            --west 35.72 --east 36.08 --south 31.70 --north 32.12 \
            --tile 0.01 --city Amman --prefix amman --repo_commit false --force true

      - name: Match GLB tile IDs to repository OSM records
        run: python3 "middle east/UnityGame/tools/build_glb_building_index.py"

      - name: Commit index and diagnostics even when matching is blocked
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- "middle east/Jordan/layers/buildings.geojson.gz" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "middle east/BuildGLB/amman"
          if [ -f "middle east/UnityGame/BuildData/AMMAN-GLB-INDEX-DIAGNOSTICS.json" ]; then
            git add -- "middle east/UnityGame/BuildData/AMMAN-GLB-INDEX-DIAGNOSTICS.json"
          fi
          if [ -f "middle east/BuildGLB/amman/building-asset-index.json" ] &&
             python3 -c 'import json; p=json.load(open("middle east/UnityGame/BuildData/AMMAN-GLB-INDEX-DIAGNOSTICS.json")); raise SystemExit(0 if p.get("counts",{}).get("matched_to_osm_source",0)>0 else 1)'; then
            git add -- "middle east/BuildGLB/amman/building-asset-index.json"
          fi
          if git diff --cached --quiet; then
            echo "No new index or diagnostic output to commit."
            exit 0
          fi
          git commit -m "Save Amman GLB identity matching diagnostics and index"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep "$attempt"
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Could not push diagnostics/index after five retries." >&2
          exit 1
