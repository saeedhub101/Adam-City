name: Compare OSM and Microsoft building geometry for Ermita

on:
  workflow_dispatch:
  push:
    paths:
      - "ermita/scripts/compare_building_footprints.py"

permissions:
  contents: write

concurrency:
  group: ermita-footprint-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry dependencies
        run: python -m pip install "shapely>=2.0" pyproj
      - name: Compare source layers without modifying originals
        run: python ermita/scripts/compare_building_footprints.py
      - name: Upload detailed comparison as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ermita-building-footprint-comparison
          path: |
            ermita/maps/qa/building-footprint-comparison.csv
            ermita/maps/qa/building-footprint-comparison-report.json
          retention-days: 90
      - name: Commit comparison report and CSV
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/maps/qa/building-footprint-comparison.csv ermita/maps/qa/building-footprint-comparison-report.json
          if git diff --cached --quiet; then
            echo "No comparison changes."
            exit 0
          fi
          git commit -m "Compare OSM and Microsoft building footprints"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort || true; sleep $((attempt * 3)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish comparison after four safe retries."
          exit 1
