name: Backup repository into backup directory (DISABLED)

on:
  workflow_dispatch:
    inputs:
      confirm_disabled:
        description: 'Backup workflow disabled; this trigger is retained only as a manual no-op'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repository-backup
  cancel-in-progress: false

jobs:
  backup:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Backup disabled
        run: echo "Repository backup workflow is disabled by request."
