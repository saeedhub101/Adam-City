name: Sort Manila PBF buildings by boundary

on:
  push:
    branches: [main]
    paths:
      - "Manila/scripts/sort_buildings_by_boundary.py"
      - ".github/workflows/sort-pbf-buildings-by-boundary.yml"
  workflow_dispatch:

permissions:
  contents: write

# Share the existing Manila PBF lock so this job cannot race another tile-writing job.
concurrency:
  group: manila-pbf-enrichment
  cancel-in-progress: false

jobs:
  sort:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PBF and geometry tools
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile shapely
      - name: Extract and sort buildings from all 141 PBF tiles
        run: python -u Manila/scripts/sort_buildings_by_boundary.py
