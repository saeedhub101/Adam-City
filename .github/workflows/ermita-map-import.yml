name: Import Ermita map data and build 3D model

on:
  workflow_dispatch:
  push:
    paths:
      - "ermita/scripts/import_osm_and_build_3d.py"
      - "ermita/scripts/import_dpwh_national_roads.py"
      - "ermita/scripts/import_real_facade_photos.py"
      - "ermita/scripts/import_copernicus_terrain.py"
  schedule:
    - cron: "23 2 1 * *"

permissions:
  contents: write

concurrency:
  group: ermita-map-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial tools
        continue-on-error: true
        run: python -m pip install requests osm2geojson shapely pyproj trimesh mapbox-earcut rasterio numpy scipy
      - name: Validate Python syntax
        run: python -m py_compile ermita/scripts/import_osm_and_build_3d.py ermita/scripts/import_dpwh_national_roads.py ermita/scripts/import_real_facade_photos.py ermita/scripts/import_copernicus_terrain.py
      # Keep OSM syncing enabled: map data changes over time and completeness is not guaranteed.
      - name: Download and process OpenStreetMap data
        id: osm
        continue-on-error: true
        run: python ermita/scripts/import_osm_and_build_3d.py
      - name: Import official DPWH national roads for Ermita
        id: dpwh
        continue-on-error: true
        run: python ermita/scripts/import_dpwh_national_roads.py
      # Keep KartaView discovery enabled until photo binaries and coverage have been audited.
      - name: Import KartaView street imagery metadata (no image downloads)
        id: kartaview
        continue-on-error: true
        run: python ermita/scripts/import_real_facade_photos.py
      - name: Download elevation data and build terrain surface
        id: terrain
        continue-on-error: true
        run: python ermita/scripts/import_copernicus_terrain.py
      - name: Commit imported map data and 3D model
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kartaview ermita/maps/generated ermita/maps/external ermita/3d/generated ermita/3d/terrain
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Import Ermita map data and regenerate detailed 3D buildings"
            # Generated datasets overlap with other import workflows. Resolve conflicts
            # in favor of this run's generated outputs and retry races safely.
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase -X theirs origin/main || {
                git rebase --abort || true
                echo "Rebase failed on attempt ${attempt}; retrying from latest main."
                sleep $((attempt * 3))
                continue
              }
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push race on attempt ${attempt}; rebasing onto newest main."
              sleep $((attempt * 3))
            done
            echo "::error::Could not publish generated data after four safe retries."
            exit 1
          fi

      - name: Report independent import stage results
        if: always()
        env:
          OSM_OUTCOME: ${{ steps.osm.outcome }}
          DPWH_OUTCOME: ${{ steps.dpwh.outcome }}
          KARTAVIEW_OUTCOME: ${{ steps.kartaview.outcome }}
          TERRAIN_OUTCOME: ${{ steps.terrain.outcome }}
        run: |
          echo "OSM: ${OSM_OUTCOME}"
          echo "DPWH: ${DPWH_OUTCOME}"
          echo "KartaView metadata: ${KARTAVIEW_OUTCOME}"
          echo "Terrain: ${TERRAIN_OUTCOME}"
          if [ "${OSM_OUTCOME}" != "success" ] || [ "${DPWH_OUTCOME}" != "success" ] || [ "${KARTAVIEW_OUTCOME}" != "success" ] || [ "${TERRAIN_OUTCOME}" != "success" ]; then
            echo "::error::One or more import stages failed. Other stages were allowed to run independently; inspect each step above."
            exit 1
          fi
