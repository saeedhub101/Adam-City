name: Enrich Manila vector-tile building attributes

on:
  push:
    branches: [main]
    paths:
      - "Manila/scripts/enrich_vector_tiles.py"
      - ".github/workflows/enrich-manila-pbf.yml"
  workflow_dispatch:

permissions:
  contents: write

# Never cancel an active enrichment run. New runs wait until the current run exits.
concurrency:
  group: manila-pbf-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vector-tile tools
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile requests

      - name: Enrich and checkpoint each PBF tile immediately
        run: python -u Manila/scripts/enrich_vector_tiles.py
