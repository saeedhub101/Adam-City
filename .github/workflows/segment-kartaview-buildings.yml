name: Generate semantic building mask candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ermita/scripts/segment_kartaview_buildings.py"
      - ".github/workflows/segment-kartaview-buildings.yml"
permissions:
  contents: write
concurrency:
  group: kartaview-building-segmentation
  cancel-in-progress: false
jobs:
  segment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install segmentation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers pillow numpy
      - name: Segment stored KartaView images
        run: python ermita/scripts/segment_kartaview_buildings.py
      - name: Commit segmentation candidates to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kartaview/facade-crops/building-segmentation
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate semantic KartaView building mask candidates"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
