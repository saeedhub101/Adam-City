name: Build Adam Royal for Windows

on:
  push:
    paths:
      - "SaeedRoyaleGodot/**"
      - ".github/workflows/build-saeed-royale-windows.yml"
  pull_request:
    paths:
      - "SaeedRoyaleGodot/**"
      - ".github/workflows/build-saeed-royale-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate game project contracts
        run: python3 SaeedRoyaleGodot/Tests/validate_project.py

      - name: Download Godot 4.4.1 and Windows export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp "$RUNNER_TEMP/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.4.1-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install virtual display for gameplay screenshot
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Import and parse project with Godot
        working-directory: SaeedRoyaleGodot
        run: |
          set -euo pipefail
          set -o pipefail
          "$GODOT_BIN" --headless --editor --path . --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$RUNNER_TEMP/godot-import.log" | grep -vF 'ERROR: Parameter "t" is null.'; then
            echo "Godot asset import emitted an unexpected error."
            exit 1
          fi
          set -o pipefail
          "$GODOT_BIN" --headless --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$RUNNER_TEMP/godot-smoke.log"; then
            echo "Godot smoke test emitted errors."
            exit 1
          fi

      - name: Capture an in-game screenshot
        working-directory: SaeedRoyaleGodot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          timeout 90s env ADAM_ROYAL_CAPTURE="res://build/AdamRoyal-Manila-gameplay.png" xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT_BIN" --path . --resolution 1920x1080 --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --quit-after 240 2>&1 | tee "$RUNNER_TEMP/godot-screenshot.log"
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$RUNNER_TEMP/godot-screenshot.log"; then
            echo "Gameplay screenshot capture emitted a runtime error."
            exit 1
          fi
          grep -F "GAMEPLAY_SCREENSHOT_SAVED=" "$RUNNER_TEMP/godot-screenshot.log"
          python3 - <<'PY'
          import struct
          from pathlib import Path
          shot = Path("build/AdamRoyal-Manila-gameplay.png")
          data = shot.read_bytes()
          assert data[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]), "Output is not a PNG screenshot"
          width, height = struct.unpack(">II", data[16:24])
          assert width >= 1920 and height >= 1080, f"Expected Full HD screenshot, got {width}x{height}"
          assert len(data) > 50000, f"Screenshot appears blank or incomplete: {len(data)} bytes"
          print(f"Verified Manila gameplay screenshot: {width}x{height}, {len(data):,} bytes")
          PY

      - name: Upload Manila gameplay screenshot
        uses: actions/upload-artifact@v4
        with:
          name: AdamRoyal-Manila-Gameplay-Screenshot
          path: SaeedRoyaleGodot/build/AdamRoyal-Manila-gameplay.png
          if-no-files-found: error
          retention-days: 30

      - name: Export Windows game
        working-directory: SaeedRoyaleGodot
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release "Windows Desktop" build/AdamRoyal.exe
          test -s build/AdamRoyal.exe
          cp README.md build/README.txt

      - name: Upload downloadable Windows game
        uses: actions/upload-artifact@v7
        with:
          name: AdamRoyal-Windows-x64
          path: SaeedRoyaleGodot/build/
          if-no-files-found: error
          retention-days: 30

  windows-executable-smoke:
    needs: validate-and-export
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download exported Windows game
        uses: actions/download-artifact@v7
        with:
          name: AdamRoyal-Windows-x64
          path: smoke

      - name: Launch Windows executable headlessly
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "smoke/AdamRoyal.exe"
          if (-not (Test-Path $exe)) { throw "Windows executable was not found in the build artifact." }
          $log = Join-Path $env:RUNNER_TEMP "saeed-royale-windows-smoke.log"
          $process = Start-Process -FilePath $exe -ArgumentList @("--headless", "--quit-after", "120", "--log-file", $log) -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "Exported Windows game exited with code $($process.ExitCode)."
          }
          if (Test-Path $log) {
            $output = Get-Content -Raw $log
            if ($output -match "SCRIPT ERROR|Parse Error|ERROR:") {
              Write-Output $output
              throw "Exported Windows game logged a runtime error."
            }
          }
