name: Collect Mapillary street photos for Tabarbour
on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-mapillary-photos.yml"
      - "scripts/collect_mapillary_tabarbour.py"
permissions:
  contents: write
concurrency:
  group: mapillary-tabarbour-photos
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check token is configured
        env:
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
        run: |
          if [ -z "$MAPILLARY_ACCESS_TOKEN" ]; then
            echo "::error::Add MAPILLARY_ACCESS_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Download Mapillary thumbnails and attribution
        env:
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
        run: python3 scripts/collect_mapillary_tabarbour.py
      - name: Commit images and catalogue
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/public/images/mapillary game/public/data/mapillary-photo-catalog.json
          if git diff --cached --quiet; then
            echo "Mapillary image catalogue is unchanged."
            exit 0
          fi
          git commit -m "Add attributed Mapillary photos for Tabarbour"
          git pull --rebase origin main
          git push origin HEAD:main
