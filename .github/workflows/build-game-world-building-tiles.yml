name: Build game-world building tiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'middle east/scripts/export-game-world-building-tiles.py'
      - '.github/workflows/build-game-world-building-tiles.yml'
      - 'middle east/Jordan/layers/buildings.geojson.gz'
      - 'middle east/Jordan/layers/building_details.geojson.gz'
      - 'middle east/Palestine/layers/buildings.geojson.gz'
      - 'middle east/Palestine/layers/building_details.geojson.gz'

permissions:
  contents: write

concurrency:
  group: game-world-building-tiles
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out main and saved source data
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install streaming JSON parser
        run: python -m pip install ijson
      - name: Export building tiles
        run: python 'middle east/scripts/export-game-world-building-tiles.py'
      - name: Commit generated game data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'middle east/game-world'
          git add 'middle east/game-world-building-tiles-report.json'
          if git diff --cached --quiet; then
            echo 'Game-world tiles unchanged; no commit needed.'
          else
            git commit -m 'Build tiled game-world building data'
            git push origin HEAD:main
          fi
