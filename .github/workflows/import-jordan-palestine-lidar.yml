name: Import public LiDAR data for Jordan and Palestine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/import_jordan_palestine_lidar.py"
      - ".github/workflows/import-jordan-palestine-lidar.yml"

permissions:
  contents: write

# A revised importer replaces an incomplete older run. Within the active run,
# each checkpoint is pushed to main and can be resumed by a later run.
concurrency:
  group: jordan-palestine-lidar-import-v2
  cancel-in-progress: true

jobs:
  import-lidar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout main with full history for checkpoint pushes
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install importer dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Discover, download, and checkpoint public LiDAR assets
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/import_jordan_palestine_lidar.py
      - name: Commit any final report changes
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "middle east/LiDAR"
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint Jordan and Palestine LiDAR import report"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
