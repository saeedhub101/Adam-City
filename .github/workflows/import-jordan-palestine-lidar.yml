name: Import public LiDAR data for Jordan and Palestine

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/import_jordan_palestine_lidar.py"
      - ".github/workflows/import-jordan-palestine-lidar.yml"

permissions:
  contents: write

concurrency:
  group: jordan-palestine-lidar-import
  cancel-in-progress: false

jobs:
  import-lidar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Discover and import publicly downloadable LiDAR data
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/import_jordan_palestine_lidar.py
      - name: Commit imported data and inventory to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/LiDAR
          if git diff --cached --quiet; then
            echo "No new LiDAR files or inventory changes to commit."
          else
            git commit -m "Import public LiDAR data for Jordan and Palestine"
            git push origin HEAD:main
          fi
