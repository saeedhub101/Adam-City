name: Build photo-informed Roxas Boulevard buildings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ermita/scripts/generate_roxas_boulevard_buildings.py'
      - '.github/workflows/build-roxas-boulevard-buildings.yml'
      - 'ermita/maps/generated/ermita-building-footprints.geojson'
      - 'ermita/maps/generated/ermita-building-details.geojson'
      - 'ermita/maps/generated/ermita-road-network.geojson'

permissions:
  contents: write

concurrency:
  group: build-roxas-boulevard-buildings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install geometry and GLB dependencies
        run: python -m pip install --disable-pip-version-check numpy trimesh pyproj shapely mapbox-earcut
      - name: Build the Roxas Boulevard GLB
        run: python ermita/scripts/generate_roxas_boulevard_buildings.py
      - name: Validate generated GLB and photo-informed profiles
        shell: bash
        run: |
          set -euo pipefail
          test -s "complete_data/OSM/data/buildings/roxas-boulevard/roxas bulivard buildings.glb"
          test -s complete_data/OSM/data/buildings/roxas-boulevard/roxas-bulivard-buildings-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("complete_data/OSM/data/buildings/roxas-boulevard/roxas-bulivard-buildings-report.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("buildings_exported", 0) > 0, "No buildings exported"
          assert d.get("unique_osm_building_ids", 0) > 0, "No OSM building IDs exported"
          refs = d.get("visual_reference_checks", [])
          assert len(refs) >= 3, "Photo-informed landmark reference audit missing"
          print(json.dumps({
              "buildings_exported": d["buildings_exported"],
              "unique_osm_building_ids": d["unique_osm_building_ids"],
              "facade_detail_parts": d.get("facade_detail_parts", 0),
              "facade_window_boxes": d.get("facade_window_boxes", 0),
              "facade_accent_parts": d.get("facade_accent_parts", 0),
              "visual_reference_checks": refs,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Commit generated Roxas Boulevard model and reports to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "complete_data/OSM/data/buildings/roxas-boulevard/roxas bulivard buildings.glb" \
                  complete_data/OSM/data/buildings/roxas-boulevard/roxas-bulivard-buildings-origin.json \
                  complete_data/OSM/data/buildings/roxas-boulevard/roxas-bulivard-buildings-report.json
          if git diff --cached --quiet; then
            echo "Generated Roxas Boulevard model is already current."
            exit 0
          fi
          git commit -m "Rebuild Roxas Boulevard model with photo-informed landmark facades"
          git push origin HEAD:main
