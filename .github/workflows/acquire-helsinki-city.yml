name: Acquire real Helsinki city scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-helsinki-city.yml"
      - "SaeedRoyaleGodot/Tools/prepare_helsinki_city_asset.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acquire-helsinki-city-main
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Download the actual Helsinki Gaussian-splat city capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helsinki"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 \
            --max-time 2400 \
            "https://3d.hel.ninja/HelsinkiOpen/testi_gs_ply/2024_750_gcps_ultra_splatting_ply.ply" \
            --output "$RUNNER_TEMP/helsinki/source.ply"
          test "$(stat -c %s "$RUNNER_TEMP/helsinki/source.ply")" -gt 600000000
          head -c 256 "$RUNNER_TEMP/helsinki/source.ply" | grep -a -q "ply"

      - name: Produce a real, size-bounded scan asset without inventing geometry
        run: |
          set -euo pipefail
          python3 SaeedRoyaleGodot/Tools/prepare_helsinki_city_asset.py \
            "$RUNNER_TEMP/helsinki/source.ply" \
            SaeedRoyaleGodot/assets/real_city/helsinki_city_scan.ply \
            --max-splats 350000
          sha256sum "$RUNNER_TEMP/helsinki/source.ply" \
            SaeedRoyaleGodot/assets/real_city/helsinki_city_scan.ply \
            | tee "$RUNNER_TEMP/helsinki/checksums.txt"

      - name: Record source and attribution
        shell: bash
        run: |
          set -euo pipefail
          cat > SaeedRoyaleGodot/assets/real_city/ASSET_SOURCE.md <<'EOF'
          # Real city scan asset

          - **Place:** Helsinki, Finland — photogrammetry/Gaussian-splat capture.
          - **Source file:** `2024_750_gcps_ultra_splatting_ply.ply`.
          - **Publisher/source host:** City of Helsinki open 3D-data host.
          - **Original URL:** https://3d.hel.ninja/HelsinkiOpen/testi_gs_ply/2024_750_gcps_ultra_splatting_ply.ply
          - **Related official 3D-data page:** https://www.hel.fi/en/decision-making/information-on-helsinki/maps-and-geospatial-data/helsinki-3d
          - **Attribution:** City of Helsinki.
          - **License reference:** Helsinki 3D open-data page identifies its 3D mesh data as CC BY 4.0. The experimental Gaussian-splat file is hosted separately; its specific metadata/license should be rechecked before redistribution beyond this personal project.
          - **Processing:** deterministic spatially distributed record sampling to at most 350,000 complete Gaussian records so the source asset fits GitHub's normal 100 MB file limit. No synthetic buildings or road geometry are added by this processing step.
          - **Runtime format:** binary little-endian Gaussian-splat PLY, intended for the GDGS Godot renderer.
          - **Original source checksum:** stored in the acquisition workflow run log.
          - **Processed asset checksum:** stored in the acquisition workflow run log.
          EOF
          cat "$RUNNER_TEMP/helsinki/checksums.txt"

      - name: Commit the actual city scan directly to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SaeedRoyaleGodot/assets/real_city/helsinki_city_scan.ply \
            SaeedRoyaleGodot/assets/real_city/ASSET_SOURCE.md
          git commit -m "Add real Helsinki photogrammetry city scan asset"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin HEAD:main
