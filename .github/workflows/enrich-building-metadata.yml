name: Enrich building metadata and visual evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-building-metadata.yml'
      - 'complete_data/OSM/scripts/generate_building_enrichment_index.py'
      - 'complete_data/OSM/scripts/merge_building_source_evidence.py'
      - 'complete_data/OSM/scripts/build_building_visual_research_queue.py'
      - 'complete_data/OSM/scripts/research_building_image_candidates.py'
      - 'complete_data/OSM/data/buildings/parts/parts-inventory-index.json'
      - 'complete_data/OSM/data/buildings/parts/part1/part1-inventory.json'
      - 'complete_data/OSM/data/buildings/parts/part2/part2-inventory.json'
      - 'complete_data/OSM/data/buildings/parts/part3/part3-inventory.json'
      - 'complete_data/OSM/data/buildings/parts/part4/part4-inventory.json'
      - 'complete_data/OSM/data/buildings/ermita-building-details.geojson'
      - 'complete_data/OSM/data/buildings/ermita-building-footprints.geojson'
      - 'complete_data/OSM/data/buildings/ermita-building-roof-details.geojson'
      - 'complete_data/OSM/data/buildings/osm-building-details.csv'
      - 'complete_data/open free tile/building-fallback.geojson'
      - 'complete_data/open free tile/layers/housenumber.geojsonl'
      - 'complete_data/OSM/data/buildings/parts/building-image-links.json'
      - 'complete_data/OSM/data/buildings/parts/building-image-candidates.json'
      - 'complete_data/OSM/data/buildings/windows/facade-signage-index.csv'
      - 'complete_data/OSM/data/buildings/windows/facade-details-report.json'
      - 'complete_data/OSM/Markets/commercial-facades-report.json'
      - 'complete_data/OSM/Markets/reference_photos/robinsons-manila/reference-index.json'
      - 'complete_data/OSM/Buildings/supreme-court-main-facade-report.json'

permissions:
  contents: write

concurrency:
  group: building-metadata-enrichment-v2
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out building data, OpenFreeMap and visual evidence
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            /complete_data/OSM/data/buildings/parts/parts-inventory-index.json
            /complete_data/OSM/data/buildings/parts/part1/part1-inventory.json
            /complete_data/OSM/data/buildings/parts/part2/part2-inventory.json
            /complete_data/OSM/data/buildings/parts/part3/part3-inventory.json
            /complete_data/OSM/data/buildings/parts/part4/part4-inventory.json
            /complete_data/OSM/data/buildings/parts/building-enrichment-index.json
            /complete_data/OSM/data/buildings/parts/building-enrichment-report.json
            /complete_data/OSM/data/buildings/parts/building-source-merge-report.json
            /complete_data/OSM/data/buildings/parts/building-source-link-audit.csv
            /complete_data/OSM/data/buildings/parts/building-visual-research-queue.csv
            /complete_data/OSM/data/buildings/parts/building-visual-research-queue.geojson
            /complete_data/OSM/data/buildings/parts/BUILDING-VISUAL-RESEARCH.md
            /complete_data/OSM/data/buildings/parts/building-image-candidates.json
            /complete_data/OSM/data/buildings/parts/building-image-candidates.csv
            /complete_data/OSM/data/buildings/parts/BUILDING-IMAGE-CANDIDATES.md
            /complete_data/OSM/data/buildings/parts/building-image-links.json
            /complete_data/OSM/data/buildings/parts/building-image-candidates.json
            /complete_data/OSM/data/buildings/ermita-building-details.geojson
            /complete_data/OSM/data/buildings/ermita-building-footprints.geojson
            /complete_data/OSM/data/buildings/ermita-building-roof-details.geojson
            /complete_data/OSM/data/buildings/osm-building-details.csv
            /complete_data/OSM/data/buildings/windows/facade-signage-index.csv
            /complete_data/OSM/data/buildings/windows/facade-details-report.json
            /complete_data/OSM/Markets/commercial-facades-report.json
            /complete_data/OSM/Markets/reference_photos/robinsons-manila/reference-index.json
            /complete_data/OSM/Buildings/supreme-court-main-facade-report.json
            /complete_data/open free tile/building-fallback.geojson
            /complete_data/open free tile/layers/housenumber.geojsonl
            /complete_data/OSM/scripts/generate_building_enrichment_index.py
            /complete_data/OSM/scripts/merge_building_source_evidence.py
            /complete_data/OSM/scripts/build_building_visual_research_queue.py
            /complete_data/OSM/scripts/research_building_image_candidates.py
          sparse-checkout-cone-mode: false

      - name: Install spatial dependencies
        run: python3 -m pip install --disable-pip-version-check shapely pyproj

      - name: Generate the base OSM identity and geometry evidence index
        run: python3 complete_data/OSM/scripts/generate_building_enrichment_index.py

      - name: Build visual review queue for unresolved buildings
        run: python3 complete_data/OSM/scripts/build_building_visual_research_queue.py

      - name: Discover Wikimedia Commons photo candidates
        run: python3 complete_data/OSM/scripts/research_building_image_candidates.py

      - name: Merge OpenFreeMap properties, house numbers, photos and facade assets
        run: python3 complete_data/OSM/scripts/merge_building_source_evidence.py

      - name: Validate merged database and preserve results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("complete_data/OSM/data/buildings/parts")
          index = json.loads((root / "building-enrichment-index.json").read_text(encoding="utf-8"))
          report = json.loads((root / "building-source-merge-report.json").read_text(encoding="utf-8"))
          audit = root / "building-source-link-audit.csv"
          assert index.get("buildings"), "Enrichment index contains no buildings"
          assert len(index["buildings"]) == report["building_records"], "Index/report building counts differ"
          assert audit.is_file() and audit.stat().st_size > 0, "Source-link audit was not generated"
          assert index.get("additional_sources"), "Additional source manifest missing"
          print(json.dumps({
              "building_records": len(index["buildings"]),
              "fallback_features": report["fallback_feature_count"],
              "counts": report["counts"],
              "audit_bytes": audit.stat().st_size
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit unified building metadata and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/OSM/data/buildings/parts/building-enrichment-index.json
          git add complete_data/OSM/data/buildings/parts/building-enrichment-report.json
          git add complete_data/OSM/data/buildings/parts/building-source-merge-report.json
          git add complete_data/OSM/data/buildings/parts/building-source-link-audit.csv
          git add complete_data/OSM/data/buildings/parts/building-visual-research-queue.csv
          git add complete_data/OSM/data/buildings/parts/building-visual-research-queue.geojson
          git add complete_data/OSM/data/buildings/parts/BUILDING-VISUAL-RESEARCH.md
          git add complete_data/OSM/data/buildings/parts/building-image-candidates.json
          git add complete_data/OSM/data/buildings/parts/building-image-candidates.csv
          git add complete_data/OSM/data/buildings/parts/BUILDING-IMAGE-CANDIDATES.md
          if git diff --cached --quiet; then
            echo "Unified building metadata is already up to date."
          else
            git commit -m "Merge OpenFreeMap and visual evidence into building index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
