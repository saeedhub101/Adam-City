name: Research building image candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-building-image-candidates.yml'
      - 'complete_data/OSM/scripts/research_building_image_candidates.py'
      - 'complete_data/OSM/data/buildings/parts/building-visual-research-queue.csv'

permissions:
  contents: write

concurrency:
  group: building-image-candidate-research
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Discover nearby geotagged Commons images
        run: python3 complete_data/OSM/scripts/research_building_image_candidates.py

      - name: Commit candidate evidence files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/OSM/data/buildings/parts/building-image-candidates.json
          git add complete_data/OSM/data/buildings/parts/building-image-candidates.csv
          git add complete_data/OSM/data/buildings/parts/BUILDING-IMAGE-CANDIDATES.md
          if git diff --cached --quiet; then
            echo "Image candidate evidence is already up to date."
          else
            git commit -m "Discover geotagged image candidates for unresolved buildings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
