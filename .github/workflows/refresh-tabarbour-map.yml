name: Refresh Tabarbour map snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-tabarbour-map.yml"

permissions:
  contents: write

concurrency:
  group: refresh-tabarbour-map
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch fresh Jordan extract from Geofabrik and clip to Tabarbour
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/public/data
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --break-system-packages osmium
          curl --fail --location --retry 3 --retry-delay 2 --max-time 240 \
            "https://download.geofabrik.de/asia/jordan-latest.osm.pbf" \
            --output /tmp/jordan-latest.osm.pbf
          python3 - <<'PY'
          import datetime, json, osmium
          from pathlib import Path

          SOUTH, WEST, NORTH, EAST = 31.9940, 35.9360, 32.0120, 35.9600
          elements = []

          class TabarbourHandler(osmium.SimpleHandler):
              def way(self, way):
                  tags = dict(way.tags)
                  if "building" not in tags and "highway" not in tags:
                      return
                  geometry = []
                  for node in way.nodes:
                      if not node.location.valid():
                          continue
                      geometry.append({"lat": node.location.lat, "lon": node.location.lon})
                  if len(geometry) < 2:
                      return
                  # Keep ways with at least one mapped point in the target bounds.
                  if not any(SOUTH <= p["lat"] <= NORTH and WEST <= p["lon"] <= EAST for p in geometry):
                      return
                  elements.append({
                      "type": "way",
                      "id": way.id,
                      "tags": tags,
                      "geometry": geometry
                  })

          handler = TabarbourHandler()
          handler.apply_file("/tmp/jordan-latest.osm.pbf", locations=True)
          elements.sort(key=lambda item: (item["type"], item["id"]))
          buildings = sum(1 for e in elements if "building" in e["tags"])
          roads = sum(1 for e in elements if "highway" in e["tags"])
          if buildings == 0 or roads == 0:
              raise SystemExit(f"Invalid Geofabrik clip: buildings={buildings}, roads={roads}")
          output = {
              "generator": "Geofabrik Jordan extract clipped for Tabarbour",
              "source": "https://download.geofabrik.de/asia/jordan-latest.osm.pbf",
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "bbox": {"south": SOUTH, "west": WEST, "north": NORTH, "east": EAST},
              "elements": elements
          }
          target = Path("game/public/data/tabarbour-osm.json")
          target.write_text(json.dumps(output, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          print(f"Geofabrik snapshot: {len(elements)} ways, {buildings} buildings, {roads} roads")
          print(f"Saved {target} ({target.stat().st_size} bytes)")
          PY
          test "$(jq '[.elements[] | select(.tags.building)] | length' game/public/data/tabarbour-osm.json)" -gt 0
          test "$(jq '[.elements[] | select(.tags.highway)] | length' game/public/data/tabarbour-osm.json)" -gt 0

      - name: Commit refreshed snapshot if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- game/public/data/tabarbour-osm.json && git ls-files --error-unmatch game/public/data/tabarbour-osm.json >/dev/null 2>&1; then
            echo "The checked-in map snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/public/data/tabarbour-osm.json
          git commit -m "Refresh Tabarbour OpenStreetMap snapshot"
          git push origin HEAD:main
