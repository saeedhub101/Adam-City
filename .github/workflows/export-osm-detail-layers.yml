name: Export separate OSM detail layers

on:
  push:
    branches: [main]
    paths:
      - 'ermita/scripts/export_osm_detail_layers.py'
      - '.github/workflows/export-osm-detail-layers.yml'
      - 'ermita/maps/generated/ermita-features.geojson'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-osm-detail-layers
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Export independent OSM detail datasets
        run: python3 ermita/scripts/export_osm_detail_layers.py
      - name: Validate separate outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s complete_data/OSM/data/pedestrian/ermita-pedestrian-street-details.geojson
          test -s complete_data/OSM/data/pedestrian/ermita-pedestrian-street-details.csv
          test -s complete_data/OSM/data/roads/ermita-road-engineering-details.geojson
          test -s complete_data/OSM/data/roads/ermita-road-engineering-details.csv
          test -s complete_data/OSM/data/buildings/ermita-building-roof-details.geojson
          test -s complete_data/OSM/data/buildings/ermita-building-roof-details.csv
          test -s complete_data/OSM/quality/osm-detail-layer-export-report.json
      - name: Commit organized detail datasets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/OSM/data/pedestrian/ complete_data/OSM/data/roads/ complete_data/OSM/data/buildings/ complete_data/OSM/quality/osm-detail-layer-export-report.json
          if git diff --cached --quiet; then
            echo "No changes in the separate OSM detail datasets."
            exit 0
          fi
          git commit -m "Add separate OSM pedestrian road and building roof datasets"
          git push origin HEAD:main
