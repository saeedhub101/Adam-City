name: Improve original building GLBs
on:
  workflow_dispatch:
  push:
    paths:
      - "complete_data/OSM/scripts/generate_roof_storefront_overlays.py"
      - "ermita/maps/generated/ermita-building-footprints.geojson"
permissions:
  contents: write
concurrency:
  group: adam-city-roof-storefront-enhancement
  cancel-in-progress: false
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry dependencies
        run: python -m pip install --upgrade numpy trimesh pyproj shapely pillow
      - name: Generate and checkpoint enhanced detail GLBs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for part in 1 2 3 4; do
            echo "=== Generating enhanced roof, facade, glass/PBR, and storefront detail GLB for part ${part} ==="
            python complete_data/OSM/scripts/generate_roof_storefront_overlays.py --part "${part}"
            output="complete_data/OSM/data/buildings/Ermita/enhanced/part${part}-roof-storefront-details.glb"
            report="complete_data/OSM/data/buildings/Ermita/enhanced/part${part}-roof-storefront-details-report.json"
            test -s "${output}"
            test -s "${report}"
            size=$(stat -c%s "${output}")
            if [ "${size}" -ge 99614720 ]; then echo "Unsafe GLB size: ${output} (${size})"; exit 1; fi
            git add "${output}" "${report}"
            if ! git diff --cached --quiet; then
              git commit -m "Add enhanced GLB detail overlay for part ${part}"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
            echo "part${part}: generated, validated, and checkpointed (${size} bytes)"
          done
