name: Improve original building GLBs
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-roof-storefront-glb.yml"
      - "complete_data/OSM/scripts/apply_details_to_original_glbs.py"
      - "complete_data/OSM/scripts/generate_roof_storefront_overlays.py"
      - "ermita/scripts/generate_roxas_boulevard_buildings.py"
      - "ermita/maps/generated/ermita-building-footprints.geojson"
      - "complete_data/OSM/data/buildings/Ermita/part*/part*-origin.json"
permissions:
  contents: write
concurrency:
  group: adam-city-original-glb-improvements
  cancel-in-progress: false
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry dependencies
        run: python -m pip install --upgrade numpy trimesh pyproj shapely pillow
      - name: Improve and checkpoint each original GLB
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failed=0
          for part in 1 2 3 4; do
            echo "=== Integrating details into original Parts${part}.glb ==="
            if python complete_data/OSM/scripts/apply_details_to_original_glbs.py --part "$part"; then
              original="complete_data/OSM/data/buildings/Ermita/Parts${part}.glb"
              extra="complete_data/OSM/data/buildings/Ermita/Parts${part}-extra.glb"
              report="complete_data/OSM/data/buildings/Ermita/enhanced/part${part}-integrated-report.json"
              for f in "$original" "$extra"; do
                if [ -f "$f" ]; then
                  size=$(stat -c%s "$f")
                  if [ "$size" -ge 99614720 ]; then echo "Unsafe file size: $f ($size)"; failed=1; fi
                fi
              done
              git add "$original" "$report"
              if [ -f "$extra" ]; then git add "$extra"; else git rm --ignore-unmatch "$extra"; fi
              if git diff --cached --quiet; then
                echo "part${part}: no new changes to commit"
              else
                git commit -m "Improve original building GLB part ${part}"
                git push origin HEAD:main
              fi
              echo "part${part}: saved checkpoint"
            else
              echo "part${part}: failed; continue with next part"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
