name: Inspect Helsinki mesh assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-helsinki-assets.yml"
      - "scripts/download_helsinki_mesh.py"
      - "game/src/helsinki.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached Helsinki mesh assets
        uses: actions/cache@v4
        with:
          path: game/public/models/helsinki
          key: helsinki-2017-678492x2-lod16-v1

      - name: Ensure Helsinki mesh assets exist
        run: python scripts/download_helsinki_mesh.py

      - name: Install image inspection dependency
        run: python -m pip install pillow

      - name: Create texture contact sheet and print geometry bounds
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path("game/public/models/helsinki")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          objs = [o for t in manifest["tiles"] for o in t["objects"]]
          print("TILES", [(t["name"], t["objCount"], t["textureCount"]) for t in manifest["tiles"]])
          for entry in objs[:8]:
              p = Path("game/public") / entry["obj"]
              mins = [float("inf")] * 3
              maxs = [float("-inf")] * 3
              count = 0
              with p.open(errors="ignore") as f:
                  for line in f:
                      if line.startswith("v "):
                          parts = line.split()
                          if len(parts) >= 4:
                              xyz = [float(parts[1]), float(parts[2]), float(parts[3])]
                              mins = [min(a,b) for a,b in zip(mins,xyz)]
                              maxs = [max(a,b) for a,b in zip(maxs,xyz)]
                              count += 1
              mtl = p.parent / (entry.get("mtl") or "")
              maps = [line.split(None,1)[1].strip() for line in mtl.read_text(errors="ignore").splitlines() if line.strip().lower().startswith("map_kd ")] if mtl.exists() else []
              print("OBJ", p.name, "vertices", count, "min", mins, "max", maxs, "mtl_exists", mtl.exists(), "maps", maps[:2], "map_files_exist", [ (mtl.parent / x).exists() for x in maps[:2] ])
          images = []
          for p in sorted(root.rglob("*")):
              if p.suffix.lower() not in {".jpg",".jpeg",".png"}: continue
              try:
                  im = Image.open(p).convert("RGB")
                  im.thumbnail((220,150))
                  card = Image.new("RGB",(240,190),"white")
                  card.paste(im,((240-im.width)//2,5))
                  ImageDraw.Draw(card).text((5,160),p.name[:32],fill="black")
                  images.append(card)
                  if len(images) >= 24: break
              except Exception as e:
                  print("IMAGE_ERROR",p,e)
          if images:
              sheet = Image.new("RGB",(240*4,190*((len(images)+3)//4)),"white")
              for i,im in enumerate(images): sheet.paste(im,((i%4)*240,(i//4)*190))
              sheet.save(root/"texture-preview.jpg",quality=88)
              print("Wrote texture preview with",len(images),"images")
          PY

      - name: Upload mesh assets and texture preview
        uses: actions/upload-artifact@v4
        with:
          name: Helsinki-LOD16-Inspection
          path: |
            game/public/models/helsinki/manifest.json
            game/public/models/helsinki/texture-preview.jpg
            game/public/models/helsinki/**/*.obj
            game/public/models/helsinki/**/*.mtl
            game/public/models/helsinki/**/*.jpg
            game/public/models/helsinki/**/*.png
          if-no-files-found: error
          retention-days: 7
