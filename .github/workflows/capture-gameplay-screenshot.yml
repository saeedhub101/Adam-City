name: Capture Adam Royal Amman gameplay screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-gameplay-screenshot.yml"
      - "SaeedRoyaleGodot/scripts/main.gd"
      - "SaeedRoyaleGodot/assets/real_city/**"
      - "SaeedRoyaleGodot/assets/amman/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-adam-royal-gameplay-main
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Install headless display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 4 --connect-timeout 30 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.4.1-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import and validate the playable Amman city asset
        working-directory: SaeedRoyaleGodot
        shell: bash
        run: |
          set -euo pipefail
          if find addons/gdgs -name '*.glsl' -print -quit | grep -q .; then
            echo "Raster-only project must not contain unused custom GLSL compute shaders."
            exit 1
          fi
          "$GODOT_BIN" --headless --editor --path . --import 2>&1 | tee "$RUNNER_TEMP/city-import.log"
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$RUNNER_TEMP/city-import.log"; then
            echo "City asset import produced errors."
            exit 1
          fi
          test -s assets/amman/Amman-Central-District.glb
          test -s assets/real_city/helsinki_city_scan.ply
          mkdir -p screenshots
          rm -f screenshots/adam-royal-*.png

      - name: Render a real gameplay screenshot
        working-directory: SaeedRoyaleGodot
        shell: bash
        run: |
          set -euo pipefail
          cat > .capture_gameplay.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
          	call_deferred("_capture")

          func _capture() -> void:
          	var packed = load("res://main.tscn")
          	if packed == null:
          		push_error("Could not load main scene")
          		quit(1)
          		return
          	var game = packed.instantiate()
          	root.add_child(game)
          	for i in range(12):
          		await process_frame
          	var player = game.get("player")
          	var pivot = game.get("camera_pivot")
          	if player == null or pivot == null:
          		push_error("Missing player or camera pivot")
          		quit(1)
          		return
          	var views = [{"name":"north","p":Vector3(0,0.1,0),"y":0.0},{"name":"east","p":Vector3(28,0.1,0),"y":-1.5708},{"name":"south","p":Vector3(0,0.1,28),"y":3.14159},{"name":"west","p":Vector3(-28,0.1,0),"y":1.5708}]
          	for v in views:
          		player.global_position = v.p
          		player.rotation.y = v.y
          		pivot.rotation = Vector3.ZERO
          		await create_timer(1.0).timeout
          		for i in range(3):
          			await process_frame
          		var img = root.get_viewport().get_texture().get_image()
          		if img == null or img.is_empty():
          			push_error("Empty screenshot: " + v.name)
          			quit(1)
          			return
          		var path = ProjectSettings.globalize_path("res://screenshots/adam-royal-" + v.name + ".png")
          		if img.save_png(path) != OK:
          			push_error("Screenshot save failed: " + path)
          			quit(1)
          			return
          		print("GAMEPLAY_SCREENSHOT=" + path)
          	quit(0)
          GDSCRIPT
          timeout 180 xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GODOT_BIN" --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://.capture_gameplay.gd \
            2>&1 | tee "$RUNNER_TEMP/city-screenshot.log"
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$RUNNER_TEMP/city-screenshot.log"; then
            echo "Gameplay screenshot run produced errors."
            exit 1
          fi
          rm -f .capture_gameplay.gd
          for view in north east south west; do test -s "screenshots/adam-royal-$view.png"; done
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for view in ("north", "east", "south", "west"):
              p = Path(f"screenshots/adam-royal-{view}.png")
              data = p.read_bytes()
              if data[:8] != bytes((137,80,78,71,13,10,26,10)): raise SystemExit(f"Bad PNG: {p}")
              width, height = struct.unpack(">II", data[16:24])
              if width < 640 or height < 360: raise SystemExit(f"Bad resolution: {p} {width}x{height}")
              print(f"Validated {p}: {width}x{height}")
          PY

      - name: Commit screenshot directly to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SaeedRoyaleGodot/screenshots/adam-royal-*.png
          git commit -m "Capture four Adam Royal gameplay viewpoints"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v7
        with:
          name: Adam-Royal-Multi-Location-Gameplay-Screenshots
          path: SaeedRoyaleGodot/screenshots/adam-royal-*.png
          if-no-files-found: error
          retention-days: 30
