name: Build Regional Middle East GLB Tiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "middle east/UnityGame/tools/build_amman_glb.py"
      - "middle east/UnityGame/tools/split_osm_regions.py"
      - "middle east/Jordan/layers/**"
      - "middle east/Palestine/layers/**"
      - ".github/workflows/build-amman-glb.yml"

permissions:
  contents: write

concurrency:
  group: historic-palestine-regional-glb-v3
  cancel-in-progress: true

jobs:
  export-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 0

      - name: Install Blender and streaming JSON dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-ijson
          blender --version
          python3 -c "import ijson; print('ijson ready')"

      - name: Generate and checkpoint regional GLB tiles on main
        shell: bash
        run: |
          set +e
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          run_region() {
            city="$1"; data="$2"; west="$3"; east="$4"; south="$5"; north="$6"; prefix="$7"
            echo "===== REGION START: $city ====="
            if [ ! -f "$data/buildings.geojson.gz" ]; then
              echo "REGION SKIPPED: missing $data/buildings.geojson.gz"
              return 0
            fi
            blender --background --python "middle east/UnityGame/tools/build_amman_glb.py" -- \
              --data "$data" --out "middle east/BuildGLB/$prefix" \
              --west "$west" --east "$east" --south "$south" --north "$north" \
              --tile 0.01 --city "$city" --prefix "$prefix" --repo_commit False
            rc=$?
            if [ "$rc" -ne 0 ]; then echo "REGION FAILED BUT CONTINUING: $city (exit $rc)"; fi
            # Checkpoint each completed region/cell to main, rather than pushing once per tile.
            git add -- "middle east/BuildGLB/$prefix"
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint GLB tiles: $city" || true
              git fetch origin main
              git rebase origin/main || { echo "REBASE FAILED: $city"; git rebase --abort; return 0; }
              git push origin HEAD:main || echo "PUSH FAILED: $city"
            fi
            return 0
          }

          # Palestine/Israel coverage runs first so it is saved before the separate Jordan workload.
          # Split the repository's stored Geofabrik Israel-and-Palestine extract into small
          # temporary spatial chunks before Blender; this includes Tel Aviv and coastal,
          # northern, central, southern, West Bank and Gaza coverage where mapped in OSM.
          # All chunks use the same global local-coordinate origin so GLB tiles align.
          rm -rf /tmp/historic-palestine-cells
          python3 "middle east/UnityGame/tools/split_osm_regions.py" \
            --layers "middle east/Palestine/layers" --out /tmp/historic-palestine-cells
          split_rc=$?
          if [ "$split_rc" -ne 0 ]; then
            echo "FATAL: Palestine/Israel split failed; not treating an empty import as success."
            exit "$split_rc"
          fi
          if [ -d /tmp/historic-palestine-cells ]; then
            find /tmp/historic-palestine-cells -mindepth 2 -maxdepth 2 -name buildings.geojson.gz -print0 |
            while IFS= read -r -d '' building_file; do
              data="$(dirname "$building_file")"
              cell="$(basename "$data")"
              run_region "Historic Palestine cell $cell" "$data" 34.15 35.95 29.40 33.35 "historic-palestine-$cell"
            done
          fi

          # Commit Jordan only after the historic Palestine cells have been attempted.
          # Jordan regions use the existing locally stored Jordan extract.
          run_region "Amman" "middle east/Jordan/layers" 35.72 36.08 31.70 32.12 "amman"
          run_region "Aqaba" "middle east/Jordan/layers" 34.90 35.15 29.45 29.65 "aqaba"
          run_region "Irbid" "middle east/Jordan/layers" 35.75 35.95 32.45 32.65 "irbid"
          run_region "Zarqa" "middle east/Jordan/layers" 36.05 36.20 32.00 32.15 "zarqa"
          run_region "Madaba" "middle east/Jordan/layers" 35.70 35.85 31.65 31.80 "madaba"
          run_region "Salt" "middle east/Jordan/layers" 35.65 35.80 32.00 32.10 "salt"
          run_region "Jerash" "middle east/Jordan/layers" 35.85 36.00 32.25 32.35 "jerash"
          run_region "Karak" "middle east/Jordan/layers" 35.65 35.80 31.15 31.25 "karak"
          echo "Generation pass ended. Inspect per-cell prefixes and repository outputs; OSM footprints are not photogrammetry."
          git status --short
