name: Build Regional Middle East GLB Tiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "middle east/UnityGame/tools/build_amman_glb.py"
      - "middle east/Jordan/layers/**"
      - "middle east/Palestine/layers/**"
      - ".github/workflows/build-amman-glb.yml"

permissions:
  contents: write

concurrency:
  group: regional-glb-generation
  cancel-in-progress: false

jobs:
  export-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout with permission to save generated files to main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 0

      - name: Install Blender and dependencies
        continue-on-error: true
        run: |
          sudo apt-get update || true
          sudo apt-get install -y blender python3-numpy || true
          blender --version || true

      - name: Generate regions and checkpoint each GLB directly into the repository
        shell: bash
        run: |
          set +e
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          run_region() {
            city="$1"; data="$2"; west="$3"; east="$4"; south="$5"; north="$6"; prefix="$7"
            echo "===== REGION START: $city ====="
            if [ ! -f "$data/buildings.geojson.gz" ]; then
              echo "REGION SKIPPED: missing buildings layer: $data/buildings.geojson.gz"
              return 0
            fi
            blender --background --python "middle east/UnityGame/tools/build_amman_glb.py" -- \
              --data "$data" --out "middle east/BuildGLB/$prefix" \
              --west "$west" --east "$east" --south "$south" --north "$north" \
              --tile 0.01 --city "$city" --prefix "$prefix" --repo_commit True
            rc=$?
            if [ "$rc" -ne 0 ]; then echo "REGION FAILED BUT CONTINUING: $city (exit $rc)"; fi
            # A failed region must not prevent later regions from running.
            return 0
          }

          # Jordan regions
          run_region "Amman" "middle east/Jordan/layers" 35.72 36.08 31.70 32.12 "amman"
          run_region "Aqaba" "middle east/Jordan/layers" 34.90 35.15 29.45 29.65 "aqaba"
          run_region "Irbid" "middle east/Jordan/layers" 35.75 35.95 32.45 32.65 "irbid"
          run_region "Zarqa" "middle east/Jordan/layers" 36.05 36.20 32.00 32.15 "zarqa"
          run_region "Madaba" "middle east/Jordan/layers" 35.70 35.85 31.65 31.80 "madaba"
          run_region "Salt" "middle east/Jordan/layers" 35.65 35.80 32.00 32.10 "salt"
          run_region "Jerash" "middle east/Jordan/layers" 35.85 36.00 32.25 32.35 "jerash"
          run_region "Karak" "middle east/Jordan/layers" 35.65 35.80 31.15 31.25 "karak"

          # Palestinian regions. These use only the data already stored in the repository.
          run_region "Ramallah" "middle east/Palestine/layers" 35.15 35.30 31.85 32.00 "ramallah"
          run_region "Jerusalem" "middle east/Palestine/layers" 35.15 35.30 31.70 31.85 "jerusalem"
          run_region "Nablus" "middle east/Palestine/layers" 35.20 35.35 32.15 32.30 "nablus"
          run_region "Hebron" "middle east/Palestine/layers" 35.05 35.20 31.45 31.60 "hebron"
          run_region "Bethlehem" "middle east/Palestine/layers" 35.15 35.25 31.65 31.75 "bethlehem"
          run_region "Jenin" "middle east/Palestine/layers" 35.15 35.35 32.40 32.55 "jenin"
          run_region "Tulkarm" "middle east/Palestine/layers" 35.00 35.15 32.25 32.35 "tulkarm"
          run_region "Gaza" "middle east/Palestine/layers" 34.40 34.55 31.45 31.60 "gaza"

          # Tel Aviv is intentionally not fabricated: no Israeli source layer is present in the current repository.
          echo "All configured regions attempted. Individual tile failures are logged and skipped."
          git status --short
