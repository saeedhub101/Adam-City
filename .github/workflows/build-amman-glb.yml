name: Build Amman Realistic GLB Tiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "middle east/UnityGame/tools/build_amman_glb.py"
      - "middle east/Jordan/layers/**"

permissions:
  contents: read

jobs:
  export-amman:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Jordan and Palestine source data
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Blender exporter
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Export Amman buildings, roads, windows, roofs and labels
        working-directory: middle east/UnityGame
        run: |
          blender --background --python tools/build_amman_glb.py -- --data ../Jordan/layers --out BuildGLB/Amman --west 35.72 --east 36.08 --south 31.70 --north 32.12 --tile 0.01
      - name: Upload tiled GLB city
        uses: actions/upload-artifact@v4
        with:
          name: amman-realistic-glb-tiles
          path: |
            middle east/UnityGame/BuildGLB/Amman/**
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
