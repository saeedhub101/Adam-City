name: Audit Malate building data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'maps/malate-map.json'
      - 'scripts/audit-malate-buildings.py'
      - '.github/workflows/audit-malate-buildings.yml'
permissions:
  contents: write
concurrency:
  group: malate-building-audit-main
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate audit script and game JavaScript syntax
        run: |
          python -m py_compile scripts/audit-malate-buildings.py
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      attrs = dict(attrs)
                      self.capture = attrs.get("type") == "module" and not attrs.get("src")
                      if self.capture: self.parts = []
              def handle_data(self, data):
                  if self.capture: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.capture:
                      self.scripts.append("".join(self.parts))
                      self.capture = False
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline module script found in index.html")
          Path("/tmp/adam-city-main.mjs").write_text(chr(10).join(parser.scripts), encoding="utf-8")
          PY
          node --check /tmp/adam-city-main.mjs
      # The audit also reports tag coverage for the game's actual 3.5 km render bounds.
      - name: Audit saved building metadata
        run: python scripts/audit-malate-buildings.py
      - name: Commit reusable audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add maps/malate-building-audit.json maps/malate-facade-materials.json
          if git diff --cached --quiet; then
            echo "Building audit report unchanged."
            exit 0
          fi
          git commit -m "Refresh Malate building metadata audit"
          # Keep the report commit safe if main advanced during the audit.
          git pull --rebase origin main
          git push
