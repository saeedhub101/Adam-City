name: Import Saeed character asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-saeed-character.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-character:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download the original Saeed GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/saeedhub101/Saeed-V2.0/main/assets/Saeed_AI-3D.glb" \
            --output assets/Saeed_AI-3D.glb
          test "$(stat -c%s assets/Saeed_AI-3D.glb)" -eq 17232556
          test "$(head -c 4 assets/Saeed_AI-3D.glb)" = "glTF"
          sha256sum assets/Saeed_AI-3D.glb

      - name: Commit the original character asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Saeed_AI-3D.glb
          if git diff --cached --quiet; then
            echo "The source GLB is already identical; nothing to commit."
            exit 0
          fi
          git commit -m "Add original Saeed 3D character asset"
          git push origin HEAD:main
