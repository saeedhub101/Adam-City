name: Normalize Saeed character asset name

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-saeed-character.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-character:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rename the existing character asset in this repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ -f assets/Saeed_AI-3D.glb ] && [ ! -f assets/saeed.glb ]; then
            git mv assets/Saeed_AI-3D.glb assets/saeed.glb
          fi
          test -f assets/saeed.glb
          test "$(stat -c%s assets/saeed.glb)" -eq 17232556
          test "$(head -c 4 assets/saeed.glb)" = "glTF"
          sha256sum assets/saeed.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Asset already uses the canonical filename."
            exit 0
          fi
          git commit -m "Rename Saeed character asset to saeed.glb"
          git push origin HEAD:main
