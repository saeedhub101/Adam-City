name: Validate canonical Saeed character asset

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - ".github/workflows/import-saeed-character.yml"
  pull_request:
    branches: [main]
    paths:
      - "assets/**"
      - ".github/workflows/import-saeed-character.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-character-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify canonical GLB asset
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/saeed.glb || { echo "::error::Missing assets/saeed.glb"; exit 1; }
          size="$(stat -c%s assets/saeed.glb)"
          test "$size" -eq 17232556 || { echo "::error::Unexpected GLB size: $size"; exit 1; }
          magic="$(head -c 4 assets/saeed.glb)"
          test "$magic" = "glTF" || { echo "::error::Invalid GLB header: $magic"; exit 1; }
          sha256sum assets/saeed.glb
          echo "Canonical Saeed GLB asset is present and structurally identified."
