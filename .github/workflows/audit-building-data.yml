name: Audit complete building data and indexes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'complete_data/OSM/scripts/audit_building_data.py'
      - '.github/workflows/audit-building-data.yml'

permissions:
  contents: write

concurrency:
  group: audit-building-data
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse every building index and inventory without changing source data
        run: python3 complete_data/OSM/scripts/audit_building_data.py

      - name: Validate audit report and required assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("complete_data/OSM/data/buildings/parts/building-data-full-audit.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["full_enrichment_index"]["records_parsed"] == d["full_enrichment_index"]["reported_counts"]["total"]
          assert len(d["original_four_part_assets"]) == 4
          assert len(d["separate_six_part_assets"]["parts"]) == 6
          assert d["repository_building_data_file_inventory"]["file_count"] > 0
          print("Full building data audit report validated.")
          PY

      - name: Commit only the generated audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/OSM/data/buildings/parts/building-data-full-audit.json
          if git diff --cached --quiet; then
            echo "Audit report is unchanged."
          else
            git commit -m "Record full building data and index audit"
            git push origin main
          fi
