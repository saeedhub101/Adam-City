name: Build game and capture screenshot

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "game/**"
      - ".github/workflows/game-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test tools
        run: |
          npm init -y
          npm install --no-save playwright three
          npx playwright install --with-deps chromium

      - name: Serve the actual GitHub Pages entry point
        run: |
          python3 -m http.server 4173 --directory . > /tmp/adam-city-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/adam-city-server.log
          exit 1

      - name: Capture game and report photo texture status
        run: |
          cat > capture-game.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          const page = await browser.newPage({viewport:{width:1600,height:900},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:90000});
          await page.waitForTimeout(10000);
          await page.screenshot({path:'game-screenshot.png'});
          console.log('Page title:',await page.title());
          console.log('Photo texture status:',await page.locator('#status, #status-text').first().textContent().catch(()=> 'status element missing'));
          console.log('Page errors:',JSON.stringify(errors.slice(0,30)));
          await browser.close();
          EOF
          node capture-game.mjs

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: adam-city-screenshot
          path: game-screenshot.png
          if-no-files-found: error
          retention-days: 14
