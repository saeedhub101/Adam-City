name: Build game and capture screenshot

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "game/**"
      - ".github/workflows/game-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm init -y
          npm install --no-save playwright three
          npx playwright install --with-deps chromium
      - name: Serve the actual GitHub Pages entry point
        run: |
          python3 -m http.server 4173 --directory . > /tmp/adam-city-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/adam-city-server.log
          exit 1
      - name: Verify the game starts and capture screenshot
        run: |
          cat > capture-game.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          const page = await browser.newPage({viewport:{width:1600,height:900},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error' && !m.text().includes('WebGL')) errors.push(m.text())});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:90000});
          await page.waitForTimeout(2500);
          if (await page.locator('canvas').count() !== 1) throw new Error('3D canvas did not initialize');
          if (errors.length) throw new Error('Browser errors before start: '+JSON.stringify(errors));
          await page.locator('#start').click();
          await page.waitForTimeout(1200);
          if (!(await page.locator('#cover').evaluate(el=>el.classList.contains('hidden')))) throw new Error('Start button did not enter the game');
          if (await page.locator('#hud').evaluate(el=>getComputedStyle(el).display) === 'none') throw new Error('Gameplay HUD did not appear');
          await page.keyboard.down('w');
          await page.waitForTimeout(700);
          await page.keyboard.up('w');
          await page.screenshot({path:'game-screenshot.png'});
          if (errors.length) throw new Error('Browser errors during gameplay: '+JSON.stringify(errors));
          console.log('PASS: canvas initialized, Start entered gameplay, HUD appeared, movement input accepted.');
          console.log('Title:',await page.title());
          await browser.close();
          EOF
          node capture-game.mjs
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: adam-city-screenshot
          path: game-screenshot.png
          if-no-files-found: error
          retention-days: 14
