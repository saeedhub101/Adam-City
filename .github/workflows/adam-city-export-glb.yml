name: Export current preview to one GLB

on:
  workflow_dispatch:
  push:
    paths:
      - "ermita/scripts/export_preview_to_glb.py"
      - ".github/workflows/adam-city-export-glb.yml"
      - "ermita/maps/generated/ermita-building-footprints.geojson"
      - "ermita/maps/generated/ermita-road-network.geojson"
      - "ermita/3d/terrain/ermita-copernicus-dem-cropped.tif"

permissions:
  contents: write

concurrency:
  group: adam-city-glb-export-main
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          filter: blob:none
          sparse-checkout: |
            .github/workflows/adam-city-export-glb.yml
            ermita/scripts/export_preview_to_glb.py
            ermita/maps/generated/ermita-building-footprints.geojson
            ermita/maps/generated/ermita-road-network.geojson
            ermita/3d/terrain/ermita-copernicus-dem-cropped.tif
            ermita/3d/exports/adam-city-complete.glb
            ermita/3d/exports/adam-city-complete-report.json
          sparse-checkout-cone-mode: false
      - name: Fetch only the required DEM asset
        run: git lfs pull --include="ermita/3d/terrain/ermita-copernicus-dem-cropped.tif"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry dependencies
        run: python -m pip install --upgrade pip numpy scipy rasterio trimesh shapely pyproj mapbox-earcut
      - name: Build unified GLB
        run: python ermita/scripts/export_preview_to_glb.py
      - name: Validate GLB and size
        run: |
          test -s ermita/3d/exports/adam-city-complete.glb
          python - <<'PY'
          import trimesh
          p='ermita/3d/exports/adam-city-complete.glb'
          s=trimesh.load(p, force='scene')
          assert len(s.geometry) > 0, 'GLB contains no geometry'
          print('geometry nodes:', len(s.geometry))
          print('bounds:', s.bounds)
          print('size bytes:', __import__('os').path.getsize(p))
          PY
          size=$(stat -c%s ermita/3d/exports/adam-city-complete.glb)
          if [ "$size" -gt 95000000 ]; then
            echo "GLB exceeds safe GitHub single-file size; refusing to commit a broken/oversized repository asset."
            exit 1
          fi
      - name: Commit GLB and report to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/3d/exports/adam-city-complete.glb ermita/3d/exports/adam-city-complete-report.json
          if git diff --cached --quiet; then
            echo "GLB unchanged; nothing to commit."
          else
            git commit -m "Export current Ermita preview as unified GLB"
            git push origin HEAD:main
          fi
