name: Package SaeedIsland UEFN base

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Tools/Get-ReadyUEFNBase.ps1"
      - ".github/workflows/package-saeed-island.yml"
      - "Verse/saeed_npc_behavior.verse"
      - "UEFN/SaeedIsland/NPC-INTEGRATION.md"

permissions:
  contents: read

jobs:
  package-project:
    runs-on: windows-latest
    steps:
      - name: Check out Saeed tooling
        uses: actions/checkout@v4

      - name: Download and validate existing UEFN project and Saeed model
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "SaeedIsland-Base"
          ./Tools/Get-ReadyUEFNBase.ps1 -Destination $destination
          $project = Join-Path $destination "ForTemple/ForTemple.uefnproject"
          $map = Join-Path $destination "ForTemple/Plugins/ForTemple/Content/ForTemple.umap"
          $model = Join-Path $destination "Saeed-Assets/saeed.glb"
          foreach ($path in @($project, $map, $model)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required project file missing: $path"
            }
          }
          $verseSource = Join-Path $env:GITHUB_WORKSPACE "Verse/saeed_npc_behavior.verse"
          $verseTarget = Join-Path $destination "ForTemple/Plugins/ForTemple/Content/saeed_npc_behavior.verse"
          $guideSource = Join-Path $env:GITHUB_WORKSPACE "UEFN/SaeedIsland/NPC-INTEGRATION.md"
          if (-not (Test-Path -LiteralPath $verseSource -PathType Leaf)) { throw "Missing Saeed NPC Verse source: $verseSource" }
          if (-not (Test-Path -LiteralPath $guideSource -PathType Leaf)) { throw "Missing NPC integration guide: $guideSource" }
          Copy-Item -LiteralPath $verseSource -Destination $verseTarget
          Copy-Item -LiteralPath $guideSource -Destination (Join-Path $destination "NPC-INTEGRATION.md")
          Write-Host "UEFN project descriptor, map package, Saeed GLB, Verse source, and NPC guide are present."
          Get-Item $project, $map, $model, $verseTarget | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Create downloadable ZIP
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "SaeedIsland-Base"
          $archive = Join-Path $env:RUNNER_TEMP "SaeedIsland-Base.zip"
          Compress-Archive -Path (Join-Path $destination "*") -DestinationPath $archive -CompressionLevel Optimal
          if ((Get-Item $archive).Length -lt 1MB) {
            throw "The packaged project ZIP is unexpectedly small."
          }
          Write-Host "Created package: $archive"

      - name: Upload downloadable project package
        uses: actions/upload-artifact@v4
        with:
          name: SaeedIsland-UEFN-Base
          path: ${{ runner.temp }}/SaeedIsland-Base.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
