name: Import Central Amman Open Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-amman-open-data.yml"
      - "Tools/Build-Amman-OpenData.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-amman-open-data
  cancel-in-progress: false

jobs:
  build-amman-vector-extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install OSM extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool
          python -m pip install --upgrade pip
          python -m pip install osmium

      - name: Download current Jordan OpenStreetMap snapshot
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --output jordan-latest.osm.pbf \
            https://download.geofabrik.de/asia/jordan-latest.osm.pbf
          test -s jordan-latest.osm.pbf

      - name: Extract the central Amman driving area
        run: |
          osmium extract \
            --strategy=complete_ways \
            --bbox=35.9100,31.9400,35.9440,31.9640 \
            --output=amman-core.osm.pbf \
            --overwrite \
            jordan-latest.osm.pbf
          test -s amman-core.osm.pbf
          python Tools/Build-Amman-OpenData.py

      - name: Validate the generated city dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("SaeedRoyaleGodot/assets/amman_core.geojson")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["type"] == "FeatureCollection"
          assert data["source"] == "OpenStreetMap contributors"
          assert len(data["features"]) >= 150
          assert data["stats"]["building_footprints"] >= 100
          assert data["stats"]["road_centerlines"] >= 50
          assert any(f["properties"].get("kind") == "building" for f in data["features"])
          assert any(f["properties"].get("kind") == "road" for f in data["features"])
          print("Validated:", path, "features:", len(data["features"]), "bytes:", path.stat().st_size)
          PY

      - name: Commit the actual Amman map data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SaeedRoyaleGodot/assets/amman_core.geojson
          if git diff --cached --quiet; then
            echo "Amman dataset is unchanged."
            exit 0
          fi
          git commit -m "Add central Amman OpenStreetMap dataset"
          git push origin HEAD:main
