name: Build and store local Jordan-Palestine terrain
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_middle_east_terrain.py"
      - ".github/workflows/build-middle-east-terrain.yml"
permissions:
  contents: write
concurrency:
  group: local-middle-east-terrain
  cancel-in-progress: false
jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial tools
        run: python -m pip install --disable-pip-version-check numpy rasterio pillow requests
      - name: Download and convert elevation data
        run: python scripts/build_middle_east_terrain.py
      - name: Commit generated local terrain files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/Government/Terrain
          if git diff --cached --quiet; then
            echo "No terrain changes to commit."
          else
            git commit -m "Add downloadable local Jordan-Palestine terrain data"
            git push origin HEAD:main
          fi
