name: Build visual contact sheets for facade review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ermita/scripts/build_facade_contact_sheets.py"
      - ".github/workflows/build-facade-contact-sheets.yml"
permissions:
  contents: write
concurrency:
  group: facade-contact-sheets
  cancel-in-progress: false
jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate contact sheets from stored images
        run: python ermita/scripts/build_facade_contact_sheets.py
      - name: Commit contact sheets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kartaview/facade-crops/contact-sheets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add visual contact sheets for KartaView facade review"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
