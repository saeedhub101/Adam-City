name: Collect licensed real photos near Tabarbour
on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-tabarbour-photos.yml"
      - "scripts/build_tabarbour_photo_catalog.py"
permissions:
  contents: write
concurrency:
  group: tabarbour-photo-catalog
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect public photo metadata and licenses
        run: python3 scripts/build_tabarbour_photo_catalog.py
      - name: Commit catalogue if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/public/data/tabarbour-photo-catalog.json
          if git diff --cached --quiet; then
            echo "Photo catalogue is unchanged."
            exit 0
          fi
          git commit -m "Refresh licensed Tabarbour photo catalogue"
          git pull --rebase origin main
          git push origin HEAD:main
