name: Build building visual research queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-building-visual-research-queue.yml'
      - 'complete_data/OSM/scripts/build_building_visual_research_queue.py'
      - 'complete_data/OSM/data/buildings/parts/building-enrichment-index.json'
      - 'complete_data/OSM/data/buildings/parts/part1/part1-inventory.json'
      - 'complete_data/OSM/data/buildings/parts/part2/part2-inventory.json'
      - 'complete_data/OSM/data/buildings/parts/part3/part3-inventory.json'
      - 'complete_data/OSM/data/buildings/parts/part4/part4-inventory.json'

permissions:
  contents: write

concurrency:
  group: building-visual-research-queue
  cancel-in-progress: true

jobs:
  build-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out inventory and enrichment data
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            /complete_data/OSM/data/buildings/parts/building-enrichment-index.json
            /complete_data/OSM/data/buildings/parts/part1/part1-inventory.json
            /complete_data/OSM/data/buildings/parts/part2/part2-inventory.json
            /complete_data/OSM/data/buildings/parts/part3/part3-inventory.json
            /complete_data/OSM/data/buildings/parts/part4/part4-inventory.json
            /complete_data/OSM/scripts/build_building_visual_research_queue.py
          sparse-checkout-cone-mode: false

      - name: Install script dependency
        run: python3 -m pip install --disable-pip-version-check pyproj

      - name: Build coordinate-based visual research queue
        run: python3 complete_data/OSM/scripts/build_building_visual_research_queue.py

      - name: Commit research queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/OSM/data/buildings/parts/building-visual-research-queue.csv
          git add complete_data/OSM/data/buildings/parts/building-visual-research-queue.geojson
          git add complete_data/OSM/data/buildings/parts/BUILDING-VISUAL-RESEARCH.md
          if git diff --cached --quiet; then
            echo "Visual research queue is already up to date."
          else
            git commit -m "Build visual research queue for unmatched buildings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
