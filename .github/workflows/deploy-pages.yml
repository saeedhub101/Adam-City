          test -s complete_data/OSM/Buildings/supreme-court-main-facade.glb
          test -s complete_data/OSM/Buildings/supreme-court-main-facade-report.json
          # Save every newly imported/generated asset to main. Existing committed outputs are reused.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/saeedhub101/Adam-City.git"
          if [[ "$NEW_TILES" -gt 0 || "$REBUILD_FALLBACKS" -eq 1 ]]; then
            git add ermita/maps/sources/openfreemap/
          fi
          # Persist the generated alignment file in main as well as publishing it, so the page never depends on a temporary CI-only asset.
          git add ermita/3d/generated/facade-model-origin.json ermita/3d/generated/ermita-buildings-facade-details.glb ermita/3d/generated/facade-signage-index.csv ermita/3d/generated/facade-details-report.json ermita/3d/generated/facade-generation.sha256
          git add ermita/3d/landmarks/landmark-facade-details.glb ermita/3d/landmarks/landmark-facade-origin.json ermita/3d/landmarks/landmark-facade-report.json ermita/3d/landmarks/landmark-generation.sha256
          git add complete_data/OSM/Markets/ complete_data/OSM/Buildings/Markets/facidals/
          git add complete_data/OSM/Buildings/supreme-court-main-facade.glb complete_data/OSM/Buildings/supreme-court-main-facade-report.json complete_data/OSM/Buildings/reference_images/supreme-court-in-manila-facade-crop.jpg
          git add complete_data/OSM/data/buildings/roxas-boulevard/
          git add complete_data/OSM/data/buildings/ermita-glb-parts/
          git add complete_data/OSM/data/buildings/parts/building-enrichment-index.json complete_data/OSM/data/buildings/parts/building-enrichment-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Store generated building and ground fallback data"
            # Other workflows checkpoint progress to main while this build is running.
            # Rebase this generated commit onto latest main to avoid a non-fast-forward rejection.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Fallback files already exist and are unchanged; no re-import or repository commit needed."
          fi
          # Keep the repository's root index.html deleted; publish a tiny redirect only in the artifact.
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=roxas-boulevard-model.html"><title>Roxas Boulevard 3D Model</title><a href="roxas-boulevard-model.html">Open Roxas Boulevard 3D model</a></html>' > site/index.html
          echo "Published files:"
          du -sh site
          find site -type f -name '*.pbf' | wc -l

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload map artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
