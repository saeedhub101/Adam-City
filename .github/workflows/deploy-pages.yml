name: Publish Manila page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble static page and its existing data files
        shell: bash
        run: |
          set -euo pipefail
          test -s manila.html
          test -s Manila/layers/building.geojsonl
          mkdir -p site/Manila/layers site/Manila/vector-tiles
          cp manila.html site/manila.html
          cp -a Manila/layers/. site/Manila/layers/
          cp -a Manila/vector-tiles/. site/Manila/vector-tiles/
          printf '%s\\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=manila.html"><title>Manila</title><a href="manila.html">Open Manila</a></html>' > site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish page
        id: deployment
        uses: actions/deploy-pages@v4
