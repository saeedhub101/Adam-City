name: Publish Manila page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'manila.html'
      - 'test.html'
      - 'ermita-malate-3d.html'
      - 'ermita/**'
      - 'complete_data/OSM/data/**'
      - 'ermita/maps/sources/openfreemap/building-fallback.geojson'
      - 'manila-bundry.html'
      - 'Manila/vector-tiles/**'
      - 'Manila/3d-rag/apply-report.json'
      - 'complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.parts/part-001-readable-parts/part-004.geojson'
      - 'complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.parts/part-001-readable-parts/part-005.geojson'
      - 'complete_data/OFT/building-fallback.geojson'
      - 'complete_data/OFT/layers/building.geojsonl'
      - 'complete_data/OFT/buildings-part1.geojson.gz'
      - 'complete_data/OFT/buildings-part2.geojson.gz'
      - 'complete_data/open free tile/building-fallback.geojson'
      - 'complete_data/open free tile/layers/building.geojsonl'
      - 'complete_data/open free tile/buildings-part1.geojson.gz'
      - 'complete_data/open free tile/buildings-part2.geojson.gz'
      - 'complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.parts/part-001-readable-parts/part-011.geojson'
      - 'complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.parts/part-001-readable-parts/part-080.geojson'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publishing only: no conversion, splitting, downloading, or data generation.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble the page from available saved files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/Manila/vector-tiles site/Manila/3d-rag
          mkdir -p site/ermita/maps/sources/openfreemap site/complete_data/OFT/layers site/complete_data/OSM/data
          geojson_dir='complete_data/OSM/data/buildings/Ermita/ermita-buildings-master.parts/part-001-readable-parts'
          mkdir -p "site/$geojson_dir" site/complete_data/open-free-tile

          # Copy pages only when present; absent optional files should not fail publishing.
          if [ -f manila.html ]; then cp manila.html site/manila.html; else echo "WARNING: manila.html is missing"; fi
          if [ -f test.html ]; then cp test.html site/test.html; else echo "ERROR: test.html is missing"; exit 1; fi
          if [ -f ermita-malate-3d.html ]; then cp ermita-malate-3d.html site/ermita-malate-3d.html; else echo "ERROR: ermita-malate-3d.html is missing"; exit 1; fi
          if [ -d ermita ]; then cp -a ermita/. site/ermita/; else echo "ERROR: ermita assets directory is missing"; exit 1; fi
          if [ -d complete_data/OSM/data ]; then cp -a complete_data/OSM/data/. site/complete_data/OSM/data/; else echo "WARNING: OSM data directory is missing"; fi
          if [ -f manila-bundry.html ]; then cp manila-bundry.html site/manila-bundry.html; else echo "WARNING: manila-bundry.html is missing"; fi

          # Publish the exact OpenFreeMap GeoJSON path referenced by manila.html.
          fallback_ermita='ermita/maps/sources/openfreemap/building-fallback.geojson'
          if [ -s "$fallback_ermita" ]; then
            cp "$fallback_ermita" "site/$fallback_ermita"
            echo "Published local OpenFreeMap building fallback: $fallback_ermita ($(wc -c < "$fallback_ermita") bytes)"
          else
            echo "ERROR: required local OpenFreeMap building fallback is missing or empty: $fallback_ermita"
            exit 1
          fi

          for file in part-004.geojson part-005.geojson part-011.geojson part-080.geojson; do
            if [ -f "$geojson_dir/$file" ]; then
              cp "$geojson_dir/$file" "site/$geojson_dir/$file"
            else
              echo "WARNING: optional GeoJSON missing: $geojson_dir/$file"
            fi
          done

          fallback='complete_data/open free tile/building-fallback.geojson'
          if [ -f "$fallback" ]; then
            cp "$fallback" site/complete_data/open-free-tile/building-fallback.geojson
          else
            echo "WARNING: optional GeoJSON missing: $fallback"
          fi

          # Publish the exact complete_data/OFT paths referenced by the GeoJSON checkboxes.
          for file in building-fallback.geojson; do
            if [ -s "complete_data/OFT/$file" ]; then
              cp "complete_data/OFT/$file" "site/complete_data/OFT/$file"
              echo "Published OFT GeoJSON: complete_data/OFT/$file ($(wc -c < "complete_data/OFT/$file") bytes)"
            else
              echo "ERROR: required OFT GeoJSON is missing or empty: complete_data/OFT/$file"
              exit 1
            fi
          done
          if [ -s complete_data/OFT/layers/building.geojsonl ]; then
            cp complete_data/OFT/layers/building.geojsonl site/complete_data/OFT/layers/building.geojsonl
          else
            echo "WARNING: optional OFT building layer missing: complete_data/OFT/layers/building.geojsonl"
          fi
          for file in buildings-part1.geojson.gz buildings-part2.geojson.gz; do
            if [ -s "complete_data/OFT/$file" ]; then
              cp "complete_data/OFT/$file" "site/complete_data/OFT/$file"
            else
              echo "WARNING: optional OFT building part missing: complete_data/OFT/$file"
            fi
          done

          # Publish the exact source files used by the independent building toggles.
          layers_building='complete_data/open free tile/layers/building.geojsonl'
          if [ -f "$layers_building" ]; then
            cp "$layers_building" site/complete_data/open-free-tile/layers/building.geojsonl
          else
            echo "WARNING: optional building layer missing: $layers_building"
          fi
          for file in buildings-part1.geojson.gz buildings-part2.geojson.gz; do
            if [ -f "complete_data/open free tile/$file" ]; then
              cp "complete_data/open free tile/$file" "site/complete_data/open-free-tile/$file"
            else
              echo "WARNING: optional building part missing: $file"
            fi
          done

          if [ -d Manila/vector-tiles ]; then
            pbf_count="$(find Manila/vector-tiles -type f -name '*.pbf' | wc -l)"
            if [ "$pbf_count" -gt 0 ]; then
              cp -a Manila/vector-tiles/. site/Manila/vector-tiles/
            else
              echo "WARNING: no PBF files found; publishing without vector tiles"
            fi
          else
            echo "WARNING: Manila/vector-tiles directory is missing; publishing without vector tiles"
          fi

          if [ -s Manila/3d-rag/apply-report.json ]; then
            cp Manila/3d-rag/apply-report.json site/Manila/3d-rag/apply-report.json
          else
            echo "INFO: no apply-report.json; skipping report"
          fi

          touch site/.nojekyll
          printf '%s' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=manila.html"><title>Manila</title><a href="manila.html">Open Manila</a></html>' > site/index.html
          echo "Publish-only build complete. Existing files copied where available; no data generation performed."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish page
        id: deployment
        uses: actions/deploy-pages@v4
