name: Publish Manila page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'manila.html'
      - 'manila-bundry.html'
      - 'Manila/vector-tiles/**'
      - 'old/manila/ermita-buildings-master.parts/**'
      - 'Manila/3d-rag/apply-report.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publishing only: no conversion, splitting, downloading, or data generation.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble the page from saved files only
        shell: bash
        run: |
          set -euo pipefail
          test -s manila.html
          test -s manila-bundry.html
          test -d Manila/vector-tiles
          pbf_count="$(find Manila/vector-tiles -type f -name '*.pbf' | wc -l)"
          test "$pbf_count" -gt 0
          test -s old/manila/ermita-buildings-master.parts/part-001.geojson
          test -s old/manila/ermita-buildings-master.parts/part-002.geojson
          mkdir -p site/Manila/vector-tiles site/Manila/3d-rag site/old/manila/ermita-buildings-master.parts
          cp manila.html site/manila.html
          cp manila-bundry.html site/manila-bundry.html
          cp -a Manila/vector-tiles/. site/Manila/vector-tiles/
          cp -a old/manila/ermita-buildings-master.parts/. site/old/manila/ermita-buildings-master.parts/
          if [ -s Manila/3d-rag/apply-report.json ]; then
            cp Manila/3d-rag/apply-report.json site/Manila/3d-rag/apply-report.json
          fi
          touch site/.nojekyll
          printf '%s' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=manila.html"><title>Manila</title><a href="manila.html">Open Manila</a></html>' > site/index.html
          echo "Publish-only build: copied $pbf_count existing PBF files and the original part-001.geojson and part-002.geojson files; no data generation performed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish page
        id: deployment
        uses: actions/deploy-pages@v4
