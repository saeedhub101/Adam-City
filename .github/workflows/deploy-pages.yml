          cp ermita/3d/landmarks/landmark-facade-report.json site/ermita/3d/landmarks/landmark-facade-report.json
          cp complete_data/OSM/Buildings/Markets/facidals/robenson.glb site/ermita/3d/commercial/commercial-facades.glb
          cp complete_data/OSM/Markets/commercial-facades-origin.json site/ermita/3d/commercial/commercial-facades-origin.json
          cp complete_data/OSM/Markets/commercial-facades-report.json site/ermita/3d/commercial/commercial-facades-report.json
          cp -a complete_data/OSM/Markets/. site/complete_data/OSM/Markets/
          cp complete_data/OSM/Buildings/Markets/facidals/robenson.glb site/complete_data/OSM/Buildings/Markets/facidals/robenson.glb
          cp complete_data/OSM/Buildings/Markets/facidals/pedro-gil-7eleven-decal.glb site/complete_data/OSM/Buildings/Markets/facidals/pedro-gil-7eleven-decal.glb
          cp complete_data/OSM/Buildings/Markets/facidals/all-7eleven-plane-textures.glb site/complete_data/OSM/Buildings/Markets/facidals/all-7eleven-plane-textures.glb
          cp complete_data/OSM/Buildings/supreme-court-main-facade.glb site/complete_data/OSM/Buildings/supreme-court-main-facade.glb
          cp complete_data/OSM/Buildings/supreme-court-main-facade-report.json site/complete_data/OSM/Buildings/supreme-court-main-facade-report.json
          cp complete_data/OSM/Buildings/reference_images/supreme-court-in-manila-facade-crop.jpg site/complete_data/OSM/Buildings/reference_images/supreme-court-in-manila-facade-crop.jpg
          cp "complete_data/OSM/data/buildings/roxas-boulevard/roxas bulivard buildings.glb" "site/complete_data/OSM/data/buildings/roxas-boulevard/roxas bulivard buildings.glb"
          cp complete_data/OSM/data/buildings/roxas-boulevard/roxas-bulivard-buildings-origin.json site/complete_data/OSM/data/buildings/roxas-boulevard/roxas-bulivard-buildings-origin.json
          cp complete_data/OSM/data/buildings/roxas-boulevard/roxas-bulivard-buildings-report.json site/complete_data/OSM/data/buildings/roxas-boulevard/roxas-bulivard-buildings-report.json
          cp complete_data/OSM/data/buildings/roxas-boulevard/roxas-boulevard-signage.glb site/complete_data/OSM/data/buildings/roxas-boulevard/roxas-boulevard-signage.glb
          cp complete_data/OSM/data/buildings/roxas-boulevard/roxas-boulevard-signage-report.json site/complete_data/OSM/data/buildings/roxas-boulevard/roxas-boulevard-signage-report.json
          cp ermita/3d/exports/adam-city-complete.glb site/ermita/3d/exports/adam-city-complete.glb
