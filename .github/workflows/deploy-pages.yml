name: Publish Tabarbour 3D preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tabarbour.html'
      - 'middle east/BuildGLB/tabarbour-real/glb/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout only Tabarbour page and GLB assets
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            /tabarbour.html
            /middle east/BuildGLB/tabarbour-real/glb/
          sparse-checkout-cone-mode: false

      - name: Assemble minimal Tabarbour site
        shell: bash
        run: |
          set -euo pipefail
          test -s tabarbour.html || { echo "ERROR: tabarbour.html is missing"; exit 1; }
          test -s 'middle east/BuildGLB/tabarbour-real/glb/manifest.json' || {
            echo "ERROR: Tabarbour GLB manifest is missing"
            exit 1
          }

          mkdir -p 'site/middle east/BuildGLB/tabarbour-real/glb'
          cp tabarbour.html site/tabarbour.html
          cp -a 'middle east/BuildGLB/tabarbour-real/glb/.' 'site/middle east/BuildGLB/tabarbour-real/glb/'
          touch site/.nojekyll
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=tabarbour.html"><title>Tabarbour 3D</title><a href="tabarbour.html">Open Tabarbour 3D</a></html>' > site/index.html
          echo "Published Tabarbour page and its GLB assets only."
          du -sh site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: tabarbour-preview-${{ github.run_id }}

      - name: Publish page
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: tabarbour-preview-${{ github.run_id }}
