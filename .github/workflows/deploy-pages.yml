name: Adam-City — validate and deploy existing assets

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ermita/maps/sources/openfreemap/building-fallback.geojson'
      - 'ermita/maps/sources/openfreemap/ground-fallback.geojson'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch committed pages and assets only
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/saeedhub101/Adam-City.git
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin main
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone --stdin <<'EOF'
          /test.html
          /manila/manila.html
          /manila/manila/
          /ermita-malate-3d.html
          /google-photorealistic-3d-tiles.html
          /complete_data/OSM/data/
          /ermita/assets/textures/Painted-CMU-Block-Architextures.jpeg
          /ermita/maps/sources/openfreemap/vector-tiles/
          /ermita/maps/sources/openfreemap/building-fallback.geojson
          /ermita/maps/sources/openfreemap/ground-fallback.geojson
          /ermita/maps/generated/ermita-building-details.geojson
          /ermita/3d/exports/adam-city-complete.glb
          /ermita/3d/terrain/ermita-copernicus-dem-cropped.tif
          /ermita/3d/generated/ermita-buildings-facade-details.glb
          /ermita/3d/generated/facade-details-report.json
          /ermita/3d/generated/facade-model-origin.json
          /ermita/3d/generated/facade-signage-index.csv
          /ermita/3d/landmarks/
          EOF
          git switch -C main FETCH_HEAD

      - name: Assemble site from committed assets (no generation)
        shell: bash
        run: |
          set -euo pipefail
          test -s test.html
          test -s ermita-malate-3d.html
          test -s google-photorealistic-3d-tiles.html

          mkdir -p site/complete_data/OSM/data site/ermita/maps/sources/openfreemap site/ermita/maps/generated
          mkdir -p site/manila/manila
          mkdir -p site/ermita/3d/exports site/ermita/3d/terrain site/ermita/3d/generated site/ermita/3d/landmarks
          mkdir -p site/ermita/assets/textures

          cp test.html site/test.html
          cp manila/manila.html site/manila/manila.html
          cp -a manila/manila/. site/manila/manila/
          cp ermita-malate-3d.html site/ermita-malate-3d.html
          cp google-photorealistic-3d-tiles.html site/google-photorealistic-3d-tiles.html
          cp -a complete_data/OSM/data/. site/complete_data/OSM/data/
          cp -a ermita/maps/sources/openfreemap/vector-tiles site/ermita/maps/sources/openfreemap/
          cp ermita/maps/sources/openfreemap/building-fallback.geojson site/ermita/maps/sources/openfreemap/
          cp ermita/maps/sources/openfreemap/ground-fallback.geojson site/ermita/maps/sources/openfreemap/
          cp ermita/maps/generated/ermita-building-details.geojson site/ermita/maps/generated/
          cp ermita/3d/exports/adam-city-complete.glb site/ermita/3d/exports/
          cp ermita/3d/terrain/ermita-copernicus-dem-cropped.tif site/ermita/3d/terrain/
          cp ermita/3d/generated/ermita-buildings-facade-details.glb site/ermita/3d/generated/
          cp ermita/3d/generated/facade-details-report.json site/ermita/3d/generated/
          cp ermita/3d/generated/facade-model-origin.json site/ermita/3d/generated/
          cp ermita/3d/generated/facade-signage-index.csv site/ermita/3d/generated/
          cp -a ermita/3d/landmarks/. site/ermita/3d/landmarks/
          cp ermita/assets/textures/Painted-CMU-Block-Architextures.jpeg site/ermita/assets/textures/

          # Validate existing assets only. This workflow intentionally does not create or modify GLBs.
          test -s site/complete_data/OSM/data/buildings/windows/ermita-buildings-facade-details.glb
          test -s site/complete_data/OSM/data/buildings/Ermita/Parts1.glb
          test -s site/complete_data/OSM/data/buildings/Ermita/Parts2.glb
          test -s site/complete_data/OSM/data/buildings/Ermita/Parts3.glb
          test -s site/complete_data/OSM/data/buildings/Ermita/Parts4.glb
          test -s site/ermita/maps/sources/openfreemap/building-fallback.geojson
          test -s site/ermita/maps/sources/openfreemap/ground-fallback.geojson
          test -s site/ermita/3d/exports/adam-city-complete.glb
          test -s site/ermita/3d/generated/ermita-buildings-facade-details.glb
          test -s site/ermita/3d/landmarks/landmark-facade-details.glb

          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=test.html"><title>Adam-City</title><a href="test.html">Open Adam-City preview</a></html>' > site/index.html
          echo "Validated committed assets; no GLB generation or repository writes were performed."
          du -sh site
          find site -type f -name '*.pbf' | wc -l

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy existing assets
        id: deployment
        uses: actions/deploy-pages@v4
