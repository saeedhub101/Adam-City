name: Enhance existing building GLB parts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'complete_data/OSM/scripts/enhance_existing_glb_parts.py'
      - '.github/workflows/enhance-existing-glb-parts.yml'
      - 'ermita/scripts/generate_roxas_boulevard_buildings.py'

permissions:
  contents: write

concurrency:
  group: enhance-existing-glb-parts
  cancel-in-progress: false

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main and original GLBs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install geometry dependencies
        run: python -m pip install --disable-pip-version-check numpy trimesh shapely pyproj pillow mapbox-earcut

      - name: Generate enhanced GLB copies
        run: python complete_data/OSM/scripts/enhance_existing_glb_parts.py

      - name: Verify all four enhanced GLBs and reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("complete_data/OSM/data/buildings/parts/enhanced")
          report = json.loads((out / "enhancement-report.json").read_text())
          assert len(report["parts"]) == 4, "Expected four enhanced GLBs"
          for n in range(1, 5):
              glb = out / f"part{n}-detailed.glb"
              part_report = json.loads((out / f"part{n}-detailed-report.json").read_text())
              assert glb.is_file() and glb.stat().st_size > 1000, f"Missing or empty {glb}"
              assert part_report["output_bytes"] == glb.stat().st_size, f"Size mismatch: {glb}"
              assert part_report["facade_window_meshes"] + part_report["facade_accent_meshes"] + part_report["facade_base_meshes"] + part_report["photo_specific_detail_meshes"] > 0, f"No detail meshes generated for part {n}"
              print(f"part{n}: {glb.stat().st_size:,} bytes; windows={part_report['facade_window_meshes']}; accents={part_report['facade_accent_meshes']}; special={part_report['photo_specific_detail_meshes']}")
          PY

      - name: Commit enhanced copies without touching originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complete_data/OSM/data/buildings/parts/enhanced/
          if git diff --cached --quiet; then
            echo "Enhanced GLB outputs already match the current generator."
          else
            git commit -m "Generate enhanced GLB copies for building parts 1-4"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
