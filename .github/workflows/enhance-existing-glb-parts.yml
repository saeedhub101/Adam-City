name: Verify existing enhanced building GLBs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-existing-glb-parts.yml'
      - 'complete_data/OSM/data/buildings/parts/enhanced/**'

permissions:
  contents: read

concurrency:
  group: verify-existing-enhanced-glb-parts
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out committed assets
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify existing enhanced GLBs and reports without generating files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("complete_data/OSM/data/buildings/parts/enhanced")
          report = json.loads((out / "enhancement-report.json").read_text(encoding="utf-8"))
          assert len(report["parts"]) == 4, "Expected four existing enhanced GLBs"

          for n in range(1, 5):
              glb = out / f"part{n}-detailed.glb"
              part_report = json.loads((out / f"part{n}-detailed-report.json").read_text(encoding="utf-8"))
              assert glb.is_file() and glb.stat().st_size > 1000, f"Missing or empty {glb}"
              assert part_report["output_bytes"] == glb.stat().st_size, f"Size mismatch: {glb}"
              print(f"Verified existing {glb}: {glb.stat().st_size:,} bytes")

          print("Verification only: no GLB generation or file commits performed.")
          PY
