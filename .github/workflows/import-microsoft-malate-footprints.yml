name: Import Microsoft Malate Building Footprints

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ermita/scripts/import_microsoft_malate_footprints.py"
      - ".github/workflows/import-microsoft-malate-footprints.yml"

permissions:
  contents: write

concurrency:
  group: microsoft-malate-footprints
  cancel-in-progress: false

jobs:
  import-malate-footprints:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geometry dependency
        run: python -m pip install --disable-pip-version-check shapely

      - name: Download Microsoft archive and clip Malate area
        run: python ermita/scripts/import_microsoft_malate_footprints.py

      - name: Commit only the clipped subset and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/maps/sources/microsoft-satellite-buildings/microsoft-philippines-satellite-footprints-malate.geojson
          git add ermita/maps/sources/microsoft-satellite-buildings/microsoft-philippines-satellite-footprints-malate-report.json
          if git diff --cached --quiet; then
            echo "No Microsoft footprint changes to commit."
          else
            git commit -m "Add Microsoft satellite footprints for Malate"
            git push origin HEAD:main
          fi
