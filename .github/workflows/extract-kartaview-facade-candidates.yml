name: Extract KartaView facade crop candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ermita/scripts/extract_kartaview_facade_candidates.py"
      - ".github/workflows/extract-kartaview-facade-candidates.yml"

permissions:
  contents: write

concurrency:
  group: kartaview-facade-crops
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main including existing photos
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Crop all existing local KartaView images
        run: python ermita/scripts/extract_kartaview_facade_candidates.py
      - name: Save crop candidates and manifests to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kartaview/facade-crops
          if git diff --cached --quiet; then
            echo "No crop output changes."
            exit 0
          fi
          git commit -m "Generate reviewable KartaView facade crop candidates"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying against latest main."
            git rebase --abort || true
            sleep 2
          done
          echo "Could not push crop candidates after retries."
          exit 1
