name: Build Windows EXE with Helsinki reality mesh

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "scripts/download_helsinki_mesh.py"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saeed-open-world-windows-exe
  cancel-in-progress: false

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: game
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Helsinki source tile
        uses: actions/cache@v4
        with:
          path: game/public/models/helsinki
          key: helsinki-2017-678492x2-lod16-v1

      - name: Download and prepare the Helsinki photogrammetry tile
        working-directory: .
        run: python scripts/download_helsinki_mesh.py

      - name: Install Node dependencies
        run: npm install

      - name: Build portable Windows EXE
        run: npm run build:win

      - name: Verify EXE and Helsinki mesh bundle
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No Windows EXE was produced." }
          if (-not (Test-Path dist/models/helsinki/manifest.json)) { throw "Helsinki mesh manifest is missing from the game bundle." }
          $manifest = Get-Content dist/models/helsinki/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.tiles.Count -lt 1) { throw "No Helsinki mesh tile was bundled." }
          $objects = @($manifest.tiles | ForEach-Object { $_.objects.Count } | Measure-Object -Sum).Sum
          $textures = @($manifest.tiles | ForEach-Object { $_.textureCount } | Measure-Object -Sum).Sum
          if ($objects -lt 1 -or $textures -lt 1) { throw "The Helsinki OBJ/texture bundle is empty." }
          Write-Host "EXE: $($exe.Name), size: $($exe.Length) bytes"
          Write-Host "Helsinki OBJ pieces: $objects; texture images: $textures"
          Write-Host "Source imagery year: $($manifest.imageryYear); license: $($manifest.license)"

      - name: Upload portable EXE and mesh manifest
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Open-World-Windows-EXE
          path: |
            game/release/*.exe
            game/dist/models/helsinki/manifest.json
          if-no-files-found: error
          retention-days: 30
