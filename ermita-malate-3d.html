<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a23">
<title>ADAM CITY — Native Basemap Comparison</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<style>
:root{color-scheme:dark;--panel:rgba(16,26,35,.94);--line:#344654;--text:#eef4f7;--muted:#a7b8c4;--accent:#67d5c2}
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101a23;color:var(--text)}#map{position:absolute;inset:0}
.panel{position:absolute;z-index:3;top:10px;right:10px;width:min(270px,calc(100vw - 20px));border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 8px 26px #0004;backdrop-filter:blur(12px);padding:12px}
.title{font-size:14px;font-weight:750;margin-bottom:5px}.sub{font-size:11px;line-height:1.5;color:var(--muted);margin-bottom:10px}
.row{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:13px;color:#e5edf1;min-height:24px}input{accent-color:var(--accent);width:17px;height:17px;flex:0 0 auto}
.status{font-size:10px;color:var(--muted);line-height:1.5;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);overflow-wrap:anywhere}
#error{display:none;margin-top:8px;padding:8px;border-radius:8px;background:#542c31;color:#ffe2e3;font-size:11px;direction:ltr;overflow-wrap:anywhere}
@media(max-width:520px){.panel{top:6px;right:6px;width:min(250px,calc(100vw - 12px));padding:10px}.title{font-size:13px}}
</style>
</head>
<body>
<div id="map" aria-label="Native OpenFreeMap basemap comparison"></div>
<section class="panel">
  <div class="title">Basemap comparison</div>
  <div class="sub">اختر خريطة الأساس الأصلية من الإنترنت، وليس بلاطات المستودع المحلية.</div>
  <label class="row"><input type="checkbox" id="satelliteBasemap"> satellite basemap</label>
  <label class="row"><input type="checkbox" id="vectorBasemap" checked> Vector basemap</label>
  <div class="status" id="status">Loading native OpenFreeMap vector basemap…</div>
  <div id="error"></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
(() => {
  const vectorStyle = 'https://tiles.openfreemap.org/styles/liberty';
  const satelliteStyle = {
    version: 8,
    sources: {
      satellite: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        maxzoom: 19,
        attribution: 'Imagery © Esri, Maxar, Earthstar Geographics, and the GIS User Community'
      }
    },
    layers: [{id:'satellite-imagery',type:'raster',source:'satellite'}]
  };
  const status = document.getElementById('status');
  const errorBox = document.getElementById('error');
  const satelliteBox = document.getElementById('satelliteBasemap');
  const vectorBox = document.getElementById('vectorBasemap');
  let active = 'vector';
  const map = new maplibregl.Map({
    container: 'map',
    style: vectorStyle,
    center: [120.9821, 14.5848],
    zoom: 15,
    pitch: 57,
    bearing: -18,
    antialias: true
  });
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), 'bottom-left');
  map.addControl(new maplibregl.ScaleControl({unit:'metric'}), 'bottom-left');

  function chooseBasemap(mode) {
    active = mode;
    satelliteBox.checked = mode === 'satellite';
    vectorBox.checked = mode === 'vector';
    status.textContent = mode === 'satellite'
      ? 'Basemap: satellite imagery · مصدر صور خارجي'
      : 'Basemap: native OpenFreeMap vector style · بيانات المتجهات الأصلية عبر الإنترنت';
    errorBox.style.display = 'none';
    map.setStyle(mode === 'satellite' ? satelliteStyle : vectorStyle);
  }
  satelliteBox.addEventListener('change', () => chooseBasemap(satelliteBox.checked ? 'satellite' : 'vector'));
  vectorBox.addEventListener('change', () => chooseBasemap(vectorBox.checked ? 'vector' : 'satellite'));
  map.on('load', () => { map.resize(); });
  map.on('error', e => {
    const message = e && e.error && e.error.message ? e.error.message : 'A basemap resource failed to load.';
    errorBox.style.display = 'block';
    errorBox.textContent = message;
    status.textContent = 'Basemap load error — check the source connection.';
  });
})();
</script>
</body>
</html>
