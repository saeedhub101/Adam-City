<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADAM CITY — Tabarbour</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<style>
:root{color-scheme:dark;--panel:rgba(16,26,35,.96);--line:#344654;--text:#eef4f7;--muted:#a7b8c4;--accent:#67d5c2}
*{box-sizing:border-box}html,body,#map{height:100%;width:100%;margin:0}body{font-family:system-ui,sans-serif;background:#101a23;color:var(--text)}#map{position:absolute;inset:0}
.panel{position:absolute;z-index:5;top:10px;right:10px;width:min(300px,calc(100vw - 20px));height:auto;max-height:72dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#67d5c2 #172631;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 8px 26px #0005;backdrop-filter:blur(12px)}
.panel::-webkit-scrollbar{width:7px}.panel::-webkit-scrollbar-track{background:#172631;border-radius:8px}.panel::-webkit-scrollbar-thumb{background:#527c83;border-radius:8px}.panel::-webkit-scrollbar-thumb:hover{background:#67d5c2}
.panel .status{position:sticky;bottom:-12px;background:var(--panel);padding-bottom:8px}
h1{font-size:16px;margin:0 0 5px}.sub{font-size:11px;line-height:1.5;color:var(--muted);margin-bottom:10px}.group{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.group-title{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:5px}.row{display:flex;align-items:flex-start;gap:8px;margin:7px 0;font-size:12px;line-height:1.4}input{accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto;margin-top:1px}.status{font-size:10px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere;margin-top:9px;border-top:1px solid var(--line);padding-top:8px}#error{display:none;color:#ffdadd;background:#542c31;padding:8px;border-radius:7px;font-size:11px;margin-top:8px;direction:ltr;overflow-wrap:anywhere}.attribution{position:absolute;bottom:8px;left:8px;z-index:2;background:#101a23df;padding:5px 8px;border-radius:6px;font-size:10px;direction:ltr}
@media(max-width:520px){.panel{top:6px;right:6px;width:min(270px,calc(100vw - 12px));max-height:55dvh;padding:9px}h1{font-size:14px}.row{font-size:11px;margin:5px 0}}
</style></head>
<body>
<div id="map" aria-label="خريطة ثلاثية الأبعاد لطبربور"></div>
<section class="panel">
<h1>ADAM CITY · طبربور</h1>
<div class="sub">الخريطة الأساسية ومباني المصدر، مع ملفات GLB لطبربور.</div>
<div class="group"><div class="group-title">المصدر الأصلي للخريطة</div>
<label class="row"><input type="checkbox" id="baseGround" checked> إظهار أرضية الخريطة الأساسية (الشوارع والمياه والحدائق والتسميات)</label>
<label class="row"><input type="checkbox" id="baseBuildings" checked> إظهار مباني المصدر الأساسية ثلاثية الأبعاد</label>
</div>
<button id="panelToggle" type="button" aria-expanded="true" aria-controls="panelContents" style="display:block;width:100%;margin:8px 0;padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:#20333f;color:var(--text);font-size:16px;font-weight:700;cursor:pointer">−</button>
<div id="panelContents">
<div class="group"><div class="group-title">ملفات GLB — طبربور</div><div id="glb-files"></div></div>
<div class="status" id="status">جارٍ تحميل خريطة طبربور وملفات GLB…</div><div id="error"></div>
</div>
</section>
<div class="attribution">OpenFreeMap / OpenMapTiles · © OpenStreetMap contributors</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
(async function(){
 const status=document.getElementById('status'),errorBox=document.getElementById('error');
 const panelContents=document.getElementById('panelContents'),panelToggle=document.getElementById('panelToggle');
 panelToggle.addEventListener('click',()=>{const collapsed=panelContents.style.display==='none';panelContents.style.display=collapsed?'block':'none';panelToggle.textContent=collapsed?'−':'+';panelToggle.setAttribute('aria-expanded',String(collapsed));});
 try{
  const res=await fetch('https://tiles.openfreemap.org/styles/liberty');
  if(!res.ok)throw new Error('Style HTTP '+res.status);
  const style=await res.json();
  const originalLayers=style.layers.map(l=>({...l}));
  const baseBuildingIds=originalLayers.filter(l=>l.type==='fill-extrusion'&&(/building/i.test(l.id+' '+(l['source-layer']||'')))).map(l=>l.id);
  const baseGroundIds=originalLayers.filter(l=>!baseBuildingIds.includes(l.id)).map(l=>l.id);
  const map=new maplibregl.Map({container:'map',style,center:[35.945,32.0],zoom:14,pitch:55,bearing:0,antialias:true});
  window.adamCityMap=map;
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-left');
  map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-left');
  const visibility=(ids,on)=>ids.forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',on?'visible':'none')});
  map.on('load',()=>{
   document.getElementById('baseGround').addEventListener('change',e=>visibility(baseGroundIds,e.target.checked));
   document.getElementById('baseBuildings').addEventListener('change',e=>visibility(baseBuildingIds,e.target.checked));
   status.textContent='خريطة طبربور جاهزة. يمكنك التحكم بالخريطة والمباني الأساسية وملفات GLB.';
  });
  map.on('error',e=>{if(e.error){status.textContent='خطأ في الخريطة: '+e.error.message;errorBox.style.display='block';errorBox.textContent=e.error.message}});
 }catch(e){status.textContent='تعذر تحميل الخريطة الأساسية.';errorBox.style.display='block';errorBox.textContent=e.message}
})();
</script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
<script>
window.addEventListener("error",function(ev){
 const target=ev.target;
 if(target && target.tagName==="SCRIPT"){
  const box=document.getElementById("error"),status=document.getElementById("status");
  if(box){box.style.display="block";box.textContent="فشل تحميل مكتبة JavaScript: "+(target.src||ev.message||"module script");}
  if(status)status.textContent="توقف تحميل نموذج windows بسبب خطأ JavaScript.";
 }
});
window.addEventListener("unhandledrejection",function(ev){
 const box=document.getElementById("error"),status=document.getElementById("status");
 if(box){box.style.display="block";box.textContent="خطأ JavaScript غير معالج: "+(ev.reason?.message||String(ev.reason));}
 if(status)status.textContent="توقف تحميل نموذج windows بسبب خطأ JavaScript.";
});
</script>





<script type="module">
/* Load the new Tabarbour GLB tiles. Keep the original test-page transform unchanged. */
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'https://cdn.jsdelivr.net/npm/meshoptimizer@0.22.0/meshopt_decoder.module.js';
(async function(){
 const status=document.getElementById('status'),errorBox=document.getElementById('error'),container=document.getElementById('glb-files');
 const base='middle%20east/BuildGLB/tabarbour-real/glb/';
 try{
  const response=await fetch(new URL(base+'manifest.json',location.href));if(!response.ok)throw new Error('Manifest HTTP '+response.status);
  const manifest=await response.json(),origin=manifest.origin;
  const map=await new Promise((resolve,reject)=>{let n=0;const check=()=>{if(window.adamCityMap?.isStyleLoaded())return resolve(window.adamCityMap);if(++n>600)return reject(new Error('انتهت مهلة انتظار الخريطة'));setTimeout(check,100)};check()});
  const anchor=maplibregl.MercatorCoordinate.fromLngLat({lng:Number(origin.longitude),lat:Number(origin.latitude)},0);
  // Restore the previously used GLB-to-MapLibre transform; do not rotate or flip the model axes.
  const meters=anchor.meterInMercatorCoordinateUnits();
  const projectedMeters=meters*Math.cos(Number(origin.latitude)*Math.PI/180);
  const glbToMap=new THREE.Matrix4().makeTranslation(anchor.x,anchor.y,anchor.z)
   .scale(new THREE.Vector3(projectedMeters,-projectedMeters,meters));
  for(const tile of manifest.tiles||[]){
   const label=document.createElement('label');label.className='row';
   const toggle=document.createElement('input');toggle.type='checkbox';toggle.id='glb-'+tile.tile;
   const title=document.createElement('span');title.textContent=tile.file+' — '+(tile.buildings||0).toLocaleString()+' مبنى';
   label.append(toggle,title);container.append(label);
   let loading=false,ready=false,model=null,renderer=null,camera=null,scene=null;
   const id='tabarbour-glb-'+tile.tile,modelUrl=new URL(base+tile.file,location.href).href;
   const layer={
    id,type:'custom',renderingMode:'3d',
    onAdd(mapInstance,gl){
     renderer=new THREE.WebGLRenderer({canvas:mapInstance.getCanvas(),context:gl,antialias:true});renderer.autoClear=false;
     camera=new THREE.Camera();scene=new THREE.Scene();scene.add(new THREE.AmbientLight(0xffffff,2.0));
     const light=new THREE.DirectionalLight(0xffffff,2.0);light.position.set(0,-70,100).normalize();scene.add(light);
     const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);
     loader.load(modelUrl,gltf=>{model=gltf.scene;model.visible=!!toggle.checked;scene.add(model);ready=true;loading=false;status.textContent='تم تحميل '+tile.file;mapInstance.triggerRepaint()},undefined,err=>{loading=false;errorBox.style.display='block';errorBox.textContent='تعذر تحميل '+tile.file+': '+(err?.message||err)});
    },
    render(gl,args){
     if(!renderer||!model||!model.visible)return;
     const values=args?.defaultProjectionData?.mainMatrix||args?.modelViewProjectionMatrix||((Array.isArray(args)||ArrayBuffer.isView(args))?args:null);
     if(!values||values.length!==16)return;
     const matrix=Array.from(values,Number);if(matrix.some(v=>!Number.isFinite(v)))return;
     const projection=new THREE.Matrix4().fromArray(matrix);
     // Keep the original axis mapping and anchor the GLB at the manifest's geographic origin.
     camera.projectionMatrix.copy(projection).multiply(glbToMap);camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
     renderer.resetState();renderer.render(scene,camera);renderer.resetState();
    }
   };
   toggle.addEventListener('change',()=>{if(toggle.checked){if(!ready&&!loading){loading=true;try{map.addLayer(layer);map.moveLayer(id)}catch(e){loading=false;errorBox.style.display='block';errorBox.textContent=e.message}}else if(model){model.visible=true;map.triggerRepaint()}}else if(model){model.visible=false;map.triggerRepaint()}});
  }
  status.textContent='تم تحميل قائمة ملفات GLB لطبربور.';
 }catch(e){errorBox.style.display='block';errorBox.textContent='تعذر تجهيز ملفات GLB: '+(e?.message||e);status.textContent='تعذر تحميل ملفات طبربور.'}
})();
</script>


</body></html>
