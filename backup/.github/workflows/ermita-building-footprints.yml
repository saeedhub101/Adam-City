name: Import public building footprints for Ermita

on:
  workflow_dispatch:
  push:
    paths:
      - "ermita/scripts/import_microsoft_building_footprints.py"

permissions:
  contents: write

concurrency:
  group: ermita-building-footprints
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry tools
        run: python -m pip install shapely
      - name: Download and clip public Philippines building footprints
        run: python ermita/scripts/import_microsoft_building_footprints.py
      - name: Upload clipped dataset even if it is too large for GitHub git storage
        uses: actions/upload-artifact@v4
        with:
          name: ermita-microsoft-building-footprints
          path: |
            ermita/maps/external/ermita-microsoft-building-footprints.geojsonl.gz
            ermita/maps/external/microsoft-building-footprints-import-report.json
          retention-days: 90
      - name: Commit clipped data and report when GitHub file-size limits allow
        run: |
          set -e
          FILE="ermita/maps/external/ermita-microsoft-building-footprints.geojsonl.gz"
          SIZE=$(stat -c%s "$FILE")
          echo "Clipped output size: $SIZE bytes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ermita/maps/external/microsoft-building-footprints-import-report.json
          if [ "$SIZE" -lt 90000000 ]; then
            git add "$FILE"
          else
            echo "Clipped data exceeds safe GitHub git blob size; it is available as a workflow artifact instead."
          fi
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Import clipped public building footprints for Ermita"
            git fetch origin main
            if ! git rebase origin/main; then
              # Resolve concurrent generated-file conflicts in favor of this fresh snapshot.
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ -n "$conflicts" ]; then
                for conflict in $conflicts; do
                  git checkout --theirs -- "$conflict"
                  git add -- "$conflict"
                done
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort
                echo "::error::Rebase failed without resolvable file conflicts."
                exit 1
              fi
            fi
            git push origin HEAD:main
          fi
