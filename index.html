<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17232b">
  <title>OpenFreeMap — Ermita</title>
  <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body,#map{width:100%;height:100%;margin:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#17232b}
    #map{position:absolute;inset:0}
    .label{position:absolute;z-index:2;top:12px;right:12px;max-width:calc(100% - 24px);padding:10px 14px;border-radius:8px;background:#17232beF;color:#f4f7f8;font-size:13px;line-height:1.6;box-shadow:0 2px 12px #0003}
    .label strong{display:block;font-size:15px}
  </style>
</head>
<body>
  <div id="map" aria-label="خريطة بيانات OpenFreeMap المحلية"></div>
  <div class="label"><strong>OpenFreeMap · Ermita</strong>مصدر واحد: بلاطات المتجهات الموجودة داخل المستودع</div>
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script>
    (() => {
      const root = '/Adam-City/ermita/maps/sources/openfreemap/vector-tiles';
      const source = 'openfreemap-local';
      const map = new maplibregl.Map({
        container: 'map',
        center: [120.9821, 14.5848],
        zoom: 14,
        pitch: 45,
        bearing: -15,
        style: {
          version: 8,
          sources: {
            [source]: {
              type: 'vector',
              tiles: [root + '/{z}/{x}/{y}.pbf'],
              minzoom: 10,
              maxzoom: 14,
              attribution: 'OpenFreeMap © OpenMapTiles · Data from OpenStreetMap'
            }
          },
          layers: [
            {id:'background',type:'background',paint:{'background-color':'#e8e5dc'}},
            {id:'landcover',type:'fill',source, 'source-layer':'landcover',paint:{'fill-color':'#dce5d2','fill-opacity':0.8}},
            {id:'landuse',type:'fill',source, 'source-layer':'landuse',paint:{'fill-color':['match',['get','class'],'park','#c6dfbd','grass','#d5e6c8','forest','#b7d4b0','residential','#e6e2d8','#e4e0d6'],'fill-opacity':0.8}},
            {id:'water',type:'fill',source,'source-layer':'water',paint:{'fill-color':'#a8d4e8'}},
            {id:'waterway',type:'line',source,'source-layer':'waterway',paint:{'line-color':'#a8d4e8','line-width':1.4}},
            {id:'transportation-casing',type:'line',source,'source-layer':'transportation',paint:{'line-color':'#c7c1b7','line-width':['interpolate',['linear'],['zoom'],10,0.5,14,4]}},
            {id:'transportation',type:'line',source,'source-layer':'transportation',paint:{'line-color':'#fffdf8','line-width':['interpolate',['linear'],['zoom'],10,0.2,14,2.8]}},
            {id:'building',type:'fill-extrusion',source,'source-layer':'building',minzoom:13,'filter':['==',['geometry-type'],'Polygon'],paint:{
              'fill-extrusion-color':'#c9bfb0',
              'fill-extrusion-height':['coalesce',['to-number',['get','render_height']],['to-number',['get','height']],['*',['to-number',['get','render_height']],1],3],
              'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height']],0],
              'fill-extrusion-opacity':0.9
            }},
            {id:'place-label',type:'symbol',source,'source-layer':'place',layout:{'text-field':['coalesce',['get','name:en'],['get','name']],'text-font':['Open Sans Regular'],'text-size':['interpolate',['linear'],['zoom'],10,10,15,14]},paint:{'text-color':'#39434a','text-halo-color':'#f8f6f0','text-halo-width':1.2}},
            {id:'road-label',type:'symbol',source,'source-layer':'transportation_name',layout:{'symbol-placement':'line','text-field':['coalesce',['get','name:en'],['get','name']],'text-font':['Open Sans Regular'],'text-size':10},paint:{'text-color':'#5b5a55','text-halo-color':'#fffdf8','text-halo-width':1}}
          ]
        }
      });
      map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-left');
      map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-left');
      map.on('error', event => console.error('OpenFreeMap local tiles:', event.error || event));
    })();
  </script>
</body>
</html>
