<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820">
<title>ADAM CITY | معاينة المدينة</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#17232d;--line:#2c3c48;--text:#f2f6f8;--muted:#9aabb6;--accent:#78e3bf}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{height:100%;width:100%;position:relative}
#map{position:absolute;inset:0;background:#d5e0e2}
.toolbar{position:absolute;z-index:5;top:14px;right:14px;width:min(290px,calc(100vw - 28px));padding:14px;background:#111c25f2;border:1px solid #334651;border-radius:14px;box-shadow:0 10px 35px #0004;backdrop-filter:blur(12px)}
.brand{font-weight:850;font-size:17px;letter-spacing:.08em;direction:ltr;text-align:right}.brand span{color:var(--accent)}
.sub{font-size:11px;color:var(--muted);margin:3px 0 13px}
.label{font-size:11px;color:#bdcbd3;margin-bottom:8px}
.sources{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{border:1px solid #344754;background:#1c2b36;color:#e7eef2;border-radius:9px;padding:10px 8px;font:inherit;font-size:12px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent)}
button.active{background:var(--accent);color:#092119;border-color:var(--accent);font-weight:750}
button:disabled{opacity:.5;cursor:not-allowed}
.source-status{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6;min-height:18px}
.keybox{display:none;margin-top:10px;gap:7px}.keybox.show{display:grid}
input{width:100%;min-width:0;border:1px solid #344754;border-radius:8px;padding:10px;background:#0c151d;color:#fff;font:inherit;font-size:12px}
.map-caption{position:absolute;z-index:4;bottom:15px;right:15px;max-width:calc(100vw - 30px);padding:9px 12px;border:1px solid #344754;border-radius:10px;background:#111c25eF;font-size:11px;color:#dce6eb;pointer-events:none}
.maplibregl-ctrl-group{overflow:hidden;border-radius:9px!important}
@media(max-width:560px){.toolbar{top:8px;right:8px;width:min(265px,calc(100vw - 16px));padding:11px}.map-caption{bottom:8px;right:8px;font-size:10px}}
</style>
</head>
<body>
<main>
<div id="map" aria-label="خريطة معاينة المدينة"></div>
<section class="toolbar" aria-label="اختيار مصدر بيانات الخريطة">
 <div class="brand">ADAM <span>CITY</span></div>
 <div class="sub">معاينة المدينة · Manila, Philippines</div>
 <div class="label">اختر مصدر بيانات الخريطة</div>
 <div class="sources">
  <button type="button" class="active" data-source="osm">OpenStreetMap</button>
  <button type="button" data-source="ofm">OpenFreeMap</button>
  <button type="button" data-source="ms">Microsoft Maps</button>
 </div>
 <div class="keybox" id="keybox">
  <input id="mskey" type="password" autocomplete="off" placeholder="أدخل Microsoft Maps API key" aria-label="Microsoft Maps API key">
  <button type="button" id="applykey">تطبيق المفتاح</button>
 </div>
 <div class="source-status" id="status" role="status">المصدر الحالي: OpenStreetMap</div>
</section>
<div class="map-caption">MANILA · 14.5995° N, 120.9842° E</div>
</main>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
const center=[120.9842,14.5995],status=document.getElementById('status'),keybox=document.getElementById('keybox');
const osmStyle={version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]};
const ofmStyle='https://tiles.openfreemap.org/styles/liberty';
let map;
function showStatus(s){status.textContent=s}
function init(style){if(map)map.remove();map=new maplibregl.Map({container:'map',style,center,zoom:12.5,pitch:48,bearing:-15,antialias:true});map.addControl(new maplibregl.NavigationControl({showCompass:true}),'bottom-left');map.addControl(new maplibregl.ScaleControl({maxWidth:100,unit:'metric'}),'bottom-left');map.on('error',e=>{if(e&&e.error)showStatus('تعذر تحميل بعض بيانات المصدر؛ تحقق من الاتصال أو إعدادات المصدر.')});}
function selectSource(source){
 document.querySelectorAll('[data-source]').forEach(b=>b.classList.toggle('active',b.dataset.source===source));
 keybox.classList.toggle('show',source==='ms');
 if(source==='osm'){init(osmStyle);showStatus('المصدر الحالي: OpenStreetMap. يتم تحميل خريطة الشوارع مباشرة.')}
 else if(source==='ofm'){init(ofmStyle);showStatus('المصدر الحالي: OpenFreeMap. قد يستغرق تحميل الخريطة لحظات.')}
 else {showStatus('Microsoft Maps يحتاج مفتاح API صالحًا. أدخله أدناه لتجربة طبقة الصور الجوية.')}
}
document.querySelectorAll('[data-source]').forEach(b=>b.addEventListener('click',()=>selectSource(b.dataset.source)));
document.getElementById('applykey').addEventListener('click',()=>{
 const key=document.getElementById('mskey').value.trim();
 if(!key){showStatus('أدخل مفتاح Microsoft Maps API أولًا.');return}
 const quadkey='https://ecn.t3.tiles.virtualearth.net/tiles/a{quadkey}.jpeg?g=1&key='+encodeURIComponent(key);
 const style={version:8,sources:{bing:{type:'raster',tiles:[quadkey],tileSize:256,attribution:'Microsoft Bing Maps'}},layers:[{id:'bing-aerial',type:'raster',source:'bing'}]};
 init(style);showStatus('تم إعداد طلب طبقة Microsoft Maps. إذا لم تظهر الصور، تحقق من صلاحية المفتاح وخدمة الخرائط المفعّلة.');
});
init(osmStyle);
})();
</script>
</body>
</html>
