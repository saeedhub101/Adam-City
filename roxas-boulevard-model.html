<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roxas Boulevard — 3D Buildings | ADAM CITY</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:#f3f5f7}
#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.panel{position:fixed;z-index:2;left:16px;top:16px;width:min(350px,calc(100vw - 32px));padding:16px 17px;background:rgba(16,22,29,.88);border:1px solid rgba(255,255,255,.14);border-radius:14px;backdrop-filter:blur(12px);box-shadow:0 12px 40px #0005}
h1{font-size:17px;line-height:1.25;margin:0 0 6px;font-weight:700}.sub{font-size:12px;color:#aeb9c5;line-height:1.5;margin-bottom:12px}
.status{font-size:12px;line-height:1.5;color:#d9e4ee;overflow-wrap:anywhere}.status.error{color:#ffb0a8}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:1px solid #526170;background:#273440;color:#fff;border-radius:8px;padding:8px 11px;font:inherit;font-size:12px;cursor:pointer}
button:hover{background:#354756}
.hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);text-align:center;padding:9px 13px;border-radius:10px;background:#10161dcc;color:#c4d0db;font-size:11px;white-space:nowrap}
a{color:#9dd7ff}
@media(max-width:600px){.panel{top:10px;left:10px;padding:13px;width:min(330px,calc(100vw - 20px))}h1{font-size:15px}.hint{font-size:10px;white-space:normal;width:calc(100vw - 24px)}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}</script>
</head>
<body>
<div id="view"></div>
<section class="panel">
<h1>Roxas Boulevard — 3D Buildings</h1>
<div class="sub">ADAM CITY · Standalone GLB viewer · Manila, Philippines</div>
<div id="status" class="status" role="status" aria-live="polite">Preparing 3D scene…</div>
<div class="actions"><button id="fit">Fit model</button><button id="top">Top view</button><button id="reset">Reset view</button><button id="wire">Wireframe</button></div>
<div class="sub" style="margin:12px 0 0">Model file: <a href="complete_data/OSM/data/buildings/roxas-boulevard/roxas%20bulivard%20buildings.glb">open GLB directly</a></div>
</section>
<div class="hint">Drag to orbit · Scroll/pinch to zoom · Right-drag to pan</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const host=document.querySelector('#view'), status=document.querySelector('#status');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x10151b);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100000);
camera.position.set(500,450,650);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.screenSpacePanning=true;
scene.add(new THREE.HemisphereLight(0xe5f1ff,0x55515a,2.0));
const key=new THREE.DirectionalLight(0xfff0dc,3.0);key.position.set(-400,800,500);scene.add(key);
const fill=new THREE.DirectionalLight(0xa9cfff,1.5);fill.position.set(600,300,-500);scene.add(fill);
const ground=new THREE.GridHelper(2000,80,0x526170,0x303b46);ground.material.transparent=true;ground.material.opacity=.24;scene.add(ground);
let model=null, originalMaterials=[], wire=false, center=new THREE.Vector3(), radius=200;
function setStatus(t,err=false){status.textContent=t;status.classList.toggle('error',err)}
function fit(top=false){
 if(!model)return;
 const box=new THREE.Box3().setFromObject(model);
 if(box.isEmpty()){setStatus('The GLB loaded but contains no visible geometry.',true);return}
 box.getCenter(center);const size=box.getSize(new THREE.Vector3());radius=Math.max(size.length()*.5,10);
 controls.target.copy(center);
 const distance=radius/Math.sin(THREE.MathUtils.degToRad(camera.fov*.5))*1.18;
 if(top) camera.position.set(center.x,center.y+distance,center.z+.01);
 else camera.position.set(center.x+distance*.8,center.y+distance*.58,center.z+distance*.95);
 camera.near=Math.max(.1,radius/10000);camera.far=Math.max(10000,radius*100);camera.updateProjectionMatrix();controls.update();
 ground.position.set(center.x,box.min.y-.8,center.z);ground.scale.setScalar(Math.max(1,radius/500));
}
setStatus('Loading the Roxas Boulevard GLB…');
const modelUrl=new URL('complete_data/OSM/data/buildings/roxas-boulevard/roxas%20bulivard%20buildings.glb',document.baseURI).href;
new GLTFLoader().load(modelUrl,gltf=>{
 model=gltf.scene;scene.add(model);
 model.traverse(o=>{if(o.isMesh){o.frustumCulled=true;if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats){originalMaterials.push({m,wire:m.wireframe});if('envMapIntensity'in m)m.envMapIntensity=1.15;m.needsUpdate=true;}}}});
 fit();setStatus('Model loaded successfully. Rotate or zoom to inspect the buildings.');
},xhr=>{if(xhr.total)setStatus('Loading model… '+Math.round(xhr.loaded/xhr.total*100)+'%');else setStatus('Downloading model… '+Math.round(xhr.loaded/1024/1024)+' MB')},err=>{console.error(err);setStatus('Could not load the GLB. Check network access and reload. Details: '+(err?.message||'unknown error'),true)});
document.querySelector('#fit').onclick=()=>fit(false);
document.querySelector('#top').onclick=()=>fit(true);
document.querySelector('#reset').onclick=()=>fit(false);
document.querySelector('#wire').onclick=()=>{wire=!wire;for(const x of originalMaterials){if('wireframe'in x.m){x.m.wireframe=wire;x.m.needsUpdate=true}}};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body></html>
